  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>

  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };

    let jw = null;
    let streamData = null;
    let eventStartTime = null;
    let eventEndTime = null;

    // === THEME TOGGLE – RESTORED EXACTLY AS BEFORE ===
    const htmlEl = document.documentElement;
    const themeToggle = document.getElementById('themeToggle');
    const savedTheme = localStorage.getItem('theme') || 'dark';
    htmlEl.setAttribute('data-bs-theme', savedTheme);
    themeToggle.innerHTML = savedTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';

    themeToggle.addEventListener('click', () => {
      const current = htmlEl.getAttribute('data-bs-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-bs-theme', next);
      localStorage.setItem('theme', next);
      themeToggle.innerHTML = next === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    });

    function clearError() {
      const e = document.getElementById('errorContainer');
      if (e && !e.classList.contains('d-none')) {
        e.classList.add('fade-out');
        setTimeout(() => { e.className = 'alert alert-danger error-alert mt-3 d-none'; e.innerHTML = ''; }, 500);
      }
    }

    async function isM3U8(url) {
      if (url.toLowerCase().includes('.m3u8')) return true;
      try {
        const r = await fetch(url, {method:'HEAD'});
        const ct = r.headers.get('content-type') || '';
        return ct.includes('application/vnd.apple.mpegurl');
      } catch { return false; }
    }

    async function playStream(url) {
      if (jw) { jw.remove(); jw = null; }

      const useJW = await isM3U8(url);

      if (useJW) {
        document.getElementById('embedPlayer').style.display = 'none';
        document.getElementById('jwplayer-div').style.display = 'block';

        jw = jwplayer('jwplayer-div').setup({
          file: url,
          width: '100%',
          height: '100%',
          autostart: true,
          mute: false,
          stretching: 'uniform',
          primary: 'html5',
          hlsjsConfig: { enableWorker: true },
          controls: true,
          displaytitle: false,
          pipIcon: 'enabled',
          captions: { color: '#fff', backgroundOpacity: 50 }
        });
        jw.on('ready', clearError);
        jw.on('error', () => {
          document.getElementById('errorContainer').classList.remove('d-none');
          document.getElementById('errorContainer').innerHTML = 'Stream failed – try another source';
        });
      } else {
        document.getElementById('jwplayer-div').style.display = 'none';
        const iframe = document.getElementById('embedPlayer');
        iframe.style.display = 'block';
        const u = new URL(url);
        u.searchParams.set('autoplay', '1');
        iframe.src = u.toString();

        // Hide real src from inspector after short delay
        setTimeout(() => {
          iframe.src = 'about:blank';
          iframe.removeAttribute('src');
        }, 800);
      }
    }

    function populateStreamButtons(event) {
      const container = document.getElementById('streamLinks');
      container.innerHTML = event.streams.map((s, i) => {
        const url = typeof s === 'string' ? s : s.url;
        const title = s.title || `Stream ${i+1}`;
        return `<button class="btn btn-stream ${i===0?'active':''}" data-stream-encoded="${btoa(url)}" data-stream-index="${i}">${title}</button>`;
      }).join('');

      container.addEventListener('click', async e => {
        const btn = e.target.closest('.btn-stream');
        if (!btn) return;
        const url = atob(btn.dataset.streamEncoded);
        playStream(url);
        container.querySelectorAll('.btn-stream').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    }

    function updateStreamButtonVisibility() {
      const now = Math.floor(Date.now() / 1000);
      const btn = document.getElementById('startLivestream');

      if (!eventStartTime || !eventEndTime) {
        btn.style.display = 'none';
        return;
      }

      const isLiveNow = now >= eventStartTime && now <= eventEndTime;

      if (isLiveNow) {
        btn.style.display = 'inline-block';
        btn.disabled = false;
        btn.textContent = 'Click to Start Livestream';
      } else {
        btn.style.display = 'none';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      const titleEl = document.getElementById('eventTitle');
      const startBtn = document.getElementById('startLivestream');

      fetch('/api/stream')
        .then(r => r.json())
        .then(data => {
          if (!data.success) throw new Error('Invalid response');

          let event = null;
          for (const cat of data.streams) {
            event = cat.streams.find(s => s.uri_name === uriName);
            if (event) break;
          }
          if (!event) throw new Error('Event not found');

          titleEl.textContent = event.name;
          streamData = event;

          // Set start/end times (using your existing +03:00 logic)
          try {
            eventStartTime = new Date(event.starts_at + '+03:00').getTime() / 1000;
            eventEndTime = event.ends_at 
              ? new Date(event.ends_at + '+03:00').getTime() / 1000 
              : eventStartTime + 3 * 3600; // fallback 3 hours
          } catch (e) {
            eventStartTime = Date.now() / 1000;
            eventEndTime = eventStartTime + 3 * 3600;
          }

          // Initial check + periodic update
          updateStreamButtonVisibility();
          setInterval(updateStreamButtonVisibility, 30000); // check every 30s

          startBtn.onclick = () => {
            document.querySelector('.video-container').style.display = 'block';
            startBtn.style.display = 'none'; // hide after click
            document.getElementById('fullscreenBtn').classList.remove('d-none');
            const firstUrl = event.streams[0].url || event.streams[0];
            playStream(firstUrl);
            populateStreamButtons(event);
          };
        })
        .catch(() => {
          titleEl.textContent = 'Stream Not Found';
          document.getElementById('errorContainer').classList.remove('d-none');
          document.getElementById('errorContainer').innerHTML = 'This stream is not available.';
        });

      document.getElementById('fullscreenBtn').addEventListener('click', () => {
        const el = document.getElementById('jwplayer-div').style.display !== 'none'
          ? document.getElementById('jwplayer-div')
          : document.getElementById('embedPlayer');
        if (el.requestFullscreen) el.requestFullscreen();
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else if (el.msRequestFullscreen) el.msRequestFullscreen();
      });

      // Chat – unchanged
      setTimeout(() => {
        const c = document.querySelector('.chat-container');
        const l = document.getElementById('chatLoading');
        const i = document.createElement('iframe');
        i.src = 'https://www5.cbox.ws/box/?boxid=958103&boxtag=ElAMjb';
        i.style = 'width:100%;height:100%;border:none;';
        i.onload = () => l.style.display = 'none';
        c.appendChild(i);
      }, 1000);

      // Tip countdown – exactly as before
      let sec = 10;
      const timer = document.getElementById('countdownTimer');
      const iv = setInterval(() => {
        sec--;
        timer.textContent = sec + 's';
        if (sec <= 0) {
          clearInterval(iv);
          document.querySelector('.alert-info').classList.add('fade-out');
          setTimeout(() => document.querySelector('.tip-container').style.height = '0', 500);
        }
      }, 1000);
    });
  </script>
