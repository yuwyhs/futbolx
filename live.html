  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    let embedPlayer = null;
    let videoPlayerInstance = null;
    let shakaPlayerInstance = null;
    let streamData = null;

    // Block popups
    const originalOpen = window.open;
    window.open = function(url) {
      console.log('Blocked popup attempt to:', url);
      return null;
    };

    // Clear error
    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    // Tip countdown
    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      let seconds = 10;
      if (!tipContainer || !tipAlert || !countdownTimer) return;
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;
      const interval = setInterval(() => {
        seconds--;
        countdownTimer.textContent = `${seconds}s`;
        if (seconds <= 0) {
          clearInterval(interval);
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
    }

    // Offcanvas + Theme
    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      if (!offcanvasElement || !toggler) return;
      if (typeof bootstrap === 'undefined') return;
      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement);
        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', () => offcanvas.hide());
        });
      } catch (e) { console.error(e); }
    }

    function initThemeToggle() {
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      if (!themeToggle || !htmlElement) return;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      themeToggle.addEventListener('click', () => {
        const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      });
    }

    // Stream type detection
    async function detectStreamType(url) {
      if (url.includes('.m3u8')) return 'm3u8';
      if (url.includes('.mpd')) return 'mpd';
      try {
        const res = await fetch(url, { method: 'GET', headers: { 'Range': 'bytes=0-1023' }, signal: AbortSignal.timeout(5000) });
        if (!res.ok) return 'iframe';
        const text = await res.text();
        if (text.includes('#EXTM3U') || text.includes('.ts')) return 'm3u8';
        if (text.includes('<MPD')) return 'mpd';
        return 'iframe';
      } catch {
        return 'iframe';
      }
    }

    // Player init
    async function initPlayer(eventData, errorContainer, streamLinks) {
      clearError();
      embedPlayer = document.getElementById('embedPlayer');
      const videoContainer = document.getElementById('videoPlayerContainer');
      const clapprEl = document.getElementById('videoPlayer');
      const shakaEl = document.getElementById('shakaPlayer');
      const firstStream = eventData.streams[0];
      const url = typeof firstStream === 'string' ? firstStream : firstStream.url;
      const type = await detectStreamType(url);

      if (type === 'm3u8') {
        embedPlayer.style.display = 'none';
        shakaEl.classList.add('d-none');
        videoContainer.classList.remove('d-none');
        clapprEl.classList.remove('d-none');
        if (videoPlayerInstance) videoPlayerInstance.destroy();
        videoPlayerInstance = new Clappr.Player({
          source: url,
          parentId: '#videoPlayer',
          width: '100%',
          height: '100%',
          autoPlay: true,
          mute: false,
          playback: { name: 'hlsjs_playback', hlsjsConfig: { enableWorker: false } },
          events: { onReady: () => { clearError(); videoPlayerInstance.play(); } }
        });
      } else if (type === 'mpd') {
        embedPlayer.style.display = 'none';
        clapprEl.classList.add('d-none');
        videoContainer.classList.remove('d-none');
        shakaEl.classList.remove('d-none');
        if (videoPlayerInstance) videoPlayerInstance.destroy();
        if (shakaPlayerInstance) shakaPlayerInstance.destroy();
        shaka.polyfill.installAll();
        const video = document.createElement('video');
        video.id = 'shakaVideo';
        video.controls = true;
        shakaEl.innerHTML = '';
        shakaEl.appendChild(video);
        shakaPlayerInstance = new shaka.Player(video);
        shakaPlayerInstance.load(url);
      } else {
        videoContainer.classList.add('d-none');
        embedPlayer.style.display = 'block';
        const u = new URL(url);
        u.searchParams.append('autoplay', '1');
        embedPlayer.src = u.toString();
      }

      // Stream buttons
      streamLinks.innerHTML = eventData.streams.map((s, i) => {
        const u = typeof s === 'string' ? s : s.url;
        const t = u.includes('.m3u8') ? 'm3u8' : u.includes('.mpd') ? 'mpd' : 'iframe';
        return `<button class="btn btn-stream ${i===0?'active':''}" data-url="${u}" data-type="${t}">${s.title || 'Stream '+(i+1)}</button>`;
      }).join('');

      streamLinks.addEventListener('click', async e => {
        const btn = e.target.closest('.btn');
        if (!btn) return;
        const u = btn.dataset.url;
        const t = btn.dataset.type;
        streamLinks.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (t === 'm3u8') {
          if (videoPlayerInstance) videoPlayerInstance.destroy();
          videoPlayerInstance = new Clappr.Player({ source: u, parentId: '#videoPlayer', autoPlay: true });
        } else if (t === 'mpd') {
          if (shakaPlayerInstance) shakaPlayerInstance.destroy();
          const v = document.getElementById('shakaVideo');
          shakaPlayerInstance = new shaka.Player(v);
          shakaPlayerInstance.load(u);
        } else {
          const url = new URL(u);
          url.searchParams.append('autoplay', '1');
          embedPlayer.src = url.toString();
        }
      });

      // Fullscreen
      const fsBtn = document.getElementById('fullscreenBtn');
      fsBtn.classList.remove('d-none');
      fsBtn.onclick = () => {
        const el = type === 'm3u8' ? clapprEl : type === 'mpd' ? shakaEl : embedPlayer;
        (el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen).call(el);
      };

      // Timer
      const timer = document.getElementById('eventTimer');
      timer.classList.remove('d-none');
      const start = new Date(eventData.starts_at + '+03:00').getTime() / 1000;
      const update = () => {
        const now = Date.now() / 1000;
        if (now < start) {
          timer.innerHTML = `<span>${eventData.name}</span> | <span>Starting soon</span>`;
        } else {
          const elapsed = now - start;
          const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
          const m = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
          const s = Math.floor(elapsed % 60).toString().padStart(2, '0');
          timer.innerHTML = `<span>${eventData.name}</span> | <span>${h}:${m}:${s}</span>`;
        }
      };
      update();
      setInterval(update, 1000);
    }

    // Load event
    function loadEvent() {
      const uri = window.location.pathname.split('/').pop();
      fetch('/api/stream')
        .then(r => r.json())
        .then(data => {
          let event = null;
          data.streams.forEach(cat => {
            cat.streams.forEach(s => { if (s.uri_name === uri) event = s; });
          });
          if (!event) throw new Error('Event not found');
          document.getElementById('eventTitle').textContent = event.name;
          streamData = event;
          initPlayer(event, document.getElementById('errorContainer'), document.getElementById('streamLinks'));
          document.getElementById('startLivestream').disabled = true;
          document.getElementById('startLivestream').textContent = 'Live';
        })
        .catch(err => {
          document.getElementById('errorContainer').className = 'alert alert-danger error-alert mt-3';
          document.getElementById('errorContainer').textContent = 'Failed to load event: ' + err.message;
        });
    }

    // Load chat
    function loadChat() {
      const chatFrame = document.createElement('iframe');
      chatFrame.src = 'https://www.twitch.tv/embed/futbolx/chat?parent=futbol-x.site';
      chatFrame.onload = () => document.getElementById('chatLoading').style.display = 'none';
      document.querySelector('.chat-container').appendChild(chatFrame);
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initOffcanvas();
      startTipCountdown();
      loadEvent();
      loadChat();
    });
  </script>
  <!-- Snow Script – Real Icons -->
  <script>
    const snowContainer = document.getElementById("snow-container");
    const snowContent = ["snowflake", "snowflake", "snowflake"];

    const random = (num) => Math.floor(Math.random() * num);

    const getRandomStyles = () => {
      const top = random(100);
      const left = random(100);
      const dur = random(10) + 10;
      const size = random(25) + 25;
      return `top: -${top}%; left: ${left}%; font-size: ${size}px; animation-duration: ${dur}s;`;
    };

    const createSnow = (num) => {
      for (let i = 0; i < num; i++) {
        const snow = document.createElement("div");
        snow.className = "snow";
        snow.style.cssText = getRandomStyles();
        snow.innerHTML = snowContent[random(3)];
        snowContainer.appendChild(snow);
      }
    };

    window.addEventListener("load", () => createSnow(30));
  </script>
