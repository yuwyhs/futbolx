    .tip-container {
      max-width: 600px;

    .alert-info {
      text-align: center;

    #countdownTimer {

      top: 8px;

      font-weight: bold;

    [data-bs-theme="light"] #countdownTimer {
      color: #e63939;
    }
    .error-alert {
      max-width: 500px;
      margin: 20px auto;
    }
    .fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .btn-fullscreen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 20px;
      margin-left: 10px;
      transition: transform 0.3s, background 0.3s;
    }
    [data-bs-theme="light"] .btn-fullscreen {
      background: #e63939;
      color: #333;
    }
    .btn-fullscreen:hover {
      transform: scale(1.05);
      background: #e63939;
    }
    [data-bs-theme="light"] .btn-fullscreen:hover {
      background: #cc3333;
    }
    .offcanvas {
      z-index: 1055 !important;
    }
    .offcanvas-backdrop {
      z-index: 1050 !important;
      background-color: rgba(0, 0, 0, 0.5);
    }
    .offcanvas .nav-link, .offcanvas .btn-link, .offcanvas button {
      cursor: pointer !important;
    }
    .offcanvas .nav-item {
      position: relative;
    }
  </style>
</head>
<body>

        <li class="nav-item"><button class="nav-link btn btn-link d-none" id="logoutButton">Logout</button></li>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <div class="tip-container">
            <div class="alert alert-info">
              <strong>Tip:</strong> For an ad-free experience, consider installing an ad blocker like
              <a href="https://ublockorigin.com" target="_blank" rel="noopener">uBlock Origin</a> or
              <a href="https://adguard.com" target="_blank" rel="noopener">AdGuard</a>.
              <span id="countdownTimer">10s</span>
            </div>
          </div>
          <div class="d-flex align-items-center mb-3">
            <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7 Streams</a>
            <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
          </div>
          <h2 id="eventTitle" class="mb-3"></h2>
          <div class="player-container">
            <div class="video-container">
              <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="width: 100%; height: 100%;" allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
              <div id="videoPlayerContainer" style="width: 100%; height: 100%;">
                <video id="videoPlayer" class="d-none" controls></video>
              </div>

            <div class="stream-dropdown">
              <div class="dropdown">
                <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  Select Stream
                </button>
                <ul class="dropdown-menu" id="streamDropdownMenu" aria-labelledby="streamDropdown">
                  </ul>
              </div>
            </div>
          </div>
          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary text-center text-lg-start">FutbolX 2025</p>
        <ul class="nav justify-content-center justify-content-lg-end mb-0">
          <li class="nav-item"><a href="/api" class="nav-link px-2 text-body-secondary">API</a></li>
          <li class="nav-item"><a href="https://discord.gg/CmRcPbBB2k" class="nav-link px-2 text-body-secondary">Discord</a></li>
          <li class="nav-item"><a href="/changelog" class="nav-link px-2 text-body-secondary">Changelog</a></li>
          <li class="nav-item"><a href="/vip" class="nav-link px-2 text-body-secondary">Donate / VIP Access</a></li>
          <li class="nav-item"><a href="/contact" class="nav-link px-2 text-body-secondary">Contact us</a></li>
        </ul>
      </footer>

  </div>
  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script defer src="/assets/js/api.js"></script>
  <script defer src="/assets/js/auth.js"></script>
  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    let embedPlayer = null;
    let videoPlayerInstance = null;
    let streamData = null;
    let currentStreamIndex = 0;
    let countdownInterval = null;

    // Block popups
    const originalOpen = window.open;
    window.open = function(url) {
      console.log('Blocked popup attempt to:', url);
      return null;
    };

    // Clear error messages
    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    // Tip countdown
    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      if (!tipContainer || !tipAlert || !countdownTimer) return;
      if (countdownInterval) clearInterval(countdownInterval);
      let seconds = 10;
      countdownTimer.textContent = `${seconds}s`;
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;
      countdownInterval = setInterval(() => {
        seconds--;
        if (seconds >= 0) countdownTimer.textContent = `${seconds}s`;
        if (seconds <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
    }

    // Initialize offcanvas
    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      if (!offcanvasElement || typeof bootstrap === 'undefined') return;
      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement);
        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            const href = link.getAttribute('href');
            if (href) {
              window.location.href = href;
              offcanvas.hide();
            }
          });
        });
      } catch (error) { console.error('Offcanvas error:', error); }
    }

    // Initialize theme toggle
    function initThemeToggle() {
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      if (!themeToggle) return;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      themeToggle.addEventListener('click', () => {
        const theme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-bs-theme', theme);
        localStorage.setItem('theme', theme);
        themeToggle.innerHTML = theme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      });
    }

    // Detect M3U8
    async function isM3U8Stream(url) {
      if (url.toLowerCase().includes('.m3u8')) return true;
      try {
        const response = await fetch(url, { method: 'HEAD', signal: AbortSignal.timeout(3000) });
        return response.headers.get('content-type')?.includes('mpegurl') || false;
      } catch { return false; }
    }

    // Initialize player
    async function initPlayer(event, streamIndex, errorContainer) {
      try {
        clearError();
        const embedPlayer = document.getElementById('embedPlayer');
        const videoContainer = document.getElementById('videoPlayerContainer');
        const stream = event.streams[streamIndex];
        const streamUrl = stream.url;
        const isM3U8 = await isM3U8Stream(streamUrl);

        if (isM3U8) {
          embedPlayer.style.display = 'none';
          videoContainer.style.display = 'block';
          if (videoPlayerInstance) videoPlayerInstance.remove();
          
          videoPlayerInstance = jwplayer('videoPlayerContainer').setup({
            file: streamUrl,
            autostart: true,
            mute: true,
            width: '100%',
            aspectratio: '16:9',
            controls: true
          });
          
          videoPlayerInstance.on('ready', () => {
            videoPlayerInstance.setMute(false);
          });
          
          videoPlayerInstance.on('error', (e) => {
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load stream (JW Error): ' + e.message;
          });
        } else {
          videoContainer.style.display = 'none';
          embedPlayer.style.display = 'block';
          if (videoPlayerInstance) {
            videoPlayerInstance.remove();
            videoPlayerInstance = null;
          }
          embedPlayer.src = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'autoplay=1';
        }

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
          fullscreenBtn.classList.remove('d-none');
          fullscreenBtn.onclick = () => {
            const target = isM3U8 ? document.getElementById('videoPlayerContainer') : embedPlayer;
            if (target.requestFullscreen) target.requestFullscreen();
            else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
          };
        }
      } catch (err) {
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Initialization error: ' + err.message;
      }
    }

    function populateStreamDropdown(streams) {
      const dropdownMenu = document.getElementById('streamDropdownMenu');
      const dropdownButton = document.getElementById('streamDropdown');
      if (!dropdownMenu) return;
      dropdownMenu.innerHTML = '';
      streams.forEach((stream, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item" href="#">${stream.label || 'Stream ' + (index + 1)}</a>`;
        li.onclick = (e) => {
          e.preventDefault();
          currentStreamIndex = index;
          dropdownButton.textContent = stream.label || 'Stream ' + (index + 1);
          initPlayer(streamData, index, document.getElementById('errorContainer'));
        };
        dropdownMenu.appendChild(li);
      });
    }

    function initPage() {
      const errorContainer = document.getElementById('errorContainer');
      const eventTitle = document.getElementById('eventTitle');
      const uriName = window.location.pathname.split('/').pop();
      
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          const allStreams = [];
          Object.keys(data.streams).forEach(cat => allStreams.push(...data.streams[cat]));
          const event = allStreams.find(s => s.uri_name === uriName);
          if (!event) throw new Error('Stream not found');
          
          eventTitle.innerText = event.name;
          streamData = event;
          populateStreamDropdown(event.streams);
          initPlayer(event, 0, errorContainer);
        })
        .catch(err => {
          errorContainer.className = 'alert alert-danger error-alert mt-3';
          errorContainer.innerText = err.message;
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initOffcanvas();
      startTipCountdown();
      initPage();
    });
  </script>
</body>
</html>
