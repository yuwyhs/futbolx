  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const AD_LINK = "https://omg10.com/4/10664814";
    let adFlags = { start: false, fakePlayer: false, fullscreen: false };
    
    let playerInstance = null;
    let streamStarted = false;
    let eventStartTime = null;

    // --- MONETAG LOGIC ---
    function openAd() {
      window.open(AD_LINK, '_blank');
    }

    // --- PLAYER INITIALIZATION ---
    async function playStream(url) {
      if (playerInstance) { playerInstance.remove(); playerInstance = null; }
      
      const isM3U8 = url.toLowerCase().includes('.m3u8');
      const overlay = document.getElementById('fake-player-overlay');
      
      // Reset Fake Player State for every new stream
      overlay.style.display = 'flex';
      adFlags.fakePlayer = false;

      overlay.onclick = () => {
        if (!adFlags.fakePlayer) {
          openAd();
          adFlags.fakePlayer = true;
          overlay.style.display = 'none';
          initRealPlayer(url, isM3U8);
        }
      };
    }

    function initRealPlayer(url, isM3U8) {
      if (isM3U8) {
        document.getElementById('embedPlayer').style.display = 'none';
        const container = document.getElementById('oplayer-container');
        container.style.display = 'block';
        container.innerHTML = '<div id="jw-player"></div>';

        playerInstance = jwplayer("jw-player").setup({
          file: url, autostart: true, width: "100%", aspectratio: "16:9"
        });
        playerInstance.on('ready', () => {
          document.getElementById('fullscreenBtn').classList.remove('d-none');
        });
      } else {
        document.getElementById('oplayer-container').style.display = 'none';
        const iframe = document.getElementById('embedPlayer');
        iframe.style.display = 'block';
        iframe.src = url;
      }
    }

    // --- BUTTONS LOGIC ---
    document.getElementById('startLivestream').onclick = function() {
      if (!adFlags.start) {
        openAd();
        adFlags.start = true;
      }
      document.getElementById('mainVideoContainer').style.display = 'block';
      document.getElementById('streamLinks').style.display = 'block';
      this.style.display = 'none';
      streamStarted = true;
      // Trigger first stream
      const uriName = window.location.pathname.split('/').pop();
      loadEventData(uriName);
    };

    document.getElementById('fullscreenBtn').onclick = function() {
      if (!adFlags.fullscreen) {
        openAd();
        adFlags.fullscreen = true;
      } else {
        if (playerInstance) playerInstance.setFullscreen(true);
      }
    };

    // --- CORE LOGIC ---
    async function loadEventData(uri) {
      try {
        const catRes = await fetch('/api/stream').then(r => r.json());
        const categories = catRes.categories || [];
        let found = null;

        for (const cat of categories) {
          const data = await fetch(`/api/${cat}.json`).then(r => r.json());
          for (const grp of data.streams) {
            found = grp.streams.find(s => s.uri_name === uri);
            if (found) break;
          }
          if (found) break;
        }

        if (found) {
          document.getElementById('eventTitle').textContent = found.name;
          eventStartTime = new Date(found.starts_at + '+03:00').getTime() / 1000;
          if (streamStarted) {
            playStream(found.streams[0].url);
            populateButtons(found.streams);
          }
        }
      } catch (e) { console.error(e); }
    }

    function populateButtons(streams) {
      const container = document.getElementById('streamLinks');
      container.innerHTML = streams.map((s, i) => `<button class="btn btn-stream ${i===0?'active':''}" data-url="${s.url}">${s.title || 'Stream '+(i+1)}</button>`).join('');
      container.onclick = (e) => {
        const btn = e.target.closest('.btn-stream');
        if (btn) playStream(btn.dataset.url);
      };
    }

    function updateTimer() {
      if (streamStarted || !eventStartTime) return;
      const now = Math.floor(Date.now() / 1000);
      const diff = eventStartTime - now;
      if (diff <= 0) {
        document.getElementById('statusArea').style.display = 'none';
        document.getElementById('startLivestream').style.display = 'inline-block';
      } else {
        const h = Math.floor(diff / 3600).toString().padStart(2, '0');
        const m = Math.floor((diff % 3600) / 60).toString().padStart(2, '0');
        const s = (diff % 60).toString().padStart(2, '0');
        document.getElementById('countdownDisplay').textContent = `${h}:${m}:${s}`;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uri = window.location.pathname.split('/').pop();
      loadEventData(uri);
      setInterval(updateTimer, 1000);
    });
  </script>
