  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    let embedPlayer = null;
    let videoPlayerInstance = null;
    let streamData = null;

    // Block popups
    const originalOpen = window.open;
    window.open = function(url) {
      console.log('Blocked popup attempt to:', url);
      return null;
    };

    // Clear error messages
    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    // Tip countdown
    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      let seconds = 10;
      if (!tipContainer || !tipAlert || !countdownTimer) {
        console.warn('Tip container or elements not found');
        return;
      }
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;
      const interval = setInterval(() => {
        seconds--;
        countdownTimer.textContent = `${seconds}s`;
        if (seconds <= 0) {
          clearInterval(interval);
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
      setTimeout(() => {
        tipContainer.style.height = '0';
        tipAlert.style.display = 'none';
        clearInterval(interval);
      }, 10500);
    }

    // Initialize offcanvas
    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      const themeToggle = document.getElementById('themeToggle');
      const logoutButton = document.getElementById('logoutButton');
      if (!offcanvasElement || !toggler || !themeToggle) {
        console.error('Offcanvas, toggler, or theme toggle not found');
        return;
      }
      console.log('Initializing offcanvas at', new Date().toISOString());
      if (typeof bootstrap === 'undefined') {
        console.error('Bootstrap not loaded. Ensure Bootstrap JS is included.');
        return;
      }
      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement, {
          backdrop: true,
          keyboard: true,
          scroll: false
        });
        offcanvasElement.addEventListener('shown.bs.offcanvas', () => {
          console.log('Offcanvas shown at', new Date().toISOString());
        });
        offcanvasElement.addEventListener('hidden.bs.offcanvas', () => {
          console.log('Offcanvas hidden at', new Date().toISOString());
        });
        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', (event) => {
            const href = link.getAttribute('href');
            if (href) {
              console.log('Nav link clicked:', href, 'at', new Date().toISOString());
              window.location.href = href;
              offcanvas.hide();
            }
          });
        });
        if (logoutButton) {
          logoutButton.addEventListener('click', () => {
            console.log('Logout button clicked at', new Date().toISOString());
            offcanvas.hide();
            if (typeof logout === 'function') {
              logout();
            }
          });
        }
        if (themeToggle) {
          const htmlElement = document.documentElement;
          const currentTheme = localStorage.getItem('theme') || 'dark';
          htmlElement.setAttribute('data-bs-theme', currentTheme);
          themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
          console.log('Theme toggle initialized to:', currentTheme, 'at', new Date().toISOString());
          themeToggle.addEventListener('click', () => {
            try {
              const currentTheme = htmlElement.getAttribute('data-bs-theme');
              const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
              htmlElement.setAttribute('data-bs-theme', newTheme);
              localStorage.setItem('theme', newTheme);
              themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
              console.log('Theme toggled to:', newTheme, 'at', new Date().toISOString());
            } catch (error) {
              console.error('Theme toggle error:', error);
            }
          });
        }
      } catch (error) {
        console.error('Offcanvas initialization error:', error);
      }
    }

    // Detect M3U8 stream by content
    async function isM3U8Stream(url) {
      if (url.startsWith('http://drewlive24.duckdns.org:4123?url=')) {
        console.log('Excluded URL from M3U8 detection:', url);
        return false;
      }
      if (url.toLowerCase().includes('.m3u8')) {
        return true;
      }
      try {
        const response = await fetch(url, { 
          method: 'GET', 
          headers: { 'Range': 'bytes=0-1023' }, 
          signal: AbortSignal.timeout(5000)
        });
        if (!response.ok) return false;
        const content = await response.text();
        return content.includes('#EXTM3U') || content.includes('.ts');
      } catch (error) {
        console.warn(`M3U8 detection fetch failed for ${url}:`, error);
        return false;
      }
    }

    // Initialize player
    async function initPlayer(event, errorContainer, streamLinks) {
      console.log('initPlayer called with event:', event);
      try {
        clearError();
        embedPlayer = document.getElementById('embedPlayer');
        const videoContainer = document.getElementById('videoPlayerContainer');
        const stream = event.streams[0];
        const streamUrl = typeof stream === 'string' ? stream : stream.url;
        if (!streamUrl || !/^https?:/.test(streamUrl)) {
          throw new Error('Invalid or missing stream URL');
        }
        console.log('Stream URL:', streamUrl);

        const isM3U8 = await isM3U8Stream(streamUrl);
        console.log('Is M3U8 stream:', isM3U8);

        if (isM3U8) {
          embedPlayer.style.display = 'none';
          videoContainer.classList.remove('d-none');
          const videoPlayerEl = document.getElementById('videoPlayer');
          if (typeof Clappr === 'undefined') {
            console.error('Clappr not loaded');
            throw new Error('Clappr library not loaded');
          }
          videoPlayerInstance = new Clappr.Player({
            source: streamUrl,
            parentId: '#videoPlayer',
            width: '100%',
            height: '100%',
            autoPlay: true,
            mute: true,
            playback: {
              plugins: ['hlsjs-playback'], // Enables M3U8 with quality selection
              hlsjsConfig: {
                enableWorker: false,
                lowLatencyMode: false,
                backBufferLength: 90,
                enableStreamStateEvents: true
              }
            },
            plugins: {
              container: ['clapper_container'],
              playback: ['hlsjs-playback'],
              level: ['playback_level_selector'] // Quality selector button
            },
            events: {
              onReady: () => {
                console.log('Clappr ready for HLS');
                clearError();
                videoPlayerInstance.play();
                videoPlayerInstance.setMuted(false);
                console.log('Clappr unmuted');
                // PiP support
                if (document.pictureInPictureEnabled) {
                  videoPlayerEl.addEventListener('click', () => {
                    const video = videoPlayerEl.querySelector('video');
                    if (video && video.requestPictureInPicture) {
                      video.requestPictureInPicture();
                    }
                  });
                }
              },
              onError: (error) => {
                console.error('Clappr error:', error);
                let errorMessage = 'Failed to load M3U8 stream: ';
                if (error.message) {
                  errorMessage += error.message;
                }
                errorContainer.className = 'alert alert-danger error-alert mt-3';
                errorContainer.innerText = errorMessage;
              }
            }
          });
        } else {
          videoContainer.classList.add('d-none');
          embedPlayer.style.display = 'block';
          if (videoPlayerInstance) {
            videoPlayerInstance.destroy();
            videoPlayerInstance = null;
          }
          const url = new URL(streamUrl);
          url.searchParams.append('autoplay', '1');
          embedPlayer.contentWindow.location.replace(url.toString());
          embedPlayer.muted = true;
          console.log('Embed initialized successfully');
          embedPlayer.addEventListener('load', () => {
            console.log('Embed loaded successfully');
            clearError();
            try {
              embedPlayer.contentWindow.postMessage({ type: 'play' }, '*');
              embedPlayer.contentWindow.postMessage({ type: 'unmute' }, '*');
              embedPlayer.muted = false;
              console.log('Iframe unmuted');
            } catch (e) {
              console.warn('Iframe play/unmute message failed:', e);
            }
          });
          embedPlayer.addEventListener('error', () => {
            console.error('Embed load error');
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load stream. The stream may be invalid or restricted.';
          });
        }

        // Generate stream links
        streamLinks.innerHTML = event.streams.map((stream, index) => {
          const url = typeof stream === 'string' ? stream : stream.url;
          return `
            <button class="btn btn-stream ${index === 0 ? 'active' : ''}" 
                    data-stream-encoded="${btoa(url)}" 
                    data-stream-index="${index}"
                    data-stream-type="${url.toLowerCase().includes('.m3u8') ? 'm3u8' : 'iframe'}">
              ${stream.title || `Stream ${index + 1}`}
            </button>
          `;
        }).join('');

        // Handle stream link clicks
        streamLinks.addEventListener('click', async (e) => {
          const btn = e.target.closest('.btn.btn-stream');
          if (btn) {
            const encodedUrl = btn.getAttribute('data-stream-encoded');
            const streamType = btn.getAttribute('data-stream-type');
            if (!encodedUrl) {
              console.error('No encoded stream URL');
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = 'Invalid stream URL. Please try another stream.';
              return;
            }
            const url = atob(encodedUrl);
            if (!url || !/^https?:/.test(url)) {
              console.error('Invalid decoded stream URL:', url);
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = 'Invalid stream URL. Please try another stream.';
              return;
            }
            clearError();
            try {
              console.log('Switching to stream:', url, 'Type:', streamType);
              const isM3U8 = await isM3U8Stream(url);
              console.log('Is M3U8 stream (switch):', isM3U8);
              if (isM3U8) {
                embedPlayer.style.display = 'none';
                videoContainer.classList.remove('d-none');
                const videoPlayerEl = document.getElementById('videoPlayer');
                if (videoPlayerInstance) {
                  videoPlayerInstance.destroy();
                  videoPlayerInstance = null;
                }
                videoPlayerInstance = new Clappr.Player({
                  source: url,
                  parentId: '#videoPlayer',
                  width: '100%',
                  height: '100%',
                  autoPlay: true,
                  mute: true,
                  playback: {
                    plugins: ['hlsjs-playback'],
                    hlsjsConfig: {
                      enableWorker: false,
                      lowLatencyMode: false,
                      backBufferLength: 90,
                      enableStreamStateEvents: true
                    }
                  },
                  plugins: {
                    container: ['clapper_container'],
                    playback: ['hlsjs-playback'],
                    level: ['playback_level_selector']
                  },
                  events: {
                    onReady: () => {
                      console.log('Clappr ready for HLS (switch)');
                      clearError();
                      videoPlayerInstance.play();
                      videoPlayerInstance.setMuted(false);
                      console.log('Clappr unmuted (switch)');
                    },
                    onError: (error) => {
                      console.error('Clappr error (switch):', error);
                      errorContainer.className = 'alert alert-danger error-alert mt-3';
                      errorContainer.innerText = 'Failed to load M3U8 stream: ' + (error.message || 'Unknown error');
                    }
                  }
                });
              } else {
                videoContainer.classList.add('d-none');
                embedPlayer.style.display = 'block';
                if (videoPlayerInstance) {
                  videoPlayerInstance.destroy();
                  videoPlayerInstance = null;
                }
                const switchUrl = new URL(url);
                switchUrl.searchParams.append('autoplay', '1');
                embedPlayer.contentWindow.location.replace(switchUrl.toString());
                embedPlayer.muted = true;
                embedPlayer.addEventListener('load', () => {
                  console.log('Embed loaded successfully (switch)');
                  clearError();
                  try {
                    embedPlayer.contentWindow.postMessage({ type: 'play' }, '*');
                    embedPlayer.contentWindow.postMessage({ type: 'unmute' }, '*');
                    embedPlayer.muted = false;
                    console.log('Iframe unmuted (switch)');
                  } catch (e) {
                    console.warn('Iframe play/unmute message failed (switch):', e);
                  }
                });
                embedPlayer.addEventListener('error', () => {
                  console.error('Embed load error (switch)');
                  errorContainer.className = 'alert alert-danger error-alert mt-3';
                  errorContainer.innerText = 'Failed to load stream. The stream may be invalid or restricted.';
                });
              }
              streamLinks.querySelectorAll('.btn.btn-stream').forEach(b => b.classList.remove('active'));
              btn.classList.add('active');
              console.log('Stream switched successfully');
            } catch (err) {
              console.error('Stream switch error:', err);
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = 'Failed to switch stream: ' + (err.message || 'Unknown error');
            }
          }
        });

        // Fullscreen button
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
          fullscreenBtn.classList.remove('d-none');
          fullscreenBtn.addEventListener('click', () => {
            if (isM3U8 && videoPlayerInstance) {
              const container = document.getElementById('videoPlayer');
              if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => {
                  console.error('Fullscreen failed:', err);
                  errorContainer.className = 'alert alert-danger error-alert mt-3';
                  errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
                });
              } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
              } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
              }
            } else if (embedPlayer.requestFullscreen) {
              embedPlayer.requestFullscreen().catch(err => {
                console.error('Fullscreen request failed:', err);
                errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
              });
            } else if (embedPlayer.webkitRequestFullscreen) {
              embedPlayer.webkitRequestFullscreen();
            } else if (embedPlayer.msRequestFullscreen) {
              embedPlayer.msRequestFullscreen();
            } else {
              console.error('Fullscreen API not supported');
              errorContainer.innerText = 'Fullscreen is not supported in this browser.';
            }
          });
        }
      } catch (err) {
        console.error('Player init error:', err);
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Failed to initialize stream: ' + (err.message || 'Unknown error');
      }
    }

    // Fetch stream data with retry
    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(() => attempt(), delay);
              } else {
                console.error('All fetch attempts failed:', error);
                reject(error);
              }
            });
        }
        attempt();
      });
    }

    // Load chat iframe
    function loadChatIframe() {
      const chatContainer = document.querySelector('.chat-container');
      const chatLoading = document.getElementById('chatLoading');
      if (!chatContainer || !chatLoading) {
        console.error('Chat container or loading element not found');
        return;
      }
      setTimeout(() => {
        const iframe = document.createElement('iframe');
        iframe.src = 'https://www5.cbox.ws/box/?boxid=958103&boxtag=ElAMjb';
        iframe.title = 'FutbolX Chat';
        iframe.style.cssText = 'width: 100%; height: 100%; border: none;';
        iframe.onload = () => {
          console.log('Cbox iframe loaded successfully at', new Date().toISOString());
          chatLoading.style.display = 'none';
        };
        iframe.onerror = () => {
          console.error('Cbox iframe failed to load');
          chatLoading.innerText = 'Failed to load chat. Please try again later.';
        };
        chatContainer.appendChild(iframe);
      }, 1000);
    }

    // Initialize page
    function initPage() {
      console.log('Initializing page at', new Date().toISOString());
      const errorContainer = document.getElementById('errorContainer');
      const startLivestreamBtn = document.getElementById('startLivestream');
      const eventTitle = document.getElementById('eventTitle');
      try {
        const uriName = window.location.pathname.split('/').pop();
        const playerContainer = document.querySelector('.video-container');
        const streamLinks = document.getElementById('streamLinks');
        let api;
        if (typeof Api === 'undefined') {
          console.warn('Api class not defined. Using default API path.');
          api = { baseUrl: window.location.origin + '/api' };
        } else {
          api = new Api(`${window.location.origin}/api`);
        }
        const apiUrl = api.baseUrl.endsWith('/') ? `${api.baseUrl}stream` : `${api.baseUrl}/stream`;
        fetchWithRetry(apiUrl)
          .then(data => {
            console.log('Stream API Response:', data);
            if (!data || !data.success || !Array.isArray(data.streams)) {
              throw new Error('Invalid stream data');
            }
            let event = null;
            for (const category of data.streams) {
              if (category.streams && Array.isArray(category.streams)) {
                event = category.streams.find(s => s.uri_name === uriName);
                if (event) break;
              }
            }
            if (!event || !event.streams || !Array.isArray(event.streams) || event.streams.length === 0) {
              throw new Error(`Stream not found for uri_name: ${uriName}`);
            }
            if (!event.name || !event.starts_at) {
              throw new Error('Missing required event fields');
            }
            const now = Math.floor(Date.now() / 1000);
            let startTime, endTime;
            try {
              // Parse times as EAT (UTC+3)
              startTime = new Date(event.starts_at + '+03:00').getTime() / 1000;
              if (isNaN(startTime)) {
                console.warn(`Invalid start time for stream ${event.name}`);
                startTime = now;
              }
              endTime = event.ends_at
                ? new Date(event.ends_at + '+03:00').getTime() / 1000
                : startTime + 3 * 3600;
              if (isNaN(endTime)) {
                console.warn(`Invalid end time for stream ${event.name}`);
                endTime = startTime + 3 * 3600;
              }
            } catch (e) {
              console.warn(`Error parsing time for stream ${event.name}: ${e.message}`);
              startTime = now;
              endTime = now + 3 * 3600;
            }
            const isLive = (startTime <= now && now <= endTime) || event.always_live === 1;
            // Convert start time to local timezone for display
            const startDate = new Date(startTime * 1000);
            const localTimeString = startDate.toLocaleString('en-US', {
              hour: 'numeric',
              minute: '2-digit',
              hour12: true,
              timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
            });
            if (!isLive) {
              eventTitle.innerText = `${event.name} (Not Live - Starts at ${localTimeString})`;
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = 'This event is not currently live.';
              startLivestreamBtn.disabled = true;
              startLivestreamBtn.innerText = 'Event Not Live';
              return;
            }
            eventTitle.innerText = event.name;
            streamData = event;
            startLivestreamBtn.innerText = 'Click to Start Livestream';
            startLivestreamBtn.disabled = false;
            startLivestreamBtn.addEventListener('click', () => {
              console.log('Start Livestream clicked');
              playerContainer.classList.add('fade-in');
              streamLinks.classList.add('fade-in');
              startLivestreamBtn.style.display = 'none';
              initPlayer(streamData, errorContainer, streamLinks);
            });
            loadChatIframe();
          })
          .catch(error => {
            console.error('API Fetch Error:', error.message);
            eventTitle.innerText = 'Error: Stream Not Found';
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = error.message.includes('Stream not found')
              ? `The requested stream "${uriName}" was not found. Redirecting to home...`
              : 'Failed to load stream data. Please try again.';
            startLivestreamBtn.innerText = 'Retry';
            startLivestreamBtn.disabled = false;
            startLivestreamBtn.addEventListener('click', () => {
              window.location.reload();
            });
            if (error.message.includes('Stream not found')) {
              setTimeout(() => window.location.href = '/', 3000);
            }
          });
        try {
          checkAuthStatus();
        } catch (error) {
          console.warn('Auth status check failed:', error);
        }
        console.log('Page initialized successfully');
      } catch (error) {
        console.error('Init page error:', error);
        eventTitle.innerText = 'Error: Failed to Initialize';
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'An error occurred while initializing the page. Please try again.';
        startLivestreamBtn.innerText = 'Retry';
        startLivestreamBtn.disabled = false;
        startLivestreamBtn.addEventListener('click', () => {
          window.location.reload();
        });
      }
    }

    // Wait for page load
    window.addEventListener('load', () => {
      console.log('Window load complete at', new Date().toISOString());
      setTimeout(() => {
        initOffcanvas();
        startTipCountdown();
        initPage();
      }, 500);
    });
  </script>
</body>
