<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch Live</title>
  <meta name="description" content="FutbolX - Watch live PPV boxing, UFC, Basketball, Football, and more.">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
  <link rel="stylesheet" href="/assets/css/main.css?v=24">
  <style>
    .tip-container {max-width:600px;margin:20px auto;transition:height .3s;overflow:hidden;}
    .alert-info {text-align:center;position:relative;padding-right:10px;}
    .video-container {position:relative;width:100%;height:0;padding-bottom:56.25%;background:#000;border-radius:10px;overflow:hidden;display:none;margin-bottom:1rem;}
    #oplayer-container {position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;}
    
    /* FAKE PLAYER */
    #fakePlayerLayer {position: absolute; top:0; left:0; width:100%; height:100%; background: #000; z-index: 999; display: flex; align-items: center; justify-content: center; cursor: pointer;}
    .fake-play-btn {width: 80px; height: 80px; background: rgba(255, 77, 77, 0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 30px;}

    /* CHAT BOX STYLES */
    .chat-wrapper { width: 100%; background:#1a1a1a; border-radius:16px; overflow:hidden; border:1px solid #333; display: flex; flex-direction: column; height: 600px;}
    .chat-header { background:#ff4d4d; color:white; padding:12px; font-weight:bold; text-align:center; }
    #messages { flex-grow: 1; overflow-y: auto; padding: 15px; background: #111; font-size: 0.9rem; scroll-behavior: smooth;}
    .chat-input-area { padding: 10px; background: #1a1a1a; border-top: 1px solid #333; }
    .msg-row { margin-bottom: 8px; line-height: 1.4; word-wrap: break-word; }
    .admin-name { color: #ff4d4d !important; font-weight: 800; text-transform: uppercase; }
    .user-name { color: #00d4ff; font-weight: 600; }
    
    .live-title { text-align: center; background: linear-gradient(135deg, #1a1a1a, #2d0000); padding: 12px 20px; border-radius: 12px; border: 2px solid #ff4d4d; margin: 1rem 0; }
    .countdown-display { font-size: 4rem; font-weight: bold; color: #ff4d4d; text-align: center; margin: 20px 0; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"><i class="fas fa-bars"></i></button>
      <span class="futbolx-brand">Futbol-x TV</span>
    </div>
  </nav>

  <div class="container-fluid main-content">
    <div class="container-xl mt-4">
      <div class="row">
        <div class="col-12">
          <div class="tip-container">
            <div class="alert alert-info permanent-noti" id="infoAlert"><strong>Info:</strong> Use VPN if stream is slow.</div>
          </div>

          <div class="d-flex align-items-center mb-3">
            <a href="/" class="btn btn-back"><i class="fas fa-arrow-left"></i> Home</a>
            <button id="startLivestream" class="btn btn-danger ms-3" style="display:none;">Start Livestream</button>
          </div>

          <div id="statusArea">
            <h2 id="eventTitle" class="text-center text-danger"></h2>
            <div id="countdownDisplay" class="countdown-display"></div>
          </div>

          <div class="row g-4 mt-2">
            <div class="col-12 col-lg-8">
              <div class="video-container" id="mainVideoContainer">
                <div id="fakePlayerLayer"><div class="fake-play-btn"><i class="fas fa-play"></i></div></div>
                <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
                <div id="oplayer-container"></div>
              </div>
              <div id="streamLinks" class="stream-links mt-3" style="display:none;"></div>
            </div>

            <div class="col-12 col-lg-4">
              <div class="chat-wrapper">
                <div class="chat-header">LIVE CHAT</div>
                <div id="messages">
                  <div class="text-center text-muted mt-5">Setting up secure chat...</div>
                </div>
                <div class="chat-input-area">
                  <div class="input-group">
                    <input type="text" id="chatInput" class="form-control bg-dark text-white border-secondary" placeholder="Say something..." maxlength="150">
                    <button class="btn btn-danger" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const supabaseUrl = 'https://xwovrjuyabklnhjzywxf.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh3b3ZyanV5YWJrbG5oanp5d3hmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ1Mjk2ODcsImV4cCI6MjA5MDEwNTY4N30.lRjy5vO3ktA4mtfnCooHzilgcxAw4_aLpqvd0RSU0uc'
    const supabase = createClient(supabaseUrl, supabaseKey)

    const AD_URL = "https://omg10.com/4/10664814";
    let playerInstance = null;
    let eventStartTime = null;
    let eventEndTime = null;
    let streamStarted = false;

    // --- DEVICE & USER LOGIC ---
    function getDeviceId() {
      let id = localStorage.getItem('futbolx_device_id');
      if (!id) {
        id = 'dev_' + Math.random().toString(36).substr(2, 9) + Date.now();
        localStorage.setItem('futbolx_device_id', id);
      }
      return id;
    }

    async function initChat(eventId) {
      const deviceId = getDeviceId();
      let profile = JSON.parse(localStorage.getItem('futbolx_profile'));

      if (!profile) {
        let name = prompt("Enter a username to join chat:");
        if (!name) return;
        name = name.trim();

        if (name.toLowerCase() === 'optimus') {
          alert("Reserved for owner.");
          return;
        }

        const { data, error } = await supabase.from('profiles').insert([{ username: name, device_id: deviceId }]).select().single();
        if (error) { alert("Name taken or device already registered."); return; }
        profile = data;
        localStorage.setItem('futbolx_profile', JSON.stringify(data));
      }

      // Load History
      const { data: history } = await supabase.from('messages').select('*').eq('event_id', eventId).order('created_at', { ascending: true }).limit(50);
      const msgBox = document.getElementById('messages');
      msgBox.innerHTML = '';
      history?.forEach(m => renderMsg(m));

      // Realtime
      supabase.channel(`room:${eventId}`).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages', filter: `event_id=eq.${eventId}` }, p => renderMsg(p.new)).subscribe();

      // Send logic
      const sendAction = async () => {
        const input = document.getElementById('chatInput');
        const val = input.value.trim();
        if (!val) return;
        await supabase.from('messages').insert([{ content: val, username: profile.username, event_id: eventId, is_admin_msg: profile.is_admin }]);
        input.value = '';
      };
      document.getElementById('sendBtn').onclick = sendAction;
      document.getElementById('chatInput').onkeypress = (e) => { if(e.key==='Enter') sendAction(); };
    }

    function renderMsg(m) {
      const box = document.getElementById('messages');
      const isOpt = m.is_admin_msg || m.username === 'Optimus';
      const div = document.createElement('div');
      div.className = 'msg-row';
      div.innerHTML = `<span class="${isOpt ? 'admin-name' : 'user-name'}">${isOpt ? '[OWNER] ' : ''}${m.username}:</span> <span class="text-white">${m.content}</span>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    // --- STREAM LOGIC ---
    async function playStream(url) {
      const fakeLayer = document.getElementById('fakePlayerLayer');
      fakeLayer.style.display = 'flex';
      fakeLayer.onclick = () => {
        window.open(AD_URL, '_blank');
        fakeLayer.style.display = 'none';
        if (url.includes('.m3u8')) {
          document.getElementById('embedPlayer').style.display = 'none';
          document.getElementById('oplayer-container').innerHTML = '<div id="jw-player"></div>';
          playerInstance = jwplayer("jw-player").setup({ file: url, autostart: true, width: "100%", aspectratio: "16:9" });
        } else {
          document.getElementById('embedPlayer').src = url;
          document.getElementById('embedPlayer').style.display = 'block';
        }
      };
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const uriName = window.location.pathname.split('/').pop();
      initChat(uriName); // Start chat room unique to this URL

      try {
        const res = await fetch('/api/stream');
        const list = await res.json();
        let found = null;
        for (const cat of list.categories) {
           const catRes = await fetch(`/api/${cat}.json`);
           const catData = await catRes.json();
           for (const group of catData.streams) {
             found = group.streams.find(ev => ev.uri_name === uriName);
             if (found) break;
           }
           if (found) break;
        }

        if (found) {
          document.getElementById('eventTitle').textContent = found.name;
          eventStartTime = new Date(found.starts_at + '+03:00').getTime() / 1000;
          
          setInterval(() => {
            const now = Math.floor(Date.now() / 1000);
            if (now >= eventStartTime) {
              document.getElementById('statusArea').style.display = 'none';
              document.getElementById('startLivestream').style.display = 'inline-block';
            } else {
              const diff = eventStartTime - now;
              const h = Math.floor(diff/3600).toString().padStart(2,'0');
              const m = Math.floor((diff%3600)/60).toString().padStart(2,'0');
              const s = (diff%60).toString().padStart(2,'0');
              document.getElementById('countdownDisplay').textContent = `${h}:${m}:${s}`;
            }
          }, 1000);

          document.getElementById('startLivestream').onclick = () => {
            document.getElementById('mainVideoContainer').style.display = 'block';
            document.getElementById('streamLinks').style.display = 'block';
            document.getElementById('startLivestream').style.display = 'none';
            playStream(found.streams[0].url);
          };
        }
      } catch (e) { console.error(e); }
    });
  </script>
</body>
</html>
