  <style>
    .tip-container {max-width:600px;margin:20px auto;transition:height .3s;overflow:hidden;}
    .alert-info {text-align:center;position:relative;padding-right:50px;}
    #countdownTimer {position:absolute;top:8px;right:10px;font-weight:bold;color:#ff4d4d;}
    [data-bs-theme="light"] #countdownTimer {color:#e63939;}
    .error-alert {max-width:500px;margin:20px auto;}
    .fade-out {animation:fadeOut .5s forwards;} @keyframes fadeOut {from{opacity:1}to{opacity:0}}
    .btn-fullscreen {display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#ff4d4d;color:#fff;border:none;border-radius:20px;transition:.3s;}

      text-align: center;

      font-size: 2.2rem; 
      margin-bottom: 15px;

      font-size: 1.3rem;

      font-size: 3.5rem;

</head>
<body>
  <!-- ... (top bar, sidebar unchanged) ... -->

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <div class="tip-container">
            <div class="alert alert-info">
              <strong>Tip:</strong> For an ad-free experience, consider installing an ad blocker like
              <a href="https://ublockorigin.com" target="_blank" rel="noopener">uBlock Origin</a> or
              <a href="https://adguard.com" target="_blank" rel="noopener">AdGuard</a>.
              <span id="countdownTimer">10s</span>
            </div>
          </div>

          <div class="d-flex align-items-center mb-3">
            <a href="/" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to Home</a>
            <button id="startLivestream" class="btn btn-danger ms-3" style="display:none;">Click to Start Livestream</button>
            <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
          </div>

          <!-- Pre-stream / status area -->
          <div id="statusArea" class="pre-stream-info">
            <h2 id="eventTitle" class="pre-stream-title mb-0"></h2>
            <div id="countdownDisplay" class="countdown-display"></div>
            <p id="statusMessage" class="pre-stream-message">Loading event details...</p>
          </div>

          <div class="video-container" id="videoContainer">
            <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation" style="position:absolute;top:0;left:0;width:100%;height:100%;"></iframe>
            <div id="jwplayer-div"></div>
          </div>

          <div id="streamLinks" class="stream-links mt-3" style="display:none;"></div>

          <div class="chat-container">
            <div id="chatLoading">Loading chat...</div>
          </div>

          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>

      <!-- footer unchanged -->
    </div>
  </div>

  <!-- scripts unchanged except the main one below -->

  <script>
    // ... (theme toggle, clearError, isM3U8, playStream functions unchanged) ...

    let jw = null;
    let streamData = null;
    let eventStartTime = null;
    let eventEndTime = null;

    function formatTimeLeft(seconds) {
      if (seconds <= 0) return "Starting now!";
      const days = Math.floor(seconds / 86400);
      const hours = Math.floor((seconds % 86400) / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      if (days > 0) return `${days}d ${hours.toString().padStart(2,'0')}h ${minutes.toString().padStart(2,'0')}m`;
      if (hours > 0) return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
      return `${minutes.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
    }

    function updateStatus() {
      const now = Math.floor(Date.now() / 1000);
      const titleEl = document.getElementById('eventTitle');
      const countdownEl = document.getElementById('countdownDisplay');
      const messageEl = document.getElementById('statusMessage');
      const startBtn = document.getElementById('startLivestream');
      const videoCont = document.getElementById('videoContainer');
      const linksCont = document.getElementById('streamLinks');

      if (!eventStartTime || !eventEndTime) {
        messageEl.textContent = "Event information unavailable";
        countdownEl.textContent = "";
        return;
      }

      const timeLeft = eventStartTime - now;
      const isLive = now >= eventStartTime && now <= eventEndTime;
      const isEnded = now > eventEndTime;

      if (isEnded) {
        countdownEl.textContent = "";
        messageEl.innerHTML = '<i class="fas fa-times-circle me-2"></i>This event has ended';
        messageEl.className = 'pre-stream-message text-danger';
        startBtn.style.display = 'none';
        videoCont.style.display = 'none';
        linksCont.style.display = 'none';
      } else if (isLive) {
        countdownEl.textContent = "LIVE NOW!";
        messageEl.innerHTML = '<i class="fas fa-play-circle me-2"></i>Stream is live — click below to watch';
        messageEl.className = 'pre-stream-message text-success';
        startBtn.style.display = 'inline-block';
        startBtn.disabled = false;
      } else {
        countdownEl.textContent = formatTimeLeft(timeLeft);
        messageEl.innerHTML = '<i class="fas fa-clock me-2"></i>Stream has not started yet — kickoff in:';
        messageEl.className = 'pre-stream-message';
        startBtn.style.display = 'none';
        videoCont.style.display = 'none';
        linksCont.style.display = 'none';
      }
    }

    function populateStreamButtons(event) {
      // unchanged
      const container = document.getElementById('streamLinks');
      container.innerHTML = event.streams.map((s, i) => {
        const url = typeof s === 'string' ? s : s.url;
        const title = s.title || `Stream ${i+1}`;
        return `<button class="btn btn-stream ${i===0?'active':''}" data-stream-encoded="${btoa(url)}" data-stream-index="${i}">${title}</button>`;
      }).join('');

      container.addEventListener('click', async e => {
        const btn = e.target.closest('.btn-stream');
        if (!btn) return;
        const url = atob(btn.dataset.streamEncoded);
        playStream(url);
        container.querySelectorAll('.btn-stream').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      const titleEl = document.getElementById('eventTitle');

      fetch('/api/stream')
        .then(r => r.json())
        .then(data => {
          if (!data.success) throw new Error('Invalid response');

          let event = null;
          for (const cat of data.streams) {
            event = cat.streams.find(s => s.uri_name === uriName);
            if (event) break;
          }
          if (!event) throw new Error('Event not found');

          titleEl.textContent = event.name;
          streamData = event;

          try {
            eventStartTime = new Date(event.starts_at + '+03:00').getTime() / 1000;
            eventEndTime = event.ends_at 
              ? new Date(event.ends_at + '+03:00').getTime() / 1000 
              : eventStartTime + 10800; // 3 hours fallback
          } catch (e) {
            eventStartTime = Date.now() / 1000;
            eventEndTime = eventStartTime + 10800;
          }

          updateStatus();
          setInterval(updateStatus, 1000); // smooth countdown

          document.getElementById('startLivestream').onclick = () => {
            document.getElementById('videoContainer').style.display = 'block';
            document.getElementById('streamLinks').style.display = 'block';
            document.getElementById('statusArea').style.display = 'none'; // optional: hide status after start
            document.getElementById('startLivestream').style.display = 'none';
            document.getElementById('fullscreenBtn').classList.remove('d-none');

            const firstUrl = event.streams[0].url || event.streams[0];
            playStream(firstUrl);
            populateStreamButtons(event);
          };
        })
        .catch(err => {
          document.getElementById('statusMessage').textContent = 'Event not found or unavailable';
          console.error(err);
        });

      // fullscreen, chat, tip countdown unchanged...
    });
  </script>
</body>
