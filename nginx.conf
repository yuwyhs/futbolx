events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        location = /api/stream {
            default_type application/json;
            try_files /api/stream.json =404;
        }

        location = /api/stream-24-7 {
            default_type application/json;
            try_files /api/stream-24-7.json =404;
        }

        location /api/ {
            default_type application/json;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires off;
            try_files $uri $uri.json =404;
        }

        location /auth/ {
            try_files $uri $uri.html /index.html;
        }

        location /live/ {
            try_files $uri /live.html;
        }

        location /live-24-7/ {
            try_files $uri /live-24-7.html;
        }

        location /vip { try_files /vip.html /index.html; }
        location /24-7 { try_files /24-7.html /index.html; }
        location /dashboard { try_files /dashboard.html /index.html; }

        location / {
            location ~* \.(service-worker\.js|manifest\.json|sw\.js)$ {
                add_header Cache-Control "no-cache";
                try_files $uri =404;
            }
            
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            try_files $uri $uri.html /index.html;
        }

        error_page 404 /index.html;
    }
}
