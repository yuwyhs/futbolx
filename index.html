  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    let apiInstance = null;
    function zeropad(num) { return num > 9 ? num : '0' + num; }

    function countdown() {
      const now = Math.floor(Date.now() / 1000);
      document.querySelectorAll('.countdown').forEach(element => {
        const startTime = parseInt(element.getAttribute('data-start'), 10);
        const uri = element.getAttribute('data-uri');
        let timer = startTime - now;

        if (timer > 0) {
          let hours = Math.floor(timer / 3600);
          let mins = Math.floor((timer % 3600) / 60);
          let secs = timer % 60;
          element.innerHTML = `Starting in ${zeropad(hours)}:${zeropad(mins)}:${zeropad(secs)}`;
        } else {
          element.parentElement.innerHTML = `<a href="${uri}" class="btn btn-danger btn-sm watch-button">Watch</a>`;
        }
      });
      setTimeout(countdown, 1000);
    }

    function fetchWithRetry(url, maxRetries = 2) {
      return fetch(url).then(res => res.ok ? res.json() : Promise.reject());
    }

    async function loadContent() {
      const livecards = document.getElementById('livecards');
      const liveAnimation = document.getElementById('liveAnimation');
      
      // Filenames based on your GitHub screenshot
      const categories = [
        { file: 'football', id: 'football', container: 'footballcards' },
        { file: 'basketball', id: 'nba', container: 'nbacards' },
        { file: 'fights', id: 'fights', container: 'fightscards' },
        { file: 'motorsports', id: 'motorsports', container: 'motorsportscards' },
        { file: 'nfl', id: 'nfl', container: 'nflcards' },
        { file: 'nhl', id: 'nhl', container: 'nhlcards' },
        { file: 'mlb', id: 'mlb', container: 'mlbcards' },
        { file: 'tennis', id: 'tennis', container: 'tenniscards' },
        { file: 'rugby', id: 'rugby', container: 'rugbycards' },
        { file: 'golf', id: 'golf', container: 'golfcards' },
        { file: 'others', id: 'others', container: 'otherscards' }
      ];

      try {
        const baseUrl = `${window.location.origin}/api`;
        livecards.innerHTML = '';
        let hasLive = false;
        const now = Math.floor(Date.now() / 1000);

        // Fetch all JSON files in parallel
        const results = await Promise.all(categories.map(cat => 
          fetchWithRetry(`${baseUrl}/${cat.file}.json`).catch(() => null)
        ));

        results.forEach((data, index) => {
          if (!data || !data.streams) return;

          const catInfo = categories[index];
          const container = document.getElementById(catInfo.container);
          const section = document.getElementById(catInfo.id);
          let upcomingCount = 0;

          data.streams.forEach(stream => {
            let startTime = new Date(stream.starts_at + '+03:00').getTime() / 1000;
            let endTime = stream.ends_at ? new Date(stream.ends_at + '+03:00').getTime() / 1000 : startTime + 14400;

            if (now > endTime) return; // Skip finished events

            const isLive = (startTime <= now && now <= endTime) || stream.always_live === 1;
            const poster = stream.poster || 'https://via.placeholder.com/285x160?text=FutbolX';

            const cardHtml = `
              <a href="/live/${stream.uri_name}">
                <div class="card">
                  ${isLive ? '<span class="badge bg-danger" style="position:absolute;top:10px;right:10px;">LIVE</span>' : ''}
                  <img src="${poster}" class="card-img-top" alt="${stream.name}">
                  <div class="card-body">
                    <h5 class="card-title">${stream.name}</h5>
                    <div class="d-flex justify-content-between align-items-center">
                      <small class="text-secondary">${stream.tag || ''}</small>
                      <div class="timer-area">
                        ${isLive ? '<span class="btn btn-danger btn-sm watch-button">Watch</span>' : `<span class="countdown small" data-start="${startTime}" data-uri="/live/${stream.uri_name}"></span>`}
                      </div>
                    </div>
                  </div>
                </div>
              </a>`;

            if (isLive) {
              livecards.innerHTML += cardHtml;
              hasLive = true;
            } else {
              container.innerHTML += cardHtml;
              upcomingCount++;
            }
          });

          // Only show section if it has upcoming events
          if (upcomingCount > 0) {
            section.classList.remove('d-none');
          } else {
            section.classList.add('d-none');
          }
        });

        if (!hasLive) {
          livecards.innerHTML = '<p class="text-secondary">No events live right now.</p>';
          liveAnimation.classList.add('d-none');
        } else {
          liveAnimation.classList.remove('d-none');
        }

        // Trigger fade-in animation
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
        }, { threshold: 0.1 });
        document.querySelectorAll('.card').forEach(card => observer.observe(card));

      } catch (e) {
        livecards.innerHTML = '<p>Error loading content.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      countdown();
      
      // Theme Toggle Logic
      const themeToggle = document.getElementById('themeToggle');
      themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-bs-theme', newTheme);
        themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      });
    });
  </script>
