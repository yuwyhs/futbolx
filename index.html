<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Free PPV and More</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="monetag" content="761a0db2e5813981c74c35b46a27e348"> 

  <meta name="description" content="FutbolX - Free PPV boxing, UFC, Basketball, Football, and more available live and on-demand.">
  <meta name="keywords" content="futbolx, ppv, free ppv, boxing, ufc, basketball, football, stream, online, free">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>

  <style>
    /* --- NAVIGATION & CATEGORY DROPDOWN --- */
    .top-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 15px;
        height: 60px;
        background: #000;
        z-index: 1030;
    }
    .cat-dropdown-btn {
        background: #1a1a1a;
        color: #fff;
        border: 1px solid #333;
        border-radius: 8px;
        font-size: 0.85rem;
        padding: 5px 12px;
        font-weight: 500;
    }
    .cat-dropdown-btn:focus { border-color: #ff4d4d; box-shadow: 0 0 0 0.25rem rgba(255, 77, 77, 0.25); }
    .dropdown-menu {
        max-height: 70vh;
        overflow-y: auto;
        border-radius: 12px;
        background: #121212;
        border: 1px solid #333;
        box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .dropdown-item { padding: 10px 20px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
    .dropdown-item:hover { background: #1a1a1a; color: #ff4d4d; }
    .count-badge {
        background: #ff4d4d;
        color: white;
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 20px;
        font-weight: 800;
    }

    /* --- MOBILE LIST VIEW (Screenshot UI Fix) --- */
    @media (max-width: 767px) {
      .event-grid { display: flex !important; flex-direction: column; gap: 12px !important; padding: 10px !important; }
      .card {
        display: flex !important;
        flex-direction: row !important;
        max-width: 100% !important;
        height: 125px; 
        background: var(--bs-tertiary-bg); 
        border-radius: 8px;
        overflow: hidden;
        border: none !important;
        box-shadow: none !important;
      }
      .card-img-top { width: 165px !important; height: 100% !important; object-fit: cover; }
      .card-body {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        padding: 12px 15px !important;
        flex-grow: 1;
        background: none !important; 
      }
      .card-title { font-size: 1.05rem !important; margin: 0 0 5px 0 !important; font-weight: 600; line-height: 1.2; }
      .card-text { margin-top: auto !important; display: flex; justify-content: space-between; align-items: flex-end; width: 100%; }
      .event-tag { font-size: 0.8rem !important; opacity: 0.7; }
      .event-timer { font-size: 0.8rem !important; font-weight: 500; }
      .watch-button { padding: 4px 12px !important; font-size: 0.75rem !important; animation: none !important; }
    }

    /* --- APP SPLASH & OVERLAYS --- */
    #disclaimer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 12000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
    .disclaimer-content { max-width: 500px; padding: 30px; border-radius: 20px; text-align: center; background: #121212; border: 1px solid #ff4d4d33; }
    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 11000; display: none; flex-direction: column; justify-content: center; align-items: center; }
    .splash-logo { width: 120px; border-radius: 20%; margin-bottom: 20px; }
    .site-blurred { filter: blur(10px); pointer-events: none; }
    
    #discordBtn { position: fixed; bottom: 20px; right: 20px; z-index: 999; }
    #discordBtn img { width: 45px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  </style>
</head>
<body>

  <div id="disclaimer-overlay">
    <div class="disclaimer-content">
      <h4 class="mb-3" style="color: #ff4d4d; font-weight: 800;">IMPORTANT NOTICE</h4>
      <p>We DO NOT host any audiovisual content. All content is copyright of their respective owners.</p>
      <button id="btn-understood" class="btn btn-danger rounded-pill px-5 fw-bold">Understood</button>
    </div>
  </div>

  <div id="splash-screen">
      <img src="https://i.postimg.cc/gkfNSFPv/lqo4nv.jpg" class="splash-logo" alt="Logo">
      <div id="cycling-text" class="text-danger fw-bold small">INITIALIZING...</div>
  </div>

  <nav class="top-bar fixed-top">
    <div class="d-flex align-items-center">
      <button class="btn btn-dark me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand fw-bold text-danger">FutbolX</span>
    </div>

    <div class="dropdown">
      <button class="btn cat-dropdown-btn dropdown-toggle" type="button" id="catDropdown" data-bs-toggle="dropdown">
        <i class="fas fa-list-ul me-1"></i> Jump To
      </button>
      <ul class="dropdown-menu dropdown-menu-end" id="categoryList">
        <li><a class="dropdown-item" href="javascript:void(0)" onclick="scrollToSection('live')">Live Now</a></li>
        <li><hr class="dropdown-divider"></li>
        </ul>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header"><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
      <ul class="nav flex-column gap-2">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li><hr></li>
        <li><a class="nav-link" href="/auth/login" id="menuLogin">Login</a></li>
        <li><button class="nav-link text-danger border-0 bg-transparent" id="menuLogout" style="display:none;">Logout</button></li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content" style="margin-top: 75px;">
    
    <div id="live" class="mt-2">
      <h4 class="px-2 fw-bold"><span class="text-danger">●</span> Live Now</h4>
      <div id="livecards" class="event-grid"></div>
    </div>

    <div id="football" class="mt-4 d-none"><h4 class="px-2 fw-bold">Football</h4><div id="footballcards" class="event-grid"></div></div>
    <div id="nba" class="mt-4 d-none"><h4 class="px-2 fw-bold">Basketball</h4><div id="nbacards" class="event-grid"></div></div>
    <div id="fights" class="mt-4 d-none"><h4 class="px-2 fw-bold">Fights</h4><div id="fightscards" class="event-grid"></div></div>
    <div id="wrestling" class="mt-4 d-none"><h4 class="px-2 fw-bold">Wrestling</h4><div id="wrestlingcards" class="event-grid"></div></div>
    <div id="motorsports" class="mt-4 d-none"><h4 class="px-2 fw-bold">Motorsports</h4><div id="motorsportscards" class="event-grid"></div></div>
    <div id="nfl" class="mt-4 d-none"><h4 class="px-2 fw-bold">NFL</h4><div id="nflcards" class="event-grid"></div></div>
    <div id="mlb" class="mt-4 d-none"><h4 class="px-2 fw-bold">MLB</h4><div id="mlbcards" class="event-grid"></div></div>
    <div id="others" class="mt-4 d-none"><h4 class="px-2 fw-bold">Others</h4><div id="otherscards" class="event-grid"></div></div>

  </div>

  <a href="https://discord.gg/UzHzerb6XY" target="_blank" id="discordBtn">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeN56pzA4LKgAiLZ8zrvSqhPhTy-WAUWHywdrFq0CjSg&s=10" alt="Discord">
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    // --- NAVIGATION HELPERS ---
    function scrollToSection(id) {
        const el = document.getElementById(id);
        if (el) {
            window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
        }
    }

    async function loadContent() {
      const livecards = document.getElementById('livecards');
      const categoryList = document.getElementById('categoryList');
      const baseUrl = `${window.location.origin}/api`;

      try {
        const catRes = await fetch(`${baseUrl}/stream`).then(r => r.json());
        const categoryNames = catRes.categories || [];
        
        const data = await Promise.all(categoryNames.map(cat => fetch(`${baseUrl}/${cat}.json`).then(r => r.json()).catch(() => ({ streams: [] }))));
        const allStreams = data.flatMap(d => d.streams || []);

        const categories = {
          football: { label: 'Football', id: 'football', count: 0 },
          basketball: { label: 'Basketball', id: 'nba', count: 0 },
          fights: { label: 'Fights', id: 'fights', count: 0 },
          wrestling: { label: 'Wrestling', id: 'wrestling', count: 0 },
          motorsports: { label: 'Motorsports', id: 'motorsports', count: 0 },
          nfl: { label: 'NFL', id: 'nfl', count: 0 },
          mlb: { label: 'MLB', id: 'mlb', count: 0 },
          others: { label: 'Others', id: 'others', count: 0 }
        };

        const now = Math.floor(Date.now() / 1000);
        livecards.innerHTML = '';

        allStreams.forEach(group => {
          const groupName = group.category?.toLowerCase() || 'others';
          const cat = categories[groupName] || (groupName === 'nba' ? categories.basketball : categories.others);

          group.streams.forEach(stream => {
            let startTime = new Date(stream.starts_at + '+03:00').getTime() / 1000;
            let endTime = stream.ends_at ? new Date(stream.ends_at + '+03:00').getTime() / 1000 : startTime + 14400;
            if (now > endTime) return;

            const isLive = (startTime <= now && now <= endTime) || stream.always_live === 1;
            let html = `
                <a href="/live/${stream.uri_name}" style="text-decoration:none; color:inherit;">
                  <div class="card">
                    <img src="${stream.poster || 'https://via.placeholder.com/285x160'}" class="card-img-top">
                    <div class="card-body">
                      <h5 class="card-title">${stream.name}</h5>
                      <div class="card-text">
                        <span class="event-tag">${stream.tag}</span>
                        <span class="event-timer">${isLive ? '<span class="btn btn-danger btn-sm watch-button">Watch</span>' : 'Upcoming'}</span>
                      </div>
                    </div>
                  </div>
                </a>`;

            if (isLive) { 
                livecards.innerHTML += html; 
            } else {
                cat.count++;
                document.getElementById(cat.id + 'cards').innerHTML += html;
                document.getElementById(cat.id).classList.remove('d-none');
            }
          });
        });

        // Fill Dropdown with updated counts
        Object.values(categories).forEach(c => {
            if (c.count > 0) {
                categoryList.innerHTML += `<li><a class="dropdown-item" href="javascript:void(0)" onclick="scrollToSection('${c.id}')">${c.label} <span class="count-badge">${c.count}</span></a></li>`;
            }
        });

      } catch (e) { console.error("Load failed", e); }
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        // App Splash Logic
        const isApp = window.matchMedia('(display-mode: standalone)').matches;
        if (isApp) {
            const splash = document.getElementById('splash-screen');
            splash.style.display = 'flex';
            setTimeout(() => splash.style.display = 'none', 3000);
        }

        // Disclaimer logic
        const lastSeen = localStorage.getItem('disclaimer_accepted');
        if (!lastSeen) document.getElementById('disclaimer-overlay').style.display = 'flex';
        
        document.getElementById('btn-understood').onclick = () => {
            localStorage.setItem('disclaimer_accepted', 'true');
            document.getElementById('disclaimer-overlay').style.display = 'none';
        };

        loadContent();
    });
  </script>
</body>
</html>
