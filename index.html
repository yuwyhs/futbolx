<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX</title>
  <link href="https://fonts.bunny.net/css?family=kanit:400,500,600,700" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'Kanit', sans-serif; background-color: #121212; }
    
    /* UNIFIED GRID: This makes Live and Football sections identical */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 1rem 0;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #333;
      border-radius: 12px;
      transition: all 0.3s ease;
      position: relative; /* Required for stretched-link */
      height: 100%;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #ff4d4d;
    }

    .watch-button {
      background-color: #ff4d4d;
      border: none;
      padding: 5px 20px;
      border-radius: 8px;
      color: white;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .live-dot {
      height: 8px;
      width: 8px;
      background-color: #ff4d4d;
      border-radius: 50%;
      display: inline-block;
      margin-left: 8px;
      animation: blink 1s infinite;
    }

    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark sticky-top border-bottom border-secondary">
    <div class="container-fluid">
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <a class="navbar-brand fw-bold" href="#">FutbolX</a>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start bg-dark text-white" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header border-bottom border-secondary">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column gap-2">
        <li><a class="nav-link text-white" href="/"><i class="fas fa-home me-2"></i> Home</a></li>
        <li><a class="nav-link text-white" href="/request"><i class="fas fa-plus me-2"></i> Request</a></li>
        <li><a class="nav-link text-white" href="/vods"><i class="fas fa-video me-2"></i> VODs</a></li>
        <li><a class="nav-link text-white" href="/vip"><i class="fas fa-star me-2"></i> VIP Access</a></li>
      </ul>
    </div>
  </div>

  <div class="container py-4">
    <div id="live-section">
      <h3 class="fw-bold">Live Now <span class="live-dot"></span></h3>
      <div id="livecards" class="event-grid">
        </div>
    </div>

    <hr class="my-5 border-secondary">

    <div id="football" class="category-section d-none">
      <h3 class="fw-bold">Football</h3>
      <div id="footballcards" class="event-grid"></div>
    </div>

    <div id="nba" class="category-section d-none">
      <h3 class="fw-bold">Basketball</h3>
      <div id="nbacards" class="event-grid"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    async function loadStreams() {
      try {
        // Change this to your actual API endpoint
        const response = await fetch('/api/stream');
        const data = await response.json();

        const liveContainer = document.getElementById('livecards');
        
        // Reset grids
        liveContainer.innerHTML = '';

        data.streams.forEach(category => {
          // Find the correct container for the category
          const catName = category.name.toLowerCase();
          const catContainer = document.getElementById(`${catName}cards`);
          const catSection = document.getElementById(catName);

          if (catContainer) catContainer.innerHTML = '';

          category.streams.forEach(stream => {
            const startTime = new Date(stream.starts_at).getTime();
            const isLive = startTime <= Date.now();

            // FIX: Removed nested <a>. The .stretched-link handles the click.
            const cardHtml = `
              <div class="card">
                <img src="${stream.poster || 'https://via.placeholder.com/300x170'}" class="card-img-top rounded-top" alt="...">
                <div class="card-body">
                  <h6 class="text-secondary text-uppercase mb-1" style="font-size: 0.75rem;">${stream.tag}</h6>
                  <h5 class="card-title mb-3">${stream.name}</h5>
                  <div class="d-flex justify-content-between align-items-center">
                    <span class="text-secondary small">${isLive ? 'Started' : new Date(stream.starts_at).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                    <a href="/live/${stream.uri_name}" class="btn watch-button stretched-link">${isLive ? 'Watch' : 'Wait'}</a>
                  </div>
                </div>
              </div>`;

            // Add to the main category section
            if (catContainer) {
              catContainer.innerHTML += cardHtml;
              catSection.classList.remove('d-none'); // Show section if it has events
            }

            // If it is live, ALSO add to the Live Now section at the top
            if (isLive) {
              liveContainer.innerHTML += cardHtml;
            }
          });
        });

        // If nothing is live, show a message
        if (liveContainer.innerHTML === '') {
          liveContainer.innerHTML = '<p class="text-secondary">No streams are live right now. Check back later!</p>';
        }

      } catch (error) {
        console.error("Error loading streams:", error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadStreams);
  </script>
</body>
</html>
