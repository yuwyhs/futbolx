    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      if (!offcanvasElement || !toggler) return;
      if (typeof bootstrap !== 'undefined') {
        new bootstrap.Offcanvas(offcanvasElement);

    function initPage() {
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      if (themeToggle) {
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        themeToggle.addEventListener('click', () => {
          const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });
      }

      initOffcanvas();

      try {
        apiInstance = typeof Api !== 'undefined' ? new Api(`${window.location.origin}/api`) : { baseUrl: window.location.origin + '/api' };
        loadContent(apiInstance);
      } catch (error) {
        console.error('API init error:', error);
      }

      countdown();
    }

    document.addEventListener('DOMContentLoaded', initPage);
  </script>

    function updateAccountMenu(isLoggedIn) {
      const menuLogin  = document.getElementById('menuLogin');
      const menuSignup = document.getElementById('menuSignup');
      const menuLogout = document.getElementById('menuLogout');

      if (menuLogin && menuSignup && menuLogout) {
        if (isLoggedIn) {
          menuLogin.style.display = 'none';
          menuSignup.style.display = 'none';
          menuLogout.style.display = 'block';
        } else {
          menuLogin.style.display = 'block';
          menuSignup.style.display = 'block';
          menuLogout.style.display = 'none';
        }
      }
    }

    auth.onAuthStateChanged((user) => {
      updateAccountMenu(!!user);
    });

    document.getElementById('menuLogout')?.addEventListener('click', (e) => {
      e.preventDefault();
      auth.signOut().then(() => {
        window.location.href = '/';
      }).catch((error) => {
        console.error('Logout error:', error);
