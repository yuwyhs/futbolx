<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Free PPV and More</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* FIX: Standardized Grid for EVERY section */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      padding: 1rem 0;
      justify-content: start;
    }

    /* Fixed sizes for different screens to ensure everything stays aligned */
    @media (min-width: 768px) { .event-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 992px) { .event-grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1400px) { .event-grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      height: 100%;
      transition: transform 0.3s ease;
      border: 1px solid rgba(255,255,255,0.1);
    }
    .card:hover { transform: translateY(-5px); }
    
    /* Ensure links don't break the layout */
    .event-link { text-decoration: none; color: inherit; display: block; }
    
    .watch-button {
      background-color: #dc3545;
      color: white;
      padding: 4px 12px;
      border-radius: 4px;
      font-weight: bold;
      display: inline-block;
    }

    /* Sidebar Fixes */
    .offcanvas { z-index: 1051 !important; }
    .offcanvas-backdrop { z-index: 1050 !important; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid d-flex align-items-center">
      <button class="btn btn-dark me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="text-center py-5 bg-dark hero-background">
      <h1 class="display-4 fw-bold">Welcome to FutbolX</h1>
      <p class="lead">Live & On-Demand Streams</p>
    </div>

    <div class="container pt-2">
      <div id="live" class="mt-4">
        <h2 class="m-0">Live Now <span id="liveAnimation" class="live-animation"></span></h2>
        <div id="livecards" class="event-grid"></div>
      </div>

      <div id="football" class="mt-5 d-none"><h2>Football</h2><div id="footballcards" class="event-grid"></div></div>
      <div id="nba" class="mt-5 d-none"><h2>Basketball</h2><div id="nbacards" class="event-grid"></div></div>
      <div id="fights" class="mt-5 d-none"><h2>Fights</h2><div id="fightscards" class="event-grid"></div></div>
      <div id="others" class="mt-5 d-none"><h2>Others</h2><div id="otherscards" class="event-grid"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function zeropad(n) { return n < 10 ? '0' + n : n; }

    function updateCountdowns() {
      const now = Math.floor(Date.now() / 1000);
      document.querySelectorAll('.countdown').forEach(el => {
        const start = parseInt(el.dataset.start);
        const diff = start - now;
        if (diff <= 0) {
          el.innerHTML = '<span class="watch-button">WATCH</span>';
        } else {
          const h = Math.floor(diff / 3600);
          const m = Math.floor((diff % 3600) / 60);
          const s = diff % 60;
          el.innerHTML = `${zeropad(h)}:${zeropad(m)}:${zeropad(s)}`;
        }
      });
    }

    async function loadContent() {
      try {
        const res = await fetch('/api/stream');
        const data = await res.json();
        
        const liveContainer = document.getElementById('livecards');
        liveContainer.innerHTML = ''; // Clear loading text

        data.streams.forEach(category => {
          const catId = category.name.toLowerCase().replace(/\s+/g, '');
          const catSection = document.getElementById(catId) || document.getElementById('others');
          const catGrid = catSection.querySelector('.event-grid');

          category.streams.forEach(stream => {
            const startTime = Math.floor(new Date(stream.starts_at).getTime() / 1000);
            const isLive = startTime <= Math.floor(Date.now() / 1000);

            const cardHtml = `
              <a href="/live/${stream.uri_name}" class="event-link">
                <div class="card bg-dark text-white">
                  <img src="${stream.poster || '/assets/img/placeholder.jpg'}" class="card-img-top">
                  <div class="card-body">
                    <h5 class="card-title text-truncate">${stream.name}</h5>
                    <div class="d-flex justify-content-between align-items-center">
                      <small class="text-secondary">${stream.tag}</small>
                      <div class="event-timer">
                        ${isLive ? '<span class="watch-button">LIVE</span>' : 
                        `<span class="countdown" data-start="${startTime}"></span>`}
                      </div>
                    </div>
                  </div>
                </div>
              </a>`;

            // 1. Add to the category section (Upcoming/All)
            catGrid.innerHTML += cardHtml;
            catSection.classList.remove('d-none'); // Show the category

            // 2. If live, also add to the top "Live Now" section
            if (isLive) {
              liveContainer.innerHTML += cardHtml;
            }
          });
        });

        if (liveContainer.innerHTML === '') {
          liveContainer.innerHTML = '<p class="text-secondary">No events currently live.</p>';
        }

      } catch (err) {
        console.error("Failed to load streams", err);
      }
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      setInterval(updateCountdowns, 1000);
    });
  </script>
</body>
</html>
