<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Free PPV and More</title>
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="description" content="FutbolX - Free PPV sports available live and on-demand.">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js" defer></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js" defer></script>

  <style>
    /* --- APP-ONLY SPLASH SCREEN STYLES --- */
    #splash-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000000;
      z-index: 11000;
      display: none; /* JS will show this only in App Mode */
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.8s ease-out;
    }
    .splash-logo {
      width: 120px;
      border-radius: 20%;
      margin-bottom: 30px;
      animation: splashScale 0.6s ease-out forwards;
    }
    .unfolding-text { text-align: center; perspective: 1000px; }
    .unfold-item {
      display: block; color: #ff4d4d; font-weight: 800; font-size: 1.3rem;
      text-transform: uppercase; opacity: 0; transform: rotateX(-90deg);
      margin-bottom: 5px;
    }
    .unfold-active { animation: unfoldAnim 1.5s ease-in-out forwards; }
    .loader-container {
      position: absolute; bottom: 12%; width: 220px; height: 4px;
      background: #1a1a1a; border-radius: 10px; overflow: hidden;
    }
    .loader-bar { width: 0%; height: 100%; background: #ff4d4d; box-shadow: 0 0 15px #ff4d4d; }
    @keyframes splashScale { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes unfoldAnim { 0% { transform: rotateX(-90deg); opacity: 0; } 100% { transform: rotateX(0deg); opacity: 1; } }
    @keyframes barLoad { from { width: 0%; } to { width: 100%; } }

    /* --- SITE LAYOUT STYLES --- */
    .error-alert { max-width: 500px; margin: 20px auto; }
    .card { opacity: 0; transform: translateY(30px); transition: opacity 0.6s, transform 0.6s; border-radius: 10px; overflow: hidden; border: 2px solid transparent; }
    .card.visible { opacity: 1; transform: translateY(0); }
    .watch-button { animation: pulseBtn 1.5s infinite; }
    @keyframes pulseBtn { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    
    .event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; padding: 1rem; }
    .card:hover { transform: translateY(-8px); border-color: #ff4d4d; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    
    /* Floating Buttons */
    #pwaWrapper { position: fixed; bottom: 20px; left: 20px; z-index: 9999; display: none; align-items: center; }
    #installAppBtn { background: #ff4d4d; color: white; border: none; border-radius: 50px; padding: 10px 18px; font-weight: bold; cursor: pointer; display: flex; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    #closePwa { background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 22px; height: 22px; font-size: 10px; margin-left: -10px; margin-top: -30px; cursor: pointer; }
    
    #discordBtn { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
    #discordBtn img { width: 48px; height: 48px; border-radius: 50%; box-shadow: 0 0 10px #5865F2; transition: transform 0.2s; }
    #discordBtn img:hover { transform: scale(1.1); }
  </style>
</head>
<body>

  <div id="splash-screen">
    <div class="splash-content">
      <img src="https://i.postimg.cc/gkfNSFPv/lqo4nv.jpg" class="splash-logo" alt="Logo">
      <div class="unfolding-text">
        <span class="unfold-item">Free PPV</span>
        <span class="unfold-item">Sports Everywhere</span>
        <span class="unfold-item">Anytime</span>
        <span class="unfold-item">On the Go</span>
      </div>
    </div>
    <div class="loader-container"><div class="loader-bar" id="splash-bar"></div></div>
  </div>

  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header"><button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP Access</a></li>
        <li class="nav-item dropdown">
          <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">Account</a>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="/auth/login" id="menuLogin">Login</a></li>
            <li><button class="dropdown-item text-danger" id="menuLogout" style="display:none;">Logout</button></li>
          </ul>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="text-center py-5 bg-dark">
      <h1 class="display-4 fw-bold">FutbolX</h1>
      <p class="lead">Premium Sports & PPV Streaming</p>
    </div>
    
    <div class="container">
      <div id="errorContainer" class="d-none alert alert-danger"></div>

      <div id="live" class="mt-4">
        <h2>Live Now <span id="liveAnimation" class="live-animation d-none"></span></h2>
        <div id="livecards" class="event-grid"><p>Scanning for live events...</p></div>
      </div>

      <div id="football" class="mt-5 d-none"><h2>Football</h2><div id="footballcards" class="event-grid"></div></div>
      <div id="nba" class="mt-5 d-none"><h2>Basketball</h2><div id="nbacards" class="event-grid"></div></div>
      <div id="fights" class="mt-5 d-none"><h2>Fights</h2><div id="fightscards" class="event-grid"></div></div>
      <div id="wrestling" class="mt-5 d-none"><h2>Wrestling</h2><div id="wrestlingcards" class="event-grid"></div></div>
      <div id="darts" class="mt-5 d-none"><h2>Darts</h2><div id="dartscards" class="event-grid"></div></div>
      <div id="motorsports" class="mt-5 d-none"><h2>Motorsports</h2><div id="motorsportscards" class="event-grid"></div></div>
      <div id="nfl" class="mt-5 d-none"><h2>NFL</h2><div id="nflcards" class="event-grid"></div></div>
      <div id="others" class="mt-5 d-none"><h2>Others</h2><div id="otherscards" class="event-grid"></div></div>
    </div>
  </div>

  <div id="pwaWrapper">
    <button id="installAppBtn"><i class="fas fa-download"></i> Download App</button>
    <button id="closePwa">✕</button>
  </div>

  <a href="https://discord.gg/UzHzerb6XY" target="_blank" id="discordBtn">
    <img src="https://i.postimg.cc/gkfNSFPv/lqo4nv.jpg" alt="Discord Support">
  </a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/assets/js/api.js"></script>

  <script>
    /* --- PWA & SPLASH LOGIC --- */
    window.addEventListener('load', () => {
      const isApp = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      
      if (isApp) {
        const splash = document.getElementById('splash-screen');
        const bar = document.getElementById('splash-bar');
        const texts = document.querySelectorAll('.unfold-item');

        splash.style.display = 'flex';
        bar.style.animation = 'barLoad 3s ease-in-out forwards';
        
        texts.forEach((text, i) => {
          setTimeout(() => { text.classList.add('unfold-active'); }, i * 400);
        });

        setTimeout(() => {
          splash.style.opacity = '0';
          setTimeout(() => { splash.style.display = 'none'; }, 800);
        }, 3500);
      }

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log("SW failed", err));
      }
    });

    /* --- CORE STREAMING LOGIC --- */
    let apiInstance = { baseUrl: window.location.origin + '/api' };
    let lastApiCall = 0;

    function zeropad(n) { return n > 9 ? n : '0' + n; }

    async function loadContent(api) {
      const livecards = document.getElementById('livecards');
      const liveAnim = document.getElementById('liveAnimation');
      try {
        const res = await fetch(`${api.baseUrl}/stream`);
        const data = await res.json();
        const categories = data.categories || [];
        
        // Reset containers
        livecards.innerHTML = '';
        const containers = ['football','nba','fights','wrestling','darts','motorsports','nfl','others'];
        containers.forEach(id => {
          const el = document.getElementById(id + 'cards');
          if(el) { el.innerHTML = ''; el.parentElement.classList.add('d-none'); }
        });

        let hasLive = false;
        const now = Math.floor(Date.now() / 1000);

        // Fetch each category file
        for (let cat of categories) {
          try {
            const catRes = await fetch(`${api.baseUrl}/${cat}.json`);
            const catData = await catRes.json();
            
            catData.streams.forEach(stream => {
              let startTime = new Date(stream.starts_at + '+03:00').getTime() / 1000;
              let endTime = stream.ends_at ? new Date(stream.ends_at + '+03:00').getTime() / 1000 : startTime + 10800;
              
              if (now > endTime) return;

              const isLive = (startTime <= now && now <= endTime) || stream.always_live === 1;
              const poster = stream.poster || 'https://via.placeholder.com/285x160?text=FutbolX';
              
              const cardHtml = `
                <a href="/live/${stream.uri_name}" style="text-decoration:none; color:inherit;">
                  <div class="card">
                    ${isLive ? '<span class="badge bg-danger" style="position:absolute; top:10px; right:10px;">LIVE</span>' : ''}
                    <img src="${poster}" class="card-img-top" alt="${stream.name}">
                    <div class="card-body">
                      <h5 class="card-title">${stream.name}</h5>
                      <p class="card-text">
                        <small>${stream.tag}</small>
                        <span class="float-end">
                          ${isLive ? '<button class="btn btn-danger btn-sm watch-button">Watch</button>' : `<span class="countdown" data-start="${startTime}" data-uri="/live/${stream.uri_name}"></span>`}
                        </span>
                      </p>
                    </div>
                  </div>
                </a>`;

              if (isLive) {
                livecards.innerHTML += cardHtml;
                hasLive = true;
              } else {
                const targetId = containers.includes(cat) ? cat + 'cards' : 'otherscards';
                const targetEl = document.getElementById(targetId);
                if (targetEl) {
                  targetEl.innerHTML += cardHtml;
                  targetEl.parentElement.classList.remove('d-none');
                }
              }
            });
          } catch(e) { console.log("Category error", e); }
        }

        if(!hasLive) {
          livecards.innerHTML = '<p>No live events at the moment.</p>';
          liveAnim.classList.add('d-none');
        } else {
          liveAnim.classList.remove('d-none');
        }

        // Apply Scroll Animation
        const observer = new IntersectionObserver(entries => {
          entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('visible'); });
        }, { threshold: 0.1 });
        document.querySelectorAll('.card').forEach(c => observer.observe(c));

      } catch (err) {
        livecards.innerHTML = '<p>Error loading streams. Please refresh.</p>';
      }
    }

    function countdown() {
      const now = Math.floor(Date.now() / 1000);
      document.querySelectorAll('.countdown').forEach(el => {
        const start = parseInt(el.getAttribute('data-start'));
        let diff = start - now;
        if (diff > 0) {
          let h = Math.floor(diff / 3600);
          let m = Math.floor((diff % 3600) / 60);
          let s = diff % 60;
          el.innerHTML = `${zeropad(h)}:${zeropad(m)}:${zeropad(s)}`;
        } else {
          el.innerHTML = "Starting...";
          if (Date.now() - lastApiCall > 5000) { lastApiCall = Date.now(); loadContent(apiInstance); }
        }
      });
      setTimeout(countdown, 1000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent(apiInstance);
      countdown();
    });

    /* --- FIREBASE AUTH --- */
    const fbConfig = { apiKey: "AIzaSyBulGl-96u38wmkAs_R9FcuQMsBTkLN6ak", authDomain: "futbolx-auth-31bc6.firebaseapp.com", projectId: "futbolx-auth-31bc6", storageBucket: "futbolx-auth-31bc6.firebasestorage.app", messagingSenderId: "262628908181", appId: "1:262628908181:web:c823d458e2e2685ab48f9c" };
    firebase.initializeApp(fbConfig);
    firebase.auth().onAuthStateChanged(user => {
      document.getElementById('menuLogin').style.display = user ? 'none' : 'block';
      document.getElementById('menuLogout').style.display = user ? 'block' : 'none';
    });
    document.getElementById('menuLogout').addEventListener('click', () => {
      firebase.auth().signOut().then(() => window.location.reload());
    });

    /* --- INSTALL PROMPT --- */
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const isApp = window.matchMedia('(display-mode: standalone)').matches;
      if (!sessionStorage.getItem('pwaClosed') && !isApp) {
        document.getElementById('pwaWrapper').style.display = 'flex';
      }
    });

    document.getElementById('installAppBtn').addEventListener('click', () => {
      document.getElementById('pwaWrapper').style.display = 'none';
      deferredPrompt.prompt();
    });

    document.getElementById('closePwa').addEventListener('click', () => {
      document.getElementById('pwaWrapper').style.display = 'none';
      sessionStorage.setItem('pwaClosed', 'true');
    });
  </script>
</body>
</html>
