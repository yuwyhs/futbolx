<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    .theater-container { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .main-player-col { flex: 1 1 65%; min-width: 350px; }
    .side-epg-col { flex: 1 1 30%; min-width: 320px; }

    .tip-container { max-width:600px; margin:20px auto; transition:height .3s; overflow:hidden; }
    .alert-info { text-align:center; position:relative; padding-right:50px; }
    #countdownTimer { position:absolute; top:8px; right:10px; font-weight:bold; color:#ff4d4d; }
    
    .permanent-noti { margin-top: 12px; background: linear-gradient(135deg, #1e3a5f, #2a4a7a); border-color: #4a8cff; color: #e0f0ff; text-align: center; position: relative; transition: opacity 0.6s ease-in; }
    #joinAlert { background: linear-gradient(135deg, #6b48ff, #00ddeb) !important; border-color: #8b5cf6 !important; color: white !important; }

    .btn-fullscreen { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 20px; transition: .3s; }
    .btn-fullscreen:hover { transform: scale(1.05); background: #e63939; }

    .video-container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
    #oplayer-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .plyr { --plyr-color-main: #ff4d4d; font-family: 'Kanit', sans-serif; height: 100%; }
    .disclaimer { text-align: center; font-size: 0.85rem; padding: 20px 15px; margin-top: 30px; border-top: 1px solid #444; max-width: 900px; margin-left: auto; margin-right: auto; color: #aaa; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"><i class="fas fa-bars"></i></button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      
      <div class="tip-container">
        <div class="alert alert-info" id="tipAlert"><strong>Tip:</strong> Use an ad blocker. <span id="countdownTimer">10s</span></div>
        <div class="alert alert-info permanent-noti d-none" id="infoAlert"><strong>Info:</strong> Try a VPN if the stream is laggy.</div>
        <div class="alert alert-info permanent-noti d-none" id="joinAlert"><strong>Join us</strong> on <a href="#" style="color:white;">Discord</a>!</div>
      </div>

      <div class="d-flex align-items-center mb-3">
        <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back</a>
        <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
      </div>

      <div class="theater-container">
        <div class="main-player-col">
          <h2 id="eventTitle" class="mb-3">Loading...</h2>
          
          <div class="video-container">
            <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="display:none; width:100%; height:100%;"></iframe>
            <div id="oplayer-container" style="display:none;">
              <video id="plyr-player" playsinline controls crossorigin></video>
            </div>
          </div>

          <div class="stream-dropdown mt-3">
            <div class="dropdown">
              <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                Select Channel
              </button>
              <ul class="dropdown-menu" id="streamDropdownMenu" aria-labelledby="streamDropdown"></ul>
            </div>
          </div>
        </div>
        <div class="side-epg-col"></div>
      </div>

      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
        <ul class="nav justify-content-center">
          <li class="nav-item"><a href="/vip" class="nav-link px-2 text-body-secondary">Donate / VIP Access</a></li>
        </ul>
      </footer>

      <div class="disclaimer">
        We DO NOT host nor transmit any audiovisual content itself... All content is copyright of their respective owners.
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;
    let streamData = null;

    async function initPlayer(url) {
      const isM3U8 = url.toLowerCase().includes('.m3u8');
      const embed = document.getElementById('embedPlayer');
      const container = document.getElementById('oplayer-container');
      const video = document.getElementById('plyr-player');
      const fsBtn = document.getElementById('fullscreenBtn');

      if (player) player.destroy();
      if (hls) hls.destroy();

      if (isM3U8) {
        embed.style.display = 'none';
        container.style.display = 'block';
        fsBtn.classList.remove('d-none');

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            // Quality labels (fixes the 0p bug)
            const availableQualities = hls.levels.map((l) => l.height);
            
            player = new Plyr(video, {
              quality: {
                default: 0,
                options: [0, ...availableQualities],
                forced: true,
                onChange: (newQuality) => {
                  if (newQuality === 0) hls.currentLevel = -1; // Auto
                  else hls.currentLevel = hls.levels.findIndex(l => l.height === newQuality);
                }
              },
              // Speed removed here
              controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'cast', 'fullscreen'],
              settings: ['quality', 'captions'], 
              captions: { active: true, update: true, language: 'auto' }
            });

            // Set the label for Auto
            player.config.i18n.quality = 'Quality';
            player.config.quality.labels = { 0: 'Auto' };
          });
        } else {
          video.src = url;
          player = new Plyr(video);
        }
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = url;
        fsBtn.classList.add('d-none');
      }
    }

    document.getElementById('fullscreenBtn').onclick = () => {
      if(player) player.fullscreen.enter();
      else if(document.getElementById('embedPlayer').style.display !== 'none') document.getElementById('embedPlayer').requestFullscreen();
    };

    function populateDropdown(streams) {
      const menu = document.getElementById('streamDropdownMenu');
      const btn = document.getElementById('streamDropdown');
      
      menu.innerHTML = streams.map((s, i) => 
        `<li><a class="dropdown-item" href="#" data-url="${s.url}" data-label="${s.label || 'Stream ' + (i+1)}">${s.label || 'Stream ' + (i+1)}</a></li>`
      ).join('');

      // Fixed: Adding event listener to menu instead of relying on onclick
      menu.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const url = item.getAttribute('data-url');
          const label = item.getAttribute('data-label');
          btn.textContent = label;
          initPlayer(url);
        });
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        let all = [];
        Object.keys(data.streams).forEach(cat => all = all.concat(data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          populateDropdown(event.streams);
          initPlayer(event.streams[0].url);
        }
      });

      // Simple Notification Timer
      let sec = 10;
      const timer = setInterval(() => {
        sec--; 
        const t = document.getElementById('countdownTimer');
        if(t) t.textContent = sec + 's';
        if(sec <= 0) {
          clearInterval(timer);
          const tip = document.getElementById('tipAlert');
          if(tip) {
            tip.classList.add('fade-out');
            setTimeout(() => {
              tip.style.display = 'none';
              document.getElementById('infoAlert').classList.remove('d-none');
            }, 500);
          }
        }
      }, 1000);
    });
  </script>
</body>
</html>
