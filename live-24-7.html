  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script defer src="/assets/js/api.js"></script>
  <script defer src="/assets/js/auth.js"></script>

  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };

    let embedPlayer = null;
    let oplayerInstance = null;
    let streamData = null;
    let currentStreamIndex = 0;
    let countdownInterval = null;

    // Block popups
    const originalOpen = window.open;
    window.open = function(url) {
      console.log('Blocked popup attempt to:', url);
      return null;
    };

    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      if (!tipContainer || !tipAlert || !countdownTimer) return;

      if (countdownInterval) clearInterval(countdownInterval);

      let seconds = 10;
      countdownTimer.textContent = `${seconds}s`;
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;

      countdownInterval = setInterval(() => {
        seconds--;
        if (seconds >= 0) {
          countdownTimer.textContent = `${seconds}s`;
        }
        if (seconds <= 0) {
          clearInterval(countdownInterval);
          countdownInterval = null;
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
    }

    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      const themeToggle = document.getElementById('themeToggle');
      const logoutButton = document.getElementById('logoutButton');

      if (!offcanvasElement || !toggler || !themeToggle) return;

      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement, {
          backdrop: true,
          keyboard: true,
          scroll: false
        });

        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', (event) => {
            const href = link.getAttribute('href');
            if (href) {
              window.location.href = href;
              offcanvas.hide();
            }
          });
        });

        if (logoutButton) {
          logoutButton.addEventListener('click', () => {
            if (typeof logout === 'function') logout();
            offcanvas.hide();
          });
        }
      } catch (error) {
        console.error('Offcanvas initialization error:', error);
      }
    }

    function initThemeToggle() {
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      if (!themeToggle || !htmlElement) return;

      try {
        const currentTheme = localStorage.getItem('theme') || 'dark';
        htmlElement.setAttribute('data-bs-theme', currentTheme);
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';

        themeToggle.addEventListener('click', () => {
          const current = htmlElement.getAttribute('data-bs-theme');
          const newTheme = current === 'dark' ? 'light' : 'dark';
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });
      } catch (error) {
        console.error('Theme toggle error:', error);
      }
    }

    async function isM3U8Stream(url) {
      if (url.toLowerCase().includes('.m3u8')) return true;
      try {
        const response = await fetch(url, { 
          method: 'GET', 
          headers: { 'Range': 'bytes=0-1023' },
          signal: AbortSignal.timeout(5000)
        });
        if (!response.ok) return false;
        const content = await response.text();
        return content.includes('#EXTM3U') || content.includes('.ts');
      } catch {
        return false;
      }
    }

    async function initPlayer(event, streamIndex, errorContainer) {
      try {
        clearError();

        embedPlayer = document.getElementById('embedPlayer');
        const oplayerDiv = document.getElementById('oplayer');

        if (!embedPlayer || !oplayerDiv) throw new Error('Player elements not found');

        const stream = event.streams[streamIndex];
        const streamUrl = stream.url;

        if (!streamUrl || !/^https?:/.test(streamUrl)) throw new Error('Invalid stream URL');

        const isM3U8 = await isM3U8Stream(streamUrl);

        if (isM3U8) {
          embedPlayer.style.display = 'none';
          oplayerDiv.classList.remove('d-none');
          oplayerDiv.style.display = 'block';

          // Clean up previous instance
          if (oplayerInstance) {
            oplayerInstance.destroy();
            oplayerInstance = null;
          }

          // Initialize OPlayer
          oplayerInstance = OPlayer.make('#oplayer', {
            src: streamUrl,
            isLive: true,
            autoplay: true,
            muted: true,
            volume: 0.8,
            lang: 'en',
            hotkey: true,
            mutex: true,
            screenshot: true,
            plugins: [OPlayer.Hls]
          });

          oplayerInstance.on('play', () => {
            oplayerInstance.muted = false;
            oplayerInstance.setVolume(0.8);
          });

          oplayerInstance.on('error', (e) => {
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Stream error: ' + (e.message || 'Unknown error');
          });

          oplayerInstance.on('canplay', () => clearError());
        } else {
          oplayerDiv.style.display = 'none';
          embedPlayer.style.display = 'block';

          if (oplayerInstance) {
            oplayerInstance.destroy();
            oplayerInstance = null;
          }

          const url = new URL(streamUrl);
          url.searchParams.append('autoplay', '1');
          embedPlayer.src = url.toString();
          embedPlayer.muted = true;

          embedPlayer.addEventListener('load', () => {
            try {
              embedPlayer.contentWindow.postMessage({ type: 'play' }, '*');
              embedPlayer.contentWindow.postMessage({ type: 'unmute' }, '*');
              embedPlayer.muted = false;
            } catch (e) {}
            clearError();
          });

          embedPlayer.addEventListener('error', () => {
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load embed stream.';
          });
        }

        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
          fullscreenBtn.classList.remove('d-none');
          fullscreenBtn.onclick = () => {
            const container = isM3U8 ? oplayerDiv : embedPlayer;
            if (container.requestFullscreen) {
              container.requestFullscreen().catch(() => {});
            } else if (container.webkitRequestFullscreen) {
              container.webkitRequestFullscreen();
            }
          };
        }
      } catch (err) {
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Failed to initialize stream: ' + err.message;
      }
    }

    function populateStreamDropdown(streams) {
      const dropdownMenu = document.getElementById('streamDropdownMenu');
      const dropdownButton = document.getElementById('streamDropdown');

      if (!dropdownMenu || !dropdownButton) return;

      dropdownMenu.innerHTML = '';

      if (streams.length === 0) {
        dropdownMenu.innerHTML = '<li><span class="dropdown-item disabled">No streams available</span></li>';
        dropdownButton.textContent = 'No Streams';
        dropdownButton.disabled = true;
        return;
      }

      streams.forEach((stream, index) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'dropdown-item';
        a.href = '#';
        a.textContent = stream.label || `Stream ${index + 1}`;
        a.dataset.streamIndex = index;
        li.appendChild(a);
        dropdownMenu.appendChild(li);
      });

      dropdownButton.textContent = streams[currentStreamIndex].label || `Stream ${currentStreamIndex + 1}`;
      dropdownButton.disabled = streams.length === 1;

      const dropdownItems = dropdownMenu.querySelectorAll('.dropdown-item');
      dropdownItems.forEach(item => {
        item.addEventListener('click', (event) => {
          event.preventDefault();
          const streamIndex = parseInt(item.dataset.streamIndex);
          if (streamIndex !== currentStreamIndex) {
            currentStreamIndex = streamIndex;
            dropdownButton.textContent = streams[streamIndex].label || `Stream ${streamIndex + 1}`;
            initPlayer(streamData, streamIndex, document.getElementById('errorContainer'));
          }
        });
      });
    }

    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then(data => resolve(data))
            .catch(error => {
              if (attempts < maxRetries) {
                setTimeout(attempt, delay);
              } else {
                reject(error);
              }
            });
        }
        attempt();
      });
    }

    function initPage() {
      const errorContainer = document.getElementById('errorContainer');
      const eventTitle = document.getElementById('eventTitle');

      if (!errorContainer || !eventTitle) return;

      try {
        const uriName = window.location.pathname.split('/').pop();
        const apiUrl = '/api/stream-24-7';

        fetchWithRetry(apiUrl)
          .then(data => {
            if (!data?.success) throw new Error('Invalid stream data');

            const streams = [];
            Object.keys(data.streams).forEach(category => {
              data.streams[category].forEach(stream => {
                streams.push({ ...stream, category });
              });
            });

            const event = streams.find(s => s.uri_name === uriName);
            if (!event || !event.streams?.length) {
              throw new Error(`Stream not found: ${uriName}`);
            }

            eventTitle.innerText = event.name;
            streamData = event;

            populateStreamDropdown(event.streams);
            initPlayer(streamData, currentStreamIndex, errorContainer);
          })
          .catch(error => {
            eventTitle.innerText = 'Error: Stream Not Found';
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = error.message.includes('not found')
              ? `Stream "${uriName}" not found. Redirecting...`
              : 'Failed to load stream data.';
            setTimeout(() => window.location.href = '/24-7', 3000);
          });

        try { checkAuthStatus?.(); } catch {}
      } catch (error) {
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Initialization error: ' + error.message;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initOffcanvas();
      startTipCountdown();
      initPage();
    });
  </script>
