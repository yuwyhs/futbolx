<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* REMOVE TIPS AS REQUESTED */
    .tip-container { display: none !important; }

    /* QUALITY MENU SCROLLABLE FIX */
    .plyr__menu__container [role=menu] {
      max-height: 200px;
      overflow-y: auto;
    }

    /* HIDE VOLUME BAR BUT KEEP ICON */
    .plyr__volume input[type=range] {
      display: none !important;
    }
    .plyr__volume {
      min-width: unset !important;
    }

    .btn-fullscreen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 20px;
      margin-left: 10px;
      transition: transform 0.3s, background 0.3s;
    }
    
    /* External Cast Text Button - Matches your style */
    .btn-cast-link {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        margin-left: 15px;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.9rem;
    }

    .offcanvas { z-index: 1055 !important; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          
          <div class="d-flex align-items-center mb-3">
            <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7 Streams</a>
            <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
          </div>
          
          <h2 id="eventTitle" class="mb-3"></h2>
          
          <div class="player-container">
            <div class="video-container">
              <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="width: 100%; height: 100%; display:none;"></iframe>
              <div id="videoPlayerContainer" style="width: 100%; height: 100%;">
                <video id="videoPlayer" playsinline controls crossorigin></video>
              </div>
            </div>
            
            <div class="stream-dropdown d-flex align-items-center">
              <div class="dropdown">
                <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  Select Stream
                </button>
                <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
              </div>
              <span id="castTrigger" class="btn-cast-link d-none">Cast</span>
            </div>
          </div>
          
          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>
      
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary text-center text-lg-start">FutbolX 2026</p>
      </footer>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;
    let streamData = null;

    function isM3U8(url) {
        return url.split('?')[0].toLowerCase().endsWith('.m3u8') || url.toLowerCase().includes('.m3u8?');
    }

    async function initPlayer(event, streamIndex) {
      const streamUrl = event.streams[streamIndex].url;
      const video = document.getElementById('videoPlayer');
      const embed = document.getElementById('embedPlayer');
      const container = document.getElementById('videoPlayerContainer');
      const fsBtn = document.getElementById('fullscreenBtn');
      const castBtn = document.getElementById('castTrigger');

      if (player) player.destroy();
      if (hls) hls.destroy();

      if (isM3U8(streamUrl)) {
        embed.style.display = 'none';
        container.style.display = 'block';
        fsBtn.classList.remove('d-none');
        castBtn.classList.remove('d-none');

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            const qualities = hls.levels.map(l => l.height);
            player = new Plyr(video, {
              autoplay: true,
              // REMOVED 'speed' from settings
              controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
              settings: ['quality', 'captions'],
              quality: {
                default: 0,
                options: [0, ...qualities],
                forced: true,
                onChange: (q) => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); }
              }
            });

            player.on('ready', () => {
              // CHANGE 0p TO AUTO
              const labels = { 0: 'Auto' };
              qualities.forEach(q => { labels[q] = q + 'p'; });
              player.config.quality.labels = labels;

              // VOLUME TOGGLE LOGIC (HIDE BAR, TOGGLE MUTE/FULL)
              const muteBtn = document.querySelector('.plyr__control[data-plyr="mute"]');
              if(muteBtn) {
                  muteBtn.addEventListener('click', (e) => {
                      e.preventDefault();
                      if (player.muted) {
                          player.muted = false;
                          player.volume = 1;
                      } else {
                          player.muted = true;
                      }
                  });
              }
            });
            video.play();
          });
        }
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = streamUrl;
      }
    }

    // CAST FUNCTIONALITY
    document.getElementById('castTrigger').onclick = () => {
        if (!window.chrome || !window.chrome.cast) {
            alert("Chrome/Edge required for casting.");
            return;
        }
        const sessionRequest = new chrome.cast.SessionRequest(chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID);
        const apiConfig = new chrome.cast.ApiConfig(sessionRequest, (s) => console.log("Cast Session Started"), (e) => console.log(e));
        chrome.cast.initialize(apiConfig, () => {
            chrome.cast.requestSession((s) => console.log("Success"), (e) => console.log("Failed", e));
        }, (e) => console.log("Error", e));
    };

    document.getElementById('fullscreenBtn').onclick = () => player ? player.fullscreen.enter() : document.getElementById('embedPlayer').requestFullscreen();

    // YOUR ORIGINAL FETCH LOGIC
    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        let all = [];
        Object.keys(data.streams).forEach(cat => all = all.concat(data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          
          // Populate Dropdown
          const menu = document.getElementById('streamDropdownMenu');
          menu.innerHTML = event.streams.map((s, i) => `<li><a class="dropdown-item" href="#" data-index="${i}">${s.label || 'Stream '+(i+1)}</a></li>`).join('');
          menu.querySelectorAll('.dropdown-item').forEach(item => {
            item.onclick = (e) => {
                e.preventDefault();
                initPlayer(streamData, item.dataset.index);
                document.getElementById('streamDropdown').textContent = item.textContent;
            };
          });

          initPlayer(streamData, 0);
        }
      });
    });
  </script>
</body>
</html>
