<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    .theater-container { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .main-player-col { flex: 1 1 65%; min-width: 350px; }
    .side-epg-col { flex: 1 1 30%; min-width: 320px; }

    .btn-control { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 20px; transition: .3s; cursor: pointer; text-decoration: none; }
    .btn-control:hover { transform: scale(1.05); background: #e63939; color: #fff; }

    .video-container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
    #oplayer-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .plyr { --plyr-color-main: #ff4d4d; font-family: 'Kanit', sans-serif; height: 100%; }
    
    /* VERTICAL SMOOTH VOLUME */
    .plyr__volume { min-width: unset; position: relative; }
    .plyr__volume input[type=range] {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: rotate(-90deg) translateX(50%);
      transform-origin: left center;
      width: 100px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease, bottom 0.3s ease;
      background: rgba(26, 26, 26, 0.95);
      padding: 12px 8px;
      border-radius: 8px;
      z-index: 10;
    }
    .plyr__volume:hover input[type=range], 
    .plyr__volume:focus-within input[type=range],
    .plyr--is-ios .plyr__volume--active input[type=range] {
      opacity: 1;
      visibility: visible;
      bottom: 150%;
    }

    /* SCROLLABLE QUALITY MENU */
    .plyr__menu__container [role=menu] { max-height: 180px; overflow-y: auto; }

    .disclaimer { text-align: center; font-size: 0.85rem; padding: 20px 15px; margin-top: 30px; border-top: 1px solid #444; color: #aaa; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"><i class="fas fa-bars"></i></button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="d-flex align-items-center mb-3 gap-2">
        <a href="/24-7" class="btn-control"><i class="fas fa-arrow-left"></i> Back</a>
        <button id="externalCastBtn" class="btn-control d-none"><i class="fas fa-cast"></i> Cast</button>
        <button id="fullscreenBtn" class="btn-control d-none"><i class="fas fa-expand"></i> Fullscreen</button>
      </div>

      <div class="theater-container">
        <div class="main-player-col">
          <h2 id="eventTitle" class="mb-3"></h2>
          <div class="video-container">
            <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="display:none; width:100%; height:100%;"></iframe>
            <div id="oplayer-container" style="display:none;">
              <video id="plyr-player" playsinline controls crossorigin></video>
            </div>
          </div>
          <div class="stream-dropdown mt-3">
            <div class="dropdown">
              <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">Select Channel</button>
              <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
            </div>
          </div>
        </div>
        <div class="side-epg-col"></div>
      </div>
      
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
        <ul class="nav justify-content-center"><li class="nav-item"><a href="/vip" class="nav-link px-2 text-body-secondary">Donate / VIP Access</a></li></ul>
      </footer>
      <div class="disclaimer">We DO NOT host nor transmit any audiovisual content... All content is copyright of their respective owners.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;

    function isHLS(url) { return url.split('?')[0].toLowerCase().endsWith('.m3u8') || url.toLowerCase().includes('.m3u8?'); }

    async function initPlayer(url) {
      const isM3U8 = isHLS(url);
      const embed = document.getElementById('embedPlayer');
      const container = document.getElementById('oplayer-container');
      const video = document.getElementById('plyr-player');
      const fsBtn = document.getElementById('fullscreenBtn');
      const castBtn = document.getElementById('externalCastBtn');

      if (player) player.destroy();
      if (hls) hls.destroy();

      if (isM3U8) {
        embed.style.display = 'none';
        container.style.display = 'block';
        fsBtn.classList.remove('d-none');
        castBtn.classList.remove('d-none');

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          
          hls.on(Hls.Events.MANIFEST_PARSED, function () {
            const qualities = hls.levels.map(l => l.height);
            
            player = new Plyr(video, {
              autoplay: true,
              muted: false,
              clickToPlay: true,
              // Removed 'cast' from internal controls
              controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
              settings: ['quality', 'captions'],
              quality: {
                default: 0,
                options: [0, ...qualities],
                forced: true,
                onChange: (q) => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); }
              }
            });

            // QUALITY LABELS FIX
            const labels = { 0: 'Auto' };
            qualities.forEach(q => { labels[q] = q + 'p'; });
            player.config.quality.labels = labels;

            // CAPTION LOGIC: Only show button if tracks exist
            player.on('ready', () => {
              const tracks = video.textTracks;
              const capBtn = document.querySelector('.plyr__control[data-plyr="captions"]');
              if (tracks.length === 0 && capBtn) capBtn.style.display = 'none';
              
              // Smooth Volume - Disable click to mute
              const volBtn = document.querySelector('.plyr__control[data-plyr="mute"]');
              if(volBtn) volBtn.addEventListener('click', (e) => {
                e.stopPropagation(); // Stops Plyr from muting
                document.querySelector('.plyr__volume').classList.toggle('plyr__volume--active');
              }, true);
            });

            // Autostart engine
            video.play().catch(() => { player.muted = true; video.play(); });
          });
        }
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = url;
        fsBtn.classList.add('d-none');
        castBtn.classList.add('d-none');
      }
    }

    // External Controls
    document.getElementById('fullscreenBtn').onclick = () => player ? player.fullscreen.enter() : document.getElementById('embedPlayer').requestFullscreen();
    document.getElementById('externalCastBtn').onclick = () => {
        if (window.chrome && window.chrome.cast) {
            const sessionRequest = new chrome.cast.SessionRequest(chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID);
            const apiConfig = new chrome.cast.ApiConfig(sessionRequest, () => {}, () => {});
            chrome.cast.initialize(apiConfig, () => {
                chrome.cast.requestSession((s) => console.log("Cast Session Started"), (e) => console.log("Cast Error", e));
            });
        } else {
            alert("Casting requires a supported browser (Chrome/Edge) and a secure connection.");
        }
    };

    function populateDropdown(streams) {
      const menu = document.getElementById('streamDropdownMenu');
      const btn = document.getElementById('streamDropdown');
      menu.innerHTML = streams.map((s, i) => `<li><a class="dropdown-item" href="#" data-url="${s.url}" data-label="${s.label || 'Channel ' + (i+1)}">${s.label || 'Channel ' + (i+1)}</a></li>`).join('');
      menu.querySelectorAll('.dropdown-item').forEach(item => {
        item.onclick = (e) => {
          e.preventDefault();
          btn.textContent = item.getAttribute('data-label');
          initPlayer(item.getAttribute('data-url'));
        };
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        let all = [];
        Object.keys(data.streams).forEach(cat => all = all.concat(data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          populateDropdown(event.streams);
          initPlayer(event.streams[0].url);
        }
      });
    });
  </script>
</body>
</html>
