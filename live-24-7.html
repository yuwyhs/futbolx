<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <meta name="description" content="FutbolX - Watch 24/7 cartoons and other content.">
  <meta name="keywords" content="futbolx, cartoons, 24/7, stream, online, free">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900|outfit:300,400,500,600,700" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <style>
    /* ===== FUTBOLX UI THEME ===== */
    :root {
      --fx-bg: #07080b;
      --fx-surface: #0f1118;
      --fx-surface-hover: #171a26;
      --fx-glass: rgba(15, 17, 24, 0.75);
      --fx-glass-border: rgba(255, 255, 255, 0.08);

      --fx-accent: #ef4444;
      --fx-accent-hover: #f87171;
      --fx-accent-dark: #dc2626;
      --fx-accent-glow: rgba(239, 68, 68, 0.30);

      --fx-gold: #ffc107;
      --fx-text-main: #f1f5f9;
      --fx-text-muted: #94a3b8;
      --fx-radius: 14px;
    }

    [data-bs-theme="light"] {
      --fx-bg: #f8fafc;
      --fx-surface: #ffffff;
      --fx-surface-hover: #f1f5f9;
      --fx-glass: rgba(255, 255, 255, 0.85);
      --fx-glass-border: rgba(0, 0, 0, 0.08);
      --fx-text-main: #0f172a;
      --fx-text-muted: #64748b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--fx-bg) !important;
      color: var(--fx-text-main);
      font-family: 'Outfit', sans-serif;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== GLASS TOP BAR ===== */
    .top-bar {
      background: var(--fx-glass) !important;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--fx-glass-border);
      padding: 12px 0;
      transition: all 0.3s ease;
    }

    .top-bar .container-fluid {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      max-width: 1600px;
    }

    #sidebarToggler {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid var(--fx-glass-border) !important;
      color: var(--fx-text-main) !important;
      border-radius: 10px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }

    #sidebarToggler:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      transform: scale(1.03);
    }

    /* ===== BRAND ===== */
    .futbolx-brand {
      font-family: 'Kanit', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--fx-text-main) !important;
      display: inline-flex;
      align-items: center;
      user-select: none;
      text-decoration: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      text-shadow: none !important;
      filter: none !important;
    }

    .futbolx-brand .ball-o {
      color: var(--fx-gold);
      font-size: 1.25rem;
      margin: 0 2px;
      filter: none !important;
      text-shadow: none !important;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-block;
    }

    .futbolx-brand:hover .ball-o {
      transform: rotate(180deg) scale(1.1);
    }

    .futbolx-brand .ball-o.spinning {
      animation: ballSpin 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes ballSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* ===== SIDEBAR ===== */
    .offcanvas {
      background-color: var(--fx-surface) !important;
      border-right: 1px solid var(--fx-glass-border) !important;
    }

    .offcanvas-header {
      border-bottom: 1px solid var(--fx-glass-border);
      padding: 16px;
    }

    .offcanvas-header .offcanvas-title {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
    }

    .offcanvas-body {
      padding: 16px;
    }

    .offcanvas .nav-link {
      color: var(--fx-text-main) !important;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-bottom: 4px;
      text-decoration: none;
    }

    .offcanvas .nav-link:hover {
      background: var(--fx-surface-hover);
      color: var(--fx-accent) !important;
      transform: translateX(4px);
    }

    .offcanvas .nav-link.btn-link {
      width: 100%;
      text-align: left;
      border: 0;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      padding-top: 70px;
    }

    .player-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== BACK BUTTON ===== */
    .btn-back {
      background: var(--fx-accent-dark) !important;
      border-color: var(--fx-accent-dark) !important;
      color: #fff !important;
      font-weight: 700;
      border-radius: 10px;
      box-shadow: 0 5px 18px rgba(239, 68, 68, 0.12);
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--fx-accent) !important;
      border-color: var(--fx-accent) !important;
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 7px 22px var(--fx-accent-glow);
    }

    /* ===== EVENT TITLE ===== */
    #eventTitle {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      color: var(--fx-text-main);
      background: var(--fx-glass);
      border: 1px solid var(--fx-glass-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ===== VIDEO PLAYER ===== */
    .video-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--fx-glass-border);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    #embedPlayer,
    #videoPlayerContainer {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* =========================================================
       FUTBOLX CUSTOM VIDEO PLAYER
       ========================================================= */

    #videoPlayer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
    }

    #videoPlayer video {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      background: #000;
    }

    .fx-player-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 1;
      transition: opacity .3s ease;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.38),
          transparent 22%,
          transparent 65%,
          rgba(0,0,0,.78)
        );
    }

    .fx-player-ui.hidden {
      opacity: 0;
    }

    .fx-player-ui > * {
      pointer-events: auto;
    }

    .fx-player-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .fx-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 7px;
      background: rgba(0,0,0,.58);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .fx-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 9px rgba(239,68,68,.9);
      animation: fxLivePulse 1.4s infinite;
    }

    @keyframes fxLivePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: .45;
        transform: scale(.72);
      }
    }

    .fx-center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239,68,68,.95);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 35px rgba(0,0,0,.5);
      transition: transform .2s ease, opacity .25s ease;
    }

    .fx-center-play:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .fx-center-play.hide {
      opacity: 0;
      pointer-events: none;
    }

    .fx-player-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 14px 14px;
    }

    .fx-control-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 9px;
      background: rgba(15,17,24,.78);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background .18s ease, transform .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      touch-action: manipulation;
    }

    .fx-control-btn:hover {
      background: rgba(239,68,68,.9);
      transform: translateY(-1px);
    }

    .fx-control-btn:active {
      transform: scale(.94);
    }

    .fx-controls-spacer {
      flex: 1;
    }

    .fx-player-label {
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 600;
      margin-left: 4px;
      margin-right: 5px;
      white-space: nowrap;
      text-shadow: 0 1px 3px #000;
    }

    .fx-volume-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .fx-volume-slider {
      width: 0;
      opacity: 0;
      pointer-events: none;
      transition: width .2s ease, opacity .2s ease;
      accent-color: var(--fx-accent);
      cursor: pointer;
    }

    .fx-volume-wrap:hover .fx-volume-slider,
    .fx-volume-slider:focus {
      width: 70px;
      opacity: 1;
      pointer-events: auto;
    }

    #fxAirplay {
      display: none;
    }

    #videoPlayerContainer.fx-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      padding: 0 !important;
      z-index: 99999 !important;
      background: #000 !important;
    }

    #videoPlayerContainer.fx-fullscreen #videoPlayer {
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       STREAM SELECTOR
       ========================================================= */

    .stream-dropdown {
      background: var(--fx-glass);
      border: 1px solid var(--fx-glass-border);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-stream {
      min-width: 180px;
      background: #0b1020 !important;
      color: #e7edf5 !important;
      border: 2px solid #167da5 !important;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      transition: border-color .18s ease, background .18s ease;
    }

    .btn-stream:hover,
    .btn-stream:focus {
      background: #0e1424 !important;
      border-color: #2297c2 !important;
      color: #fff !important;
      box-shadow: none;
    }

    .stream-dropdown .dropdown-menu {
      background: #202126 !important;
      border: 1px solid #3a3b40 !important;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    .stream-dropdown .dropdown-item {
      color: #f1f1f3 !important;
      border-radius: 8px;
      padding: 10px 12px;
      transition: background .15s ease;
    }

    .stream-dropdown .dropdown-item:hover,
    .stream-dropdown .dropdown-item:focus {
      background: #2b2c31 !important;
      color: #fff !important;
    }

    /* =========================================================
       FUTBOLX EPG
       ========================================================= */

    .fx-epg {
      width: 100%;
      margin-top: 18px;
      background: var(--fx-glass);
      border: 1px solid var(--fx-glass-border);
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,.18);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .fx-epg-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--fx-glass-border);
      background: rgba(255,255,255,.025);
    }

    .fx-epg-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .fx-epg-heading-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: rgba(239,68,68,.12);
      color: var(--fx-accent);
    }

    .fx-epg-title {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      letter-spacing: .5px;
      margin: 0;
      color: var(--fx-text-main);
    }

    .fx-epg-channel {
      color: var(--fx-text-muted);
      font-size: .78rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fx-epg-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--fx-text-muted);
      font-size: .72rem;
      white-space: nowrap;
    }

    .fx-epg-status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px rgba(34,197,94,.6);
    }

    .fx-epg-body {
      width: 100%;
      overflow: hidden;
    }

    .fx-epg-grid {
      width: 100%;
    }

    .fx-epg-time-row {
      display: grid;
      grid-template-columns: 105px repeat(8, minmax(0, 1fr));
      min-height: 40px;
      border-bottom: 1px solid var(--fx-glass-border);
      background: rgba(255,255,255,.025);
    }

    .fx-epg-date-heading {
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-right: 1px solid var(--fx-glass-border);
      color: var(--fx-text-muted);
      font-family: 'Kanit', sans-serif;
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .fx-epg-time {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      border-right: 1px solid var(--fx-glass-border);
      color: var(--fx-text-muted);
      font-size: .68rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .fx-epg-time:last-child {
      border-right: 0;
    }

    .fx-epg-day {
      position: relative;
      display: grid;
      grid-template-columns: 105px 1fr;
      min-height: 92px;
      border-bottom: 1px solid var(--fx-glass-border);
    }

    .fx-epg-day:last-child {
      border-bottom: 0;
    }

    .fx-epg-date {
      position: relative;
      z-index: 3;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 10px 12px;
      border-right: 1px solid var(--fx-glass-border);
      background: rgba(255,255,255,.018);
    }

    .fx-epg-date-name {
      font-family: 'Kanit', sans-serif;
      font-size: .76rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--fx-text-main);
    }

    .fx-epg-date-full {
      margin-top: 2px;
      color: var(--fx-text-muted);
      font-size: .68rem;
    }

    .fx-epg-timeline {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to right,
          transparent 0,
          transparent calc(12.5% - 1px),
          var(--fx-glass-border) calc(12.5% - 1px),
          var(--fx-glass-border) 12.5%
        );
    }

    .fx-epg-event {
      position: absolute;
      top: 9px;
      bottom: 9px;
      min-width: 8px;
      overflow: hidden;
      padding: 9px 10px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 9px;
      background: #151923;
      box-shadow: 0 5px 15px rgba(0,0,0,.18);
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
      cursor: default;
    }

    .fx-epg-event:hover {
      transform: translateY(-1px);
      border-color: rgba(239,68,68,.45);
      background: #1b1f2b;
      z-index: 6 !important;
    }

    .fx-epg-event.live {
      border-color: rgba(239,68,68,.65);
      background:
        linear-gradient(
          135deg,
          rgba(239,68,68,.18),
          rgba(21,25,35,.98) 55%
        );
      box-shadow:
        0 0 0 1px rgba(239,68,68,.08),
        0 7px 20px rgba(0,0,0,.25);
      z-index: 5;
    }

    .fx-epg-event-title {
      position: relative;
      z-index: 2;
      color: #f8fafc;
      font-size: .74rem;
      line-height: 1.25;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fx-epg-event-time {
      position: relative;
      z-index: 2;
      margin-top: 4px;
      color: var(--fx-text-muted);
      font-size: .62rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .fx-epg-live-label {
      position: relative;
      z-index: 2;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 3px;
      color: #f87171;
      font-family: 'Kanit', sans-serif;
      font-size: .57rem;
      font-weight: 700;
      letter-spacing: .7px;
    }

    .fx-epg-live-label i {
      font-size: .43rem;
    }

    .fx-epg-progress {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 3px;
      background: rgba(255,255,255,.08);
    }

    .fx-epg-progress-bar {
      height: 100%;
      width: 0;
      background: var(--fx-accent);
      box-shadow: 0 0 8px rgba(239,68,68,.55);
      transition: width 1s linear;
    }

    .fx-epg-now-line {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--fx-accent);
      box-shadow: 0 0 10px rgba(239,68,68,.65);
      z-index: 8;
      pointer-events: none;
    }

    .fx-epg-now-line::before {
      content: '';
      position: absolute;
      top: 0;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--fx-accent);
      transform: translateX(-50%);
      box-shadow: 0 0 10px rgba(239,68,68,.8);
    }

    .fx-epg-empty {
      padding: 32px 20px;
      text-align: center;
      color: var(--fx-text-muted);
    }

    .fx-epg-empty i {
      display: block;
      margin-bottom: 10px;
      font-size: 28px;
      opacity: .45;
    }

    .fx-epg-empty-title {
      color: var(--fx-text-main);
      font-family: 'Kanit', sans-serif;
      font-size: .95rem;
      font-weight: 600;
    }

    .fx-epg-empty-text {
      margin-top: 3px;
      font-size: .75rem;
    }

    .fx-epg-loading {
      padding: 30px 20px;
      text-align: center;
      color: var(--fx-text-muted);
      font-size: .8rem;
    }

    .fx-epg-loading i {
      margin-right: 7px;
      color: var(--fx-accent);
    }

    /* ===== ERROR ===== */
    .error-alert {
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
    }

    /* ===== FOOTER ===== */
    footer {
      border-top-color: var(--fx-glass-border) !important;
    }

    footer .nav-link {
      transition: color 0.2s ease;
    }

    footer .nav-link:hover {
      color: var(--fx-accent) !important;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 767.98px) {

      .main-content {
        padding-top: 65px;
      }

      .player-container {
        width: 100%;
      }

      #eventTitle {
        font-size: 1.5rem;
        padding: 12px 14px;
      }

      .stream-dropdown {
        padding: 8px;
      }

      .btn-stream {
        width: 100%;
        min-width: 0;
      }

      .fx-player-controls {
        padding: 8px 9px 10px;
        gap: 4px;
      }

      .fx-control-btn {
        width: 38px;
        height: 38px;
      }

      .fx-volume-slider {
        display: none;
      }

      .fx-player-label {
        display: none;
      }

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let videoPlayerInstance = null;
    let streamData = null;

    let fxVideo = null;
    let fxControlsTimer = null;

    let playerSession = 0;

    const MAX_RECOVERY_ATTEMPTS = 8;
    const RECOVERY_DELAY = 1500;

    /* =========================================================
       EPG SETTINGS
       ========================================================= */

    const EPG_ENDPOINT = '/api/epg';

    /*
     * Refresh the EPG data periodically.
     *
     * This does not mean the visitor has to refresh the page.
     * FutbolX will check for updated EPG information automatically.
     */
    const EPG_REFRESH_INTERVAL = 10 * 60 * 1000;

    /*
     * Refresh the currently visible clock/progress every second.
     */
    const EPG_CLOCK_INTERVAL = 1000;

    /*
     * Show the current day plus the next 3 days.
     */
    const EPG_DAYS_TO_SHOW = 4;

    /*
     * The guide uses 8 time columns.
     * Each column represents 3 hours.
     */
    const EPG_HOURS_PER_COLUMN = 3;

    let epgData = null;
    let epgRefreshTimer = null;
    let epgClockTimer = null;

    document.addEventListener('DOMContentLoaded', () => {

      const brandLogo = document.getElementById('brandLogo');
      const logoBall = document.getElementById('logoBall');

      if (brandLogo && logoBall) {

        brandLogo.addEventListener('click', () => {

          logoBall.classList.add('spinning');

          setTimeout(() => {
            logoBall.classList.remove('spinning');
          }, 600);

        });

      }

    });

    function initTheme() {

      const themeToggle =
        document.getElementById('themeToggle');

      const html =
        document.documentElement;

      const currentTheme =
        localStorage.getItem('theme') || 'dark';

      html.setAttribute(
        'data-bs-theme',
        currentTheme
      );

      themeToggle.onclick = () => {

        const next =
          html.getAttribute('data-bs-theme') === 'dark'
            ? 'light'
            : 'dark';

        html.setAttribute(
          'data-bs-theme',
          next
        );

        localStorage.setItem(
          'theme',
          next
        );

      };

    }

    function clearControlsTimer() {

      if (fxControlsTimer) {

        clearTimeout(
          fxControlsTimer
        );

        fxControlsTimer = null;

      }

    }

    function destroyMpegtsPlayer() {

      clearControlsTimer();

      if (videoPlayerInstance) {

        try {
          videoPlayerInstance.pause();
        } catch (e) {}

        try {
          videoPlayerInstance.unload();
        } catch (e) {}

        try {
          videoPlayerInstance.detachMediaElement();
        } catch (e) {}

        try {
          videoPlayerInstance.destroy();
        } catch (e) {}

        videoPlayerInstance = null;

      }

      fxVideo = null;

      const player =
        document.getElementById('videoPlayer');

      if (player) {
        player.innerHTML = '';
      }

    }

    function createPlayerUI(video, streamName) {

      const player =
        document.getElementById('videoPlayer');

      player.innerHTML = '';

      const ui =
        document.createElement('div');

      ui.className = 'fx-player-ui';

      ui.innerHTML = `

        <div class="fx-player-top">

          <div class="fx-live-badge">
            <span class="fx-live-dot"></span>
            LIVE
          </div>

        </div>

        <button
          type="button"
          class="fx-center-play"
          id="fxCenterPlay"
          aria-label="Play">

          <i class="fas fa-play"></i>

        </button>

        <div class="fx-player-controls">

          <button
            type="button"
            class="fx-control-btn"
            id="fxPlay"
            aria-label="Play/Pause">

            <i class="fas fa-play"></i>

          </button>

          <div class="fx-volume-wrap">

            <button
              type="button"
              class="fx-control-btn"
              id="fxMute"
              aria-label="Mute/Unmute">

              <i class="fas fa-volume-mute"></i>

            </button>

            <input
              type="range"
              class="fx-volume-slider"
              id="fxVolume"
              min="0"
              max="1"
              step="0.05"
              value="1"
              aria-label="Volume">

          </div>

          <span class="fx-player-label">
            ${escapeHtml(streamName || 'LIVE STREAM')}
          </span>

          <div class="fx-controls-spacer"></div>

          <button
            type="button"
            class="fx-control-btn"
            id="fxPip"
            aria-label="Picture in Picture"
            title="Picture in Picture">

            <i class="fas fa-clone"></i>

          </button>

          <button
            type="button"
            class="fx-control-btn"
            id="fxAirplay"
            aria-label="AirPlay"
            title="AirPlay">

            <i class="fab fa-apple"></i>

          </button>

          <button
            type="button"
            class="fx-control-btn"
            id="fxFullscreen"
            aria-label="Fullscreen"
            title="Fullscreen">

            <i class="fas fa-expand"></i>

          </button>

        </div>
      `;

      player.appendChild(video);
      player.appendChild(ui);

      const playButton =
        document.getElementById('fxPlay');

      const centerPlay =
        document.getElementById('fxCenterPlay');

      const muteButton =
        document.getElementById('fxMute');

      const volumeSlider =
        document.getElementById('fxVolume');

      const pipButton =
        document.getElementById('fxPip');

      const airplayButton =
        document.getElementById('fxAirplay');

      const fullscreenButton =
        document.getElementById('fxFullscreen');

      function togglePlay(event) {

        if (event) {
          event.stopPropagation();
        }

        if (video.paused) {

          video.play().catch(() => {});

        } else {

          video.pause();

        }

        showPlayerControls();

      }

      playButton.onclick = togglePlay;
      centerPlay.onclick = togglePlay;

      video.addEventListener('play', () => {

        playButton.innerHTML =
          '<i class="fas fa-pause"></i>';

        centerPlay.innerHTML =
          '<i class="fas fa-pause"></i>';

        centerPlay.classList.add('hide');

      });

      video.addEventListener('pause', () => {

        playButton.innerHTML =
          '<i class="fas fa-play"></i>';

        centerPlay.innerHTML =
          '<i class="fas fa-play"></i>';

        centerPlay.classList.remove('hide');

        showPlayerControls();

      });

      function updateMuteIcon() {

        if (
          video.muted ||
          video.volume === 0
        ) {

          muteButton.innerHTML =
            '<i class="fas fa-volume-mute"></i>';

        } else if (video.volume < 0.5) {

          muteButton.innerHTML =
            '<i class="fas fa-volume-down"></i>';

        } else {

          muteButton.innerHTML =
            '<i class="fas fa-volume-up"></i>';

        }

      }

      muteButton.onclick = (event) => {

        event.stopPropagation();

        video.muted = !video.muted;

        updateMuteIcon();

        showPlayerControls();

      };

      volumeSlider.oninput = (event) => {

        event.stopPropagation();

        video.volume =
          Number(volumeSlider.value);

        video.muted =
          video.volume === 0;

        updateMuteIcon();

        showPlayerControls();

      };

      if (
        document.pictureInPictureEnabled ||
        video.webkitSupportsPresentationMode
      ) {

        pipButton.style.display =
          'inline-flex';

      } else {

        pipButton.style.display =
          'none';

      }

      pipButton.onclick = async (event) => {

        event.stopPropagation();

        try {

          if (
            document.pictureInPictureElement
          ) {

            await document.exitPictureInPicture();

          } else if (
            document.pictureInPictureEnabled
          ) {

            await video.requestPictureInPicture();

          } else if (
            video.webkitSetPresentationMode
          ) {

            video.webkitSetPresentationMode(
              video.webkitPresentationMode ===
              'picture-in-picture'
                ? 'inline'
                : 'picture-in-picture'
            );

          }

        } catch (error) {

          console.error(
            'PiP error:',
            error
          );

        }

        showPlayerControls();

      };

      if (
        typeof video.webkitShowPlaybackTargetPicker ===
        'function'
      ) {

        airplayButton.style.display =
          'inline-flex';

        airplayButton.onclick = (event) => {

          event.stopPropagation();

          try {

            video.webkitShowPlaybackTargetPicker();

          } catch (error) {

            console.error(
              'AirPlay error:',
              error
            );

          }

          showPlayerControls();

        };

      }

      fullscreenButton.onclick = async (event) => {

        event.stopPropagation();

        const container =
          document.getElementById(
            'videoPlayerContainer'
          );

        try {

          if (
            document.fullscreenElement
          ) {

            await document.exitFullscreen();

          } else if (
            container.requestFullscreen
          ) {

            await container.requestFullscreen();

          } else {

            container.classList.toggle(
              'fx-fullscreen'
            );

          }

        } catch (error) {

          container.classList.toggle(
            'fx-fullscreen'
          );

        }

        showPlayerControls();

      };

      document.addEventListener(
        'fullscreenchange',
        () => {

          const icon =
            fullscreenButton.querySelector('i');

          if (!icon) return;

          if (document.fullscreenElement) {

            icon.className =
              'fas fa-compress';

          } else {

            icon.className =
              'fas fa-expand';

          }

        }
      );

      video.addEventListener(
        'dblclick',
        (event) => {

          event.preventDefault();

          fullscreenButton.click();

        }
      );

      function showPlayerControls() {

        ui.classList.remove('hidden');

        clearControlsTimer();

        if (!video.paused) {

          fxControlsTimer =
            setTimeout(() => {

              ui.classList.add('hidden');

            }, 4000);

        }

      }

      player.addEventListener(
        'mousemove',
        () => {

          showPlayerControls();

        }
      );

      player.addEventListener(
        'touchstart',
        () => {

          showPlayerControls();

        },
        {
          passive: true
        }
      );

      player.addEventListener(
        'click',
        (event) => {

          if (
            event.target.closest('.fx-control-btn') ||
            event.target.closest('.fx-center-play') ||
            event.target.closest('.fx-volume-slider')
          ) {

            showPlayerControls();
            return;

          }

          showPlayerControls();

        }
      );

      ui.addEventListener(
        'mouseenter',
        () => {

          clearControlsTimer();

        }
      );

      ui.addEventListener(
        'mouseleave',
        () => {

          if (!video.paused) {

            showPlayerControls();

          }

        }
      );

      ui.addEventListener(
        'touchstart',
        () => {

          showPlayerControls();

        },
        {
          passive: true
        }
      );

      video.muted = true;
      video.volume = 1;

      updateMuteIcon();

      fxVideo = video;

      showPlayerControls();

    }

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }

    function createMpegtsPlayer(
      url,
      event,
      index,
      sessionId,
      recoveryAttempt = 0
    ) {

      if (sessionId !== playerSession) {
        return;
      }

      const container =
        document.getElementById(
          'videoPlayerContainer'
        );

      const errorContainer =
        document.getElementById(
          'errorContainer'
        );

      const player =
        document.getElementById('videoPlayer');

      if (!player) {
        return;
      }

      if (videoPlayerInstance) {

        try {
          videoPlayerInstance.pause();
        } catch (e) {}

        try {
          videoPlayerInstance.unload();
        } catch (e) {}

        try {
          videoPlayerInstance.detachMediaElement();
        } catch (e) {}

        try {
          videoPlayerInstance.destroy();
        } catch (e) {}

        videoPlayerInstance = null;

      }

      fxVideo = null;

      clearControlsTimer();

      player.innerHTML = '';

      errorContainer.classList.add('d-none');
      errorContainer.innerText = '';

      const video =
        document.createElement('video');

      video.controls = false;
      video.autoplay = true;
      video.muted = true;
      video.playsInline = true;

      video.setAttribute(
        'playsinline',
        ''
      );

      video.setAttribute(
        'webkit-playsinline',
        ''
      );

      video.setAttribute(
        'preload',
        'auto'
      );

      video.style.width = '100%';
      video.style.height = '100%';
      video.style.objectFit = 'contain';
      video.style.background = '#000';

      createPlayerUI(
        video,
        event.streams[index].label ||
        event.name ||
        'LIVE STREAM'
      );

      if (
        typeof mpegts === 'undefined' ||
        !mpegts.isSupported()
      ) {

        errorContainer.innerText =
          'This browser does not support MPEG-TS playback.';

        errorContainer.classList.remove(
          'd-none'
        );

        return;

      }

      try {

        videoPlayerInstance =
          mpegts.createPlayer({

            type: 'mpegts',

            isLive: true,

            url: url,

            liveBufferLatencyChasing: true,

            liveBufferLatencyMaxLatency: 3,

            liveBufferLatencyMinRemain: 1

          });

        videoPlayerInstance.attachMediaElement(
          video
        );

        videoPlayerInstance.on(
          mpegts.Events.ERROR,
          function(type, detail, info) {

            console.error(
              'mpegts.js error:',
              type,
              detail,
              info
            );

            if (
              sessionId !== playerSession
            ) {

              return;

            }

            try {
              videoPlayerInstance.pause();
            } catch (e) {}

            try {
              videoPlayerInstance.unload();
            } catch (e) {}

            if (
              recoveryAttempt < MAX_RECOVERY_ATTEMPTS
            ) {

              console.log(
                `MPEG-TS recovery attempt ${
                  recoveryAttempt + 1
                }/${MAX_RECOVERY_ATTEMPTS}`
              );

              errorContainer.classList.add(
                'd-none'
              );

              clearControlsTimer();

              setTimeout(() => {

                if (
                  sessionId !== playerSession
                ) {

                  return;

                }

                createMpegtsPlayer(
                  url,
                  event,
                  index,
                  sessionId,
                  recoveryAttempt + 1
                );

              }, RECOVERY_DELAY);

            } else {

              errorContainer.innerText =
                'Unable to play this stream in the browser. The stream may be temporarily unavailable.';

              errorContainer.classList.remove(
                'd-none'
              );

            }

          }
        );

        video.addEventListener(
          'playing',
          () => {

            errorContainer.classList.add(
              'd-none'
            );

            errorContainer.innerText = '';

          }
        );

        video.addEventListener(
          'canplay',
          () => {

            errorContainer.classList.add(
              'd-none'
            );

          }
        );

        video.addEventListener(
          'error',
          () => {

            console.warn(
              'HTML5 video element reported an error.'
            );

          }
        );

        videoPlayerInstance.load();

        videoPlayerInstance.play()
          .catch((error) => {

            console.warn(
              'Initial MPEG-TS play attempt:',
              error
            );

          });

      } catch (error) {

        console.error(
          'Failed to create MPEG-TS player:',
          error
        );

        if (
          recoveryAttempt < MAX_RECOVERY_ATTEMPTS
        ) {

          setTimeout(() => {

            if (
              sessionId !== playerSession
            ) {

              return;

            }

            createMpegtsPlayer(
              url,
              event,
              index,
              sessionId,
              recoveryAttempt + 1
            );

          }, RECOVERY_DELAY);

        } else {

          errorContainer.innerText =
            'Unable to play this stream in the browser.';

          errorContainer.classList.remove(
            'd-none'
          );

        }

      }

    }

    async function initPlayer(event, index) {

      playerSession++;

      const currentSession =
        playerSession;

      const url =
        event.streams[index].url;

      const embed =
        document.getElementById('embedPlayer');

      const container =
        document.getElementById(
          'videoPlayerContainer'
        );

      const errorContainer =
        document.getElementById(
          'errorContainer'
        );

      errorContainer.classList.add('d-none');
      errorContainer.innerText = '';

      clearControlsTimer();

      destroyMpegtsPlayer();

      embed.src = 'about:blank';

      if (
        url.toLowerCase().includes('.ts')
      ) {

        embed.style.display = 'none';
        container.style.display = 'block';

        createMpegtsPlayer(
          url,
          event,
          index,
          currentSession,
          0
        );

        return;

      }

      container.style.display = 'none';
      embed.style.display = 'block';

      embed.src =
        url +
        (url.includes('?') ? '&' : '?') +
        'autoplay=1';

    }

    /* =========================================================
       EPG FUNCTIONS
       ========================================================= */

    function normalizeChannelName(name) {

      return String(name || '')
        .toLowerCase()
        .replace(/&/g, 'and')
        .replace(/[^a-z0-9]+/g, '')
        .trim();

    }

    function parseXmltvDate(value) {

      if (!value) {
        return null;
      }

      const text =
        String(value).trim();

      /*
       * XMLTV format:
       *
       * 20260906010000 +0000
       * 20260906010000 +0300
       * 20260906010000
       */

      const match =
        text.match(
          /^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})(?:\s*([+-]\d{2})(\d{2}))?/
        );

      if (!match) {

        const fallback =
          new Date(text);

        return isNaN(
          fallback.getTime()
        )
          ? null
          : fallback;

      }

      const year = Number(match[1]);
      const month = Number(match[2]) - 1;
      const day = Number(match[3]);
      const hour = Number(match[4]);
      const minute = Number(match[5]);
      const second = Number(match[6]);

      if (match[7]) {

        const offsetHours =
          Number(match[7]);

        const offsetMinutes =
          Number(match[8]);

        const sign =
          match[7].startsWith('-')
            ? -1
            : 1;

        const utc =
          Date.UTC(
            year,
            month,
            day,
            hour,
            minute,
            second
          );

        const offset =
          sign *
          (
            Math.abs(offsetHours) * 60 +
            offsetMinutes
          );

        return new Date(
          utc - offset * 60000
        );

      }

      /*
       * XMLTV feeds without a timezone are treated
       * as UTC, which is the safest assumption.
       */

      return new Date(
        Date.UTC(
          year,
          month,
          day,
          hour,
          minute,
          second
        )
      );

    }

    function decodeXmlEntities(value) {

      if (!value) {
        return '';
      }

      const textarea =
        document.createElement('textarea');

      textarea.innerHTML =
        value;

      return textarea.value;

    }

    function parseEPGXml(xmlText) {

      const parser =
        new DOMParser();

      const xml =
        parser.parseFromString(
          xmlText,
          'application/xml'
        );

      const parserError =
        xml.querySelector('parsererror');

      if (parserError) {

        throw new Error(
          'Invalid EPG XML'
        );

      }

      const channels =
        Array.from(
          xml.querySelectorAll('channel')
        );

      const channelMap = {};

      channels.forEach(channel => {

        const id =
          channel.getAttribute('id');

        if (!id) {
          return;
        }

        const names =
          Array.from(
            channel.querySelectorAll('display-name')
          )
          .map(el =>
            el.textContent.trim()
          )
          .filter(Boolean);

        channelMap[id] = {
          id,
          name: names[0] || id,
          aliases: names,
          normalized: names.map(
            normalizeChannelName
          )
        };

      });

      const programmes =
        Array.from(
          xml.querySelectorAll('programme')
        )
        .map(programme => {

          const channel =
            programme.getAttribute(
              'channel'
            );

          const start =
            parseXmltvDate(
              programme.getAttribute(
                'start'
              )
            );

          const stop =
            parseXmltvDate(
              programme.getAttribute(
                'stop'
              )
            );

          const titleElement =
            programme.querySelector(
              'title'
            );

          const descElement =
            programme.querySelector(
              'desc'
            );

          if (
            !channel ||
            !start ||
            !stop ||
            !titleElement
          ) {

            return null;

          }

          return {

            channel,

            title:
              decodeXmlEntities(
                titleElement.textContent.trim()
              ),

            description:
              descElement
                ? decodeXmlEntities(
                    descElement.textContent.trim()
                  )
                : '',

            start,

            stop

          };

        })
        .filter(Boolean);

      return {
        channels: channelMap,
        programmes
      };

    }

    function parseEPGJson(data) {

      /*
       * Supports our parsed API format.
       */

      if (
        data &&
        Array.isArray(data.programmes)
      ) {

        const channels =
          data.channels || {};

        return {
          channels,
          programmes:
            data.programmes.map(p => ({
              ...p,
              start:
                parseXmltvDate(p.start),
              stop:
                parseXmltvDate(p.stop)
            }))
            .filter(p =>
              p.start &&
              p.stop
            )
        };

      }

      /*
       * Also support a possible array format.
       */

      if (Array.isArray(data)) {

        return {
          channels: {},
          programmes: data
            .map(p => ({
              ...p,
              start:
                parseXmltvDate(p.start),
              stop:
                parseXmltvDate(p.stop)
            }))
            .filter(p =>
              p.start &&
              p.stop
            )
        };

      }

      throw new Error(
        'Unsupported EPG JSON format'
      );

    }

    async function fetchEPG() {

      const response =
        await fetch(
          EPG_ENDPOINT,
          {
            method: 'GET',
            cache: 'no-store',
            headers: {
              'Accept':
                'application/json, application/xml, text/xml, */*'
            }
          }
        );

      if (!response.ok) {

        throw new Error(
          `EPG request failed: HTTP ${response.status}`
        );

      }

      const contentType =
        (
          response.headers.get(
            'content-type'
          ) || ''
        ).toLowerCase();

      const text =
        await response.text();

      /*
       * JSON response
       */

      if (
        contentType.includes(
          'application/json'
        ) ||
        text.trim().startsWith('{') ||
        text.trim().startsWith('[')
      ) {

        try {

          const json =
            JSON.parse(text);

          return parseEPGJson(json);

        } catch (error) {

          /*
           * If JSON parsing fails, continue and
           * attempt XML parsing.
           */

        }

      }

      /*
       * XML response
       */

      return parseEPGXml(text);

    }

    function findEPGChannel(channelName) {

      if (
        !epgData ||
        !epgData.channels
      ) {

        return null;

      }

      const wanted =
        normalizeChannelName(
          channelName
        );

      if (!wanted) {
        return null;
      }

      /*
       * Exact normalized match.
       */

      for (
        const id in epgData.channels
      ) {

        const channel =
          epgData.channels[id];

        const names =
          channel.aliases ||
          [channel.name];

        for (
          const name of names
        ) {

          if (
            normalizeChannelName(name) ===
            wanted
          ) {

            return channel;

          }

        }

      }

      /*
       * Second pass:
       * allow names such as "USA Network HD"
       * to match "USA Network".
       */

      for (
        const id in epgData.channels
      ) {

        const channel =
          epgData.channels[id];

        const names =
          channel.aliases ||
          [channel.name];

        for (
          const name of names
        ) {

          const normalized =
            normalizeChannelName(name);

          if (
            normalized.includes(wanted) ||
            wanted.includes(normalized)
          ) {

            if (
              normalized.length >= 5
            ) {

              return channel;

            }

          }

        }

      }

      return null;

    }

    function getChannelProgrammes(channel) {

      if (
        !epgData ||
        !epgData.programmes ||
        !channel
      ) {

        return [];

      }

      const ids =
        new Set([
          channel.id
        ]);

      return epgData.programmes
        .filter(programme =>
          ids.has(
            programme.channel
          )
        )
        .sort(
          (a, b) =>
            a.start.getTime() -
            b.start.getTime()
        );

    }

    function getUserTimeZone() {

      try {

        return Intl.DateTimeFormat()
          .resolvedOptions()
          .timeZone || 'UTC';

      } catch (error) {

        return 'UTC';

      }

    }

    function formatTime(date) {

      return new Intl.DateTimeFormat(
        undefined,
        {
          hour: '2-digit',
          minute: '2-digit',
          hour12: false,
          timeZone: getUserTimeZone()
        }
      ).format(date);

    }

    function formatDate(date) {

      return new Intl.DateTimeFormat(
        undefined,
        {
          weekday: 'short',
          month: 'short',
          day: 'numeric',
          timeZone: getUserTimeZone()
        }
      ).format(date);

    }

    function dateKey(date) {

      const parts =
        new Intl.DateTimeFormat(
          'en-CA',
          {
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            timeZone: getUserTimeZone()
          }
        ).formatToParts(date);

      const result = {};

      parts.forEach(part => {
        result[part.type] = part.value;
      });

      return `${result.year}-${result.month}-${result.day}`;

    }

    function getLocalDateParts(date) {

      const formatter =
        new Intl.DateTimeFormat(
          'en-US',
          {
            year: 'numeric',
            month: 'numeric',
            day: 'numeric',
            hour: 'numeric',
            minute: 'numeric',
            second: 'numeric',
            hourCycle: 'h23',
            timeZone: getUserTimeZone()
          }
        );

      const parts =
        formatter.formatToParts(date);

      const result = {};

      parts.forEach(part => {

        if (
          part.type !== 'literal'
        ) {

          result[part.type] =
            Number(part.value);

        }

      });

      return result;

    }

    function getStartOfLocalDay(date) {

      const p =
        getLocalDateParts(date);

      /*
       * Convert local calendar date midnight
       * back into a Date object representing that
       * local midnight in the visitor's timezone.
       *
       * We calculate the timezone offset by comparing
       * the formatted local parts with UTC.
       */

      const guess =
        new Date(
          Date.UTC(
            p.year,
            p.month - 1,
            p.day,
            0,
            0,
            0
          )
        );

      const localParts =
        getLocalDateParts(guess);

      const desired =
        Date.UTC(
          p.year,
          p.month - 1,
          p.day,
          0,
          0,
          0
        );

      const actual =
        Date.UTC(
          localParts.year,
          localParts.month - 1,
          localParts.day,
          localParts.hour,
          localParts.minute,
          localParts.second
        );

      return new Date(
        guess.getTime() +
        (desired - actual)
      );

    }

    function addLocalDays(date, days) {

      const p =
        getLocalDateParts(date);

      const target =
        new Date(
          Date.UTC(
            p.year,
            p.month - 1,
            p.day + days,
            p.hour,
            p.minute,
            p.second
          )
        );

      /*
       * Re-resolve the timezone for the target date.
       * This also handles daylight-saving transitions.
       */

      const targetParts =
        getLocalDateParts(target);

      const desired =
        Date.UTC(
          targetParts.year,
          targetParts.month - 1,
          targetParts.day,
          p.hour,
          p.minute,
          p.second
        );

      const actual =
        Date.UTC(
          targetParts.year,
          targetParts.month - 1,
          targetParts.day,
          targetParts.hour,
          targetParts.minute,
          targetParts.second
        );

      return new Date(
        target.getTime() +
        (desired - actual)
      );

    }

    function getDayLabel(dayIndex) {

      if (dayIndex === 0) {
        return 'Today';
      }

      if (dayIndex === 1) {
        return 'Tomorrow';
      }

      return formatDate(
        addLocalDays(
          new Date(),
          dayIndex
        )
      );

    }

    function formatDuration(ms) {

      const totalMinutes =
        Math.max(
          0,
          Math.floor(
            ms / 60000
          )
        );

      if (
        totalMinutes < 60
      ) {

        return `${totalMinutes}m`;

      }

      const hours =
        Math.floor(
          totalMinutes / 60
        );

      const minutes =
        totalMinutes % 60;

      return minutes
        ? `${hours}h ${minutes}m`
        : `${hours}h`;

    }

    function renderNoEPG(channelName) {

      const body =
        document.getElementById(
          'epgBody'
        );

      const channel =
        document.getElementById(
          'epgChannelName'
        );

      channel.textContent =
        channelName || 'Current channel';

      body.innerHTML = `

        <div class="fx-epg-empty">

          <i class="fas fa-calendar-xmark"></i>

          <div class="fx-epg-empty-title">
            No EPG for this channel
          </div>

          <div class="fx-epg-empty-text">
            No matching TV schedule was found for this channel.
          </div>

        </div>

      `;

    }

    function renderEPG() {

      const body =
        document.getElementById(
          'epgBody'
        );

      if (
        !streamData ||
        !streamData.name
      ) {

        return;

      }

      const channel =
        findEPGChannel(
          streamData.name
        );

      const channelName =
        document.getElementById(
          'epgChannelName'
        );

      if (!channel) {

        renderNoEPG(
          streamData.name
        );

        return;

      }

      channelName.textContent =
        channel.name ||
        streamData.name;

      const programmes =
        getChannelProgrammes(
          channel
        );

      if (!programmes.length) {

        renderNoEPG(
          streamData.name
        );

        return;

      }

      const now =
        new Date();

      /*
       * Find current programme and programmes
       * from now through the next few days.
       */

      const visibleStart =
        getStartOfLocalDay(now);

      const visibleEnd =
        addLocalDays(
          visibleStart,
          EPG_DAYS_TO_SHOW
        );

      const visiblePrograms =
        programmes.filter(programme =>
          programme.stop > visibleStart &&
          programme.start < visibleEnd
        );

      if (!visiblePrograms.length) {

        renderNoEPG(
          streamData.name
        );

        return;

      }

      /*
       * Build the guide.
       */

      let html = '';

      /*
       * Timeline header.
       * 8 columns × 3 hours = 24 hours.
       */

      html += `
        <div class="fx-epg-grid">

          <div class="fx-epg-time-row">

            <div class="fx-epg-date-heading">
              DATE
            </div>
      `;

      for (
        let hour = 0;
        hour < 24;
        hour += EPG_HOURS_PER_COLUMN
      ) {

        html += `
          <div class="fx-epg-time">
            ${String(hour).padStart(2, '0')}:00
          </div>
        `;

      }

      html += `
          </div>
      `;

      /*
       * Each date gets its own row.
       */

      for (
        let dayIndex = 0;
        dayIndex < EPG_DAYS_TO_SHOW;
        dayIndex++
      ) {

        const dayStart =
          addLocalDays(
            visibleStart,
            dayIndex
          );

        const dayEnd =
          addLocalDays(
            visibleStart,
            dayIndex + 1
          );

        const dayKeyValue =
          dateKey(dayStart);

        const dayPrograms =
          visiblePrograms.filter(programme =>
            programme.stop > dayStart &&
            programme.start < dayEnd
          );

        html += `

          <div class="fx-epg-day"
               data-day="${dayKeyValue}">

            <div class="fx-epg-date">

              <div class="fx-epg-date-name">
                ${escapeHtml(
                  getDayLabel(dayIndex)
                )}
              </div>

              <div class="fx-epg-date-full">
                ${escapeHtml(
                  formatDate(dayStart)
                )}
              </div>

            </div>

            <div class="fx-epg-timeline"
                 data-timeline="${dayKeyValue}">
        `;

        /*
         * Current time line.
         */

        if (
          now >= dayStart &&
          now < dayEnd
        ) {

          const dayProgress =
            (
              now.getTime() -
              dayStart.getTime()
            ) /
            (
              dayEnd.getTime() -
              dayStart.getTime()
            );

          const percent =
            Math.max(
              0,
              Math.min(
                100,
                dayProgress * 100
              )
            );

          html += `
            <div
              class="fx-epg-now-line"
              data-now-line="${dayKeyValue}"
              style="left:${percent}%">
            </div>
          `;

        }

        /*
         * Programmes.
         */

        dayPrograms.forEach(programme => {

          const start =
            programme.start < dayStart
              ? dayStart
              : programme.start;

          const stop =
            programme.stop > dayEnd
              ? dayEnd
              : programme.stop;

          const total =
            dayEnd.getTime() -
            dayStart.getTime();

          const left =
            (
              (
                start.getTime() -
                dayStart.getTime()
              ) /
              total
            ) * 100;

          const width =
            (
              (
                stop.getTime() -
                start.getTime()
              ) /
              total
            ) * 100;

          const actualDuration =
            programme.stop.getTime() -
            programme.start.getTime();

          const isLive =
            programme.start <= now &&
            programme.stop > now;

          let progress =
            0;

          if (isLive) {

            progress =
              (
                (
                  now.getTime() -
                  programme.start.getTime()
                ) /
                actualDuration
              ) * 100;

          }

          const safeLeft =
            Math.max(
              0,
              Math.min(
                100,
                left
              )
            );

          const safeWidth =
            Math.max(
              1,
              Math.min(
                100 - safeLeft,
                width
              )
            );

          html += `

            <div
              class="fx-epg-event ${isLive ? 'live' : ''}"
              style="
                left:${safeLeft}%;
                width:${safeWidth}%;
              "
              title="${escapeHtml(
                programme.title
              )}"
            >

              ${
                isLive
                  ? `
                    <div class="fx-epg-live-label">
                      <i class="fas fa-circle"></i>
                      LIVE NOW
                    </div>
                  `
                  : ''
              }

              <div class="fx-epg-event-title">
                ${escapeHtml(
                  programme.title
                )}
              </div>

              <div class="fx-epg-event-time">
                ${escapeHtml(
                  formatTime(
                    programme.start
                  )
                )}
                –
                ${escapeHtml(
                  formatTime(
                    programme.stop
                  )
                )}
              </div>

              ${
                isLive
                  ? `
                    <div class="fx-epg-progress">
                      <div
                        class="fx-epg-progress-bar"
                        data-progress-start="${programme.start.getTime()}"
                        data-progress-stop="${programme.stop.getTime()}"
                        style="width:${Math.max(
                          0,
                          Math.min(
                            100,
                            progress
                          )
                        )}%">
                      </div>
                    </div>
                  `
                  : ''
              }

            </div>

          `;

        });

        html += `
            </div>
          </div>
        `;

      }

      html += `
        </div>
      `;

      body.innerHTML =
        html;

      updateEPGLiveState();

    }

    function updateEPGLiveState() {

      if (!epgData || !streamData) {
        return;
      }

      const now =
        Date.now();

      /*
       * Update every live progress bar.
       */

      document
        .querySelectorAll(
          '.fx-epg-progress-bar'
        )
        .forEach(bar => {

          const start =
            Number(
              bar.dataset.progressStart
            );

          const stop =
            Number(
              bar.dataset.progressStop
            );

          if (
            now >= start &&
            now < stop
          ) {

            const progress =
              (
                (
                  now - start
                ) /
                (
                  stop - start
                )
              ) * 100;

            bar.style.width =
              `${Math.max(
                0,
                Math.min(
                  100,
                  progress
                )
              )}%`;

          }

        });

      /*
       * Move current-time indicators.
       */

      document
        .querySelectorAll(
          '[data-now-line]'
        )
        .forEach(line => {

          const dayKeyValue =
            line.dataset.nowLine;

          const todayKey =
            dateKey(
              new Date()
            );

          if (
            dayKeyValue !==
            todayKey
          ) {

            line.style.display =
              'none';

            return;

          }

          const todayStart =
            getStartOfLocalDay(
              new Date()
            );

          const tomorrow =
            addLocalDays(
              todayStart,
              1
            );

          const percentage =
            (
              (
                Date.now() -
                todayStart.getTime()
              ) /
              (
                tomorrow.getTime() -
                todayStart.getTime()
              )
            ) * 100;

          line.style.display =
            'block';

          line.style.left =
            `${Math.max(
              0,
              Math.min(
                100,
                percentage
              )
            )}%`;

        });

      /*
       * If a programme has just ended, rebuild the guide.
       * This makes LIVE NOW automatically move to the next event.
       */

      const currentLive =
        epgData.programmes.find(
          programme =>
            programme.start.getTime() <= now &&
            programme.stop.getTime() > now &&
            findEPGChannel(streamData.name) &&
            programme.channel ===
            findEPGChannel(streamData.name).id
        );

      const currentLiveId =
        currentLive
          ? `${currentLive.channel}_${currentLive.start.getTime()}`
          : '';

      if (
        window.fxCurrentLiveId &&
        window.fxCurrentLiveId !== currentLiveId
      ) {

        renderEPG();

      }

      window.fxCurrentLiveId =
        currentLiveId;

    }

    async function loadEPG() {

      if (!streamData) {
        return;
      }

      const status =
        document.getElementById(
          'epgStatusText'
        );

      try {

        status.textContent =
          'Updating automatically';

        epgData =
          await fetchEPG();

        renderEPG();

        status.textContent =
          'Guide updated';

        /*
         * Return to automatic status after a few seconds.
         */

        setTimeout(() => {

          if (status) {

            status.textContent =
              'Updating automatically';

          }

        }, 4000);

      } catch (error) {

        console.error(
          'EPG loading error:',
          error
        );

        const body =
          document.getElementById(
            'epgBody'
          );

        body.innerHTML = `

          <div class="fx-epg-empty">

            <i class="fas fa-triangle-exclamation"></i>

            <div class="fx-epg-empty-title">
              Unable to load TV guide
            </div>

            <div class="fx-epg-empty-text">
              The EPG source is temporarily unavailable.
            </div>

          </div>

        `;

        status.textContent =
          'EPG unavailable';

      }

    }

    function startEPGUpdates() {

      if (epgRefreshTimer) {

        clearInterval(
          epgRefreshTimer
        );

      }

      if (epgClockTimer) {

        clearInterval(
          epgClockTimer
        );

      }

      /*
       * Fetch the EPG again periodically.
       */

      epgRefreshTimer =
        setInterval(
          () => {

            loadEPG();

          },
          EPG_REFRESH_INTERVAL
        );

      /*
       * Update live progress every second.
       */

      epgClockTimer =
        setInterval(
          () => {

            updateEPGLiveState();

          },
          EPG_CLOCK_INTERVAL
        );

    }

    function initEPG() {

      /*
       * Wait until the channel has been loaded.
       */

      if (!streamData) {
        return;
      }

      loadEPG();

      startEPGUpdates();

    }

    /* =========================================================
       PAGE INIT
       ========================================================= */

    function initPage() {

      const uriName =
        window.location.pathname.split('/').pop();

      fetch('/api/stream-24-7')
        .then(r => r.json())
        .then(data => {

          const all = [];

          Object.keys(data.streams)
            .forEach(cat =>
              all.push(...data.streams[cat])
            );

          const event =
            all.find(
              s => s.uri_name === uriName
            );

          if (event) {

            document.getElementById('eventTitle')
              .innerText = event.name;

            streamData = event;

            const menu =
              document.getElementById(
                'streamDropdownMenu'
              );

            menu.innerHTML =
              event.streams.map((s, i) =>
                `<li>
                  <a class="dropdown-item"
                     href="#"
                     onclick="initPlayer(streamData, ${i}); document.getElementById('streamDropdown').innerText='${escapeHtml(s.label || 'Stream ' + (i + 1))}'; return false;">
                    ${escapeHtml(s.label || 'Stream ' + (i + 1))}
                  </a>
                </li>`
              ).join('');

            initPlayer(event, 0);

            /*
             * Start EPG after the channel is known.
             */

            initEPG();

          }

        })
        .catch(error => {

          console.error(
            'Failed to load 24/7 stream data:',
            error
          );

          const errorContainer =
            document.getElementById(
              'errorContainer'
            );

          errorContainer.innerText =
            'Unable to load stream information.';

          errorContainer.classList.remove(
            'd-none'
          );

        });

    }

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        initTheme();
        initPage();

      }
    );

  </script>

</body>
  </html>
