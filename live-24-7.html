<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <meta name="description" content="FutbolX - Watch 24/7 cartoons and other content.">
  <meta name="keywords" content="futbolx, cartoons, 24/7, stream, online, free">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <style>
    .top-bar .container-fluid {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
    }

    .futbolx-brand {
      font-family: 'Kanit', sans-serif;
      font-weight: 900;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      user-select: none;
      text-decoration: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
    }

    .futbolx-brand .ball-o {
      color: #ffc107;
      font-size: 1.15rem;
      margin: 0 1px;
      text-shadow: 0 0 10px rgba(255, 193, 7, 0.4);
      transition: transform 0.5s ease;
      display: inline-block;
    }

    .futbolx-brand:hover .ball-o {
      transform: rotate(180deg);
    }

    .futbolx-brand .ball-o.spinning {
      animation: ballSpin 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes ballSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .player-container { max-width: 1200px; margin: 0 auto; }
    .error-alert { max-width: 500px; margin: 20px auto; }
  </style>
</head>
<body>

  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>

      <a href="/" class="futbolx-brand" id="brandLogo">
        FUTB<i class="fas fa-futbol ball-o" id="logoBall"></i>L-X
      </a>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link"><i class="fas fa-moon"></i></button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <div class="d-flex align-items-center justify-content-between mb-3">
            <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7 Streams</a>
          </div>

          <h2 id="eventTitle" class="mb-3"></h2>
          
          <div class="player-container">
            <div class="video-container">
              <iframe id="embedPlayer" src="about:blank" frameborder="0" style="width: 100%; height: 100%;" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="no-referrer"></iframe>
              <div id="videoPlayerContainer" style="width: 100%; height: 100%;">
                <div id="videoPlayer"></div>
              </div>
            </div>
            
            <div class="stream-dropdown d-flex align-items-center justify-content-between mt-3">
              <div class="dropdown">
                <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">
                  Select Stream
                </button>
                <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
              </div>
            </div>
          </div>

          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>

      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
        <ul class="nav">
          <li class="nav-item"><a href="https://discord.gg/CmRcPbBB2k" class="nav-link px-2 text-body-secondary">Discord</a></li>
        </ul>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let videoPlayerInstance = null;
    let streamData = null;

    document.addEventListener('DOMContentLoaded', () => {
      const brandLogo = document.getElementById('brandLogo');
      const logoBall = document.getElementById('logoBall');
      
      if (brandLogo && logoBall) {
        brandLogo.addEventListener('click', () => {
          logoBall.classList.add('spinning');
          setTimeout(() => {
            logoBall.classList.remove('spinning');
          }, 600);
        });
      }
    });

    function initTheme() {
      const themeToggle = document.getElementById('themeToggle');
      const html = document.documentElement;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      html.setAttribute('data-bs-theme', currentTheme);
      themeToggle.onclick = () => {
        const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
      };
    }

    async function initPlayer(event, index) {
      const url = event.streams[index].url;
      const embed = document.getElementById('embedPlayer');
      const container = document.getElementById('videoPlayerContainer');
      if (url.includes('.m3u8')) {
        embed.style.display = 'none';
        container.style.display = 'block';
        videoPlayerInstance = jwplayer('videoPlayer').setup({ file: url, autostart: true, mute: true, width: '100%', aspectratio: '16:9' });
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
      }
    }

    function initPage() {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        const all = [];
        Object.keys(data.streams).forEach(cat => all.push(...data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          const menu = document.getElementById('streamDropdownMenu');
          menu.innerHTML = event.streams.map((s, i) => `<li><a class="dropdown-item" href="#" onclick="initPlayer(streamData, ${i}); document.getElementById('streamDropdown').innerText='${s.label || 'Stream '+(i+1)}'; return false;">${s.label || 'Stream '+(i+1)}</a></li>`).join('');
          initPlayer(event, 0);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initPage();
    });
  </script>
</body>
</html>
