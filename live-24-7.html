    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {

    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      let seconds = 10;
      if (!tipContainer || !tipAlert || !countdownTimer) {
        console.warn('Tip container or elements not found');
        return;
      }
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;
      const interval = setInterval(() => {
        seconds--;
        countdownTimer.textContent = `${seconds}s`;
        if (seconds <= 0) {
          clearInterval(interval);
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
      setTimeout(() => {
        tipContainer.style.height = '0';
        tipAlert.style.display = 'none';
        clearInterval(interval);
      }, 10500);
    }
    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      const themeToggle = document.getElementById('themeToggle');
      const logoutButton = document.getElementById('logoutButton');
      if (!offcanvasElement || !toggler || !themeToggle) {

      console.log('Initializing offcanvas at', new Date().toISOString());
      if (typeof bootstrap === 'undefined') {
        console.error('Bootstrap not loaded. Ensure Bootstrap JS is included.');
        return;
      }
      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement, {
          backdrop: true,
          keyboard: true,
          scroll: false
        });
        offcanvasElement.addEventListener('shown.bs.offcanvas', () => {
          console.log('Offcanvas shown at', new Date().toISOString());
        });
        offcanvasElement.addEventListener('hidden.bs.offcanvas', () => {
          console.log('Offcanvas hidden at', new Date().toISOString());
        });
        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {

            const href = link.getAttribute('href');

              console.log('Nav link clicked:', href, 'at', new Date().toISOString());
              window.location.href = href;

        if (logoutButton) {

            offcanvas.hide();
            if (typeof logout === 'function') {
              logout();

          });

        if (themeToggle) {
          const htmlElement = document.documentElement;
          const currentTheme = localStorage.getItem('theme') || 'dark';

          console.log('Theme toggle initialized to:', currentTheme, 'at', new Date().toISOString());
          themeToggle.addEventListener('click', () => {
            try {
              const currentTheme = htmlElement.getAttribute('data-bs-theme');
              const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
              htmlElement.setAttribute('data-bs-theme', newTheme);
              localStorage.setItem('theme', newTheme);
              themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
              console.log('Theme toggled to:', newTheme, 'at', new Date().toISOString());

    function recreateVideoElement(isM3U8) {
      const videoContainer = document.getElementById('videoPlayerContainer');
      videoContainer.innerHTML = '';
      const videoElement = document.createElement(isM3U8 ? 'div' : 'video');
      videoElement.id = 'videoPlayer';
      videoElement.className = isM3U8 ? 'jwplayer d-none' : 'shaka-player-container d-none';
      if (!isM3U8) {
        videoElement.setAttribute('autoplay', '');
        videoElement.setAttribute('poster', '');
      }
      videoContainer.appendChild(videoElement);
      return videoElement;
    }
    function initPlayer(event, errorContainer) {
      console.log('initPlayer called with event:', event);
      try {
        clearError();
        embedPlayer = document.getElementById('embedPlayer');
        const videoContainer = document.getElementById('videoPlayerContainer');
        let streamUrl, drmKey;
        const stream = event.streams[0];
        if (typeof stream === 'string') {
          streamUrl = stream;
        } else if (typeof stream === 'object' && stream.url) {
          streamUrl = stream.url;
4
          drmKey = stream.drm_key;
        } else {
          throw new Error('Invalid stream format');
        }
        if (!streamUrl || !/^https?:/.test(streamUrl)) {
          throw new Error('Invalid or missing stream URL');
        }
        console.log('Stream URL:', streamUrl, 'DRM Key:', drmKey);
        const isM3U8 = streamUrl.toLowerCase().endsWith('.m3u8');
        const isMPD = streamUrl.toLowerCase().endsWith('.mpd');
        if (isM3U8 || isMPD) {
          embedPlayer.style.display = 'none';
          let videoPlayer = document.getElementById('videoPlayer');
          if (!videoPlayer) {
            videoPlayer = recreateVideoElement(isM3U8);
          }
          videoPlayer.classList.remove('d-none');
          videoContainer.style.display = 'block';
          if (isM3U8) {
            if (typeof jwplayer === 'undefined') {
              console.error('JW Player not loaded');
              throw new Error('JW Player library not loaded');
            }
            videoPlayerInstance = jwplayer('videoPlayer').setup({
              file: streamUrl,
              autostart: true,
              width: '100%',
              aspectratio: '16:9',
              controls: true,
              displaytitle: false,
              pipIcon: 'enabled',
              captions: {
                color: '#ffffff',
                backgroundOpacity: 50
              }
            });
            videoPlayerInstance.on('ready', () => {
              console.log('JW Player ready for HLS');
              clearError();
            });
            videoPlayerInstance.on('error', (e) => {
              console.error('JW Player error:', e);
              let errorMessage = 'Failed to load M3U8 stream: ';
              if (e.code === 232011 || e.code === 232001) {
                errorMessage += `Failed to load playlist (Code: ${e.code}). The stream may be down or blocked.`;
              } else if (e.code === 230001) {
                errorMessage += `Network error loading stream (Code: ${e.code}). Check your connection or stream URL.`;
              } else {
                errorMessage += e.message || 'Unknown error';
              }
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = errorMessage;
              console.log('JW Player error details:', {
                code: e.code,
                message: e.message,
                sourceError: e.sourceError
              });
            });
          } else if (isMPD && window.shaka) {
            videoPlayer = recreateVideoElement(false);
            videoPlayer.classList.remove('d-none');
            shaka.polyfill.installAll();
            if (!shaka.Player.isBrowserSupported()) {
              console.warn('Shaka Player not supported in this browser');
              errorContainer.className = 'alert alert-warning error-alert mt-3';
              errorContainer.innerText = 'Your browser does not support DASH playback with Shaka Player.';
              return;
            }
            const uiContainer = document.createElement('div');
            uiContainer.className = 'shaka-player-container';
            videoPlayer.parentNode.insertBefore(uiContainer, videoPlayer);
            uiContainer.appendChild(videoPlayer);
            videoPlayerInstance = new shaka.Player(videoPlayer);
            const ui = new shaka.ui.Overlay(videoPlayerInstance, uiContainer, videoPlayer);
            ui.configure({
              controlPanelElements: [
                'play_pause',
                'mute',
                'volume',
                'time_and_duration',
                'fullscreen',
                'overflow_menu'
              ],
              overflowMenuButtons: [
                'captions',
                'quality',
                'language',
                'picture_in_picture'
              ],
              addSeekBar: true,
              enableKeyboardPlaybackControls: true
            });
            if (drmKey) {
              videoPlayerInstance.configure({
                drm: {
                  servers: {
                    'com.widevine.alpha': drmKey
                  }
                }
              });
            }
            videoPlayerInstance.load(streamUrl).then(() => {
              console.log('Shaka Player loaded MPD stream');
              clearError();
            }).catch(e => {
              console.error('Shaka Player error:', e);
              let errorMessage = 'Failed to load MPD stream: ';
              if (e.code === shaka.util.Error.Code.LOAD_FAILED) {
                errorMessage += 'Stream load failed. The stream may be down or inaccessible.';
              } else if (e.code === shaka.util.Error.Code.DRM_LICENSE_REQUEST_FAILED) {
                errorMessage += 'DRM license request failed. The provided DRM key may be invalid or expired.';
              } else {
                errorMessage += e.message || 'Unknown error';
              }
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = errorMessage;
            });
            videoPlayerInstance.addEventListener('error', (e) => {
              console.error('Shaka Player error event:', e.detail);
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = `Failed to load MPD stream: ${e.detail.message || 'Unknown error'}`;
            });
          } else {
            console.warn('DASH not supported in this browser');
            errorContainer.className = 'alert alert-warning error-alert mt-3';
            errorContainer.innerText = 'Your browser does not support DASH playback.';
          }
        } else {
          videoContainer.style.display = 'none';
          embedPlayer.style.display = 'block';
          if (videoPlayerInstance) {
            if (videoPlayerInstance.remove) {
              videoPlayerInstance.remove();
            } else if (videoPlayerInstance.destroy) {
              videoPlayerInstance.destroy();
            }
            videoPlayerInstance = null;
            recreateVideoElement(false);
          }
          embedPlayer.contentWindow.location.replace(streamUrl);
          console.log('Embed initialized successfully');
        }
        if (!isM3U8 && !isMPD) {
          embedPlayer.addEventListener('error', () => {
            console.error('Embed load error');
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load stream. The stream may be invalid or restricted.';
          });
          embedPlayer.addEventListener('load', () => {
            console.log('Embed loaded successfully');
            clearError();
          });
        }
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
          fullscreenBtn.classList.remove('d-none');
          fullscreenBtn.addEventListener('click', () => {
            if ((isM3U8 || isMPD) && videoPlayerInstance) {
              if (isM3U8 && videoPlayerInstance.getContainer) {
                const container = videoPlayerInstance.getContainer();
                if (container.requestFullscreen) {
                  container.requestFullscreen().catch(err => {
                    console.error('Fullscreen failed:', err);
                    errorContainer.className = 'alert alert-danger error-alert mt-3';
                    errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
                  });
                } else if (container.webkitRequestFullscreen) {
                  container.webkitRequestFullscreen();
                } else if (container.msRequestFullscreen) {
                  container.msRequestFullscreen();
                }
              } else if (isMPD) {
                const uiContainer = videoPlayer.parentNode;
                if (uiContainer.requestFullscreen) {
                  uiContainer.requestFullscreen().catch(err => {
                    console.error('Fullscreen failed:', err);
                    errorContainer.className = 'alert alert-danger error-alert mt-3';
                    errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
                  });
                } else if (uiContainer.webkitRequestFullscreen) {
                  uiContainer.webkitRequestFullscreen();
                } else if (uiContainer.msRequestFullscreen) {
                  uiContainer.msRequestFullscreen();
                }
              }
            } else if (embedPlayer.requestFullscreen) {
              embedPlayer.requestFullscreen().catch(err => {
                console.error('Fullscreen request failed:', err);
                errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
              });
            } else if (embedPlayer.webkitRequestFullscreen) {
              embedPlayer.webkitRequestFullscreen();
            } else if (embedPlayer.msRequestFullscreen) {
              embedPlayer.msRequestFullscreen();
            } else {
              console.error('Fullscreen API not supported');
              errorContainer.innerText = 'Fullscreen is not supported in this browser.';
            }
          });
        }
      } catch (err) {
        console.error('Player init error:', err);
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Failed to initialize stream: ' + (err.message || 'Unknown error');
      }
    }
    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(() => attempt(), delay);
              } else {
                console.error('All fetch attempts failed:', error);
                reject(error);
              }
            });
        }
        attempt();
      });
    }
    function initPage() {
      console.log('Initializing page at', new Date().toISOString());
      const errorContainer = document.getElementById('errorContainer');
      const eventTitle = document.getElementById('eventTitle');
      try {
        const uriName = window.location.pathname.split('/').pop();
        const playerContainer = document.querySelector('.video-container');

        if (typeof Api === 'undefined') {
          console.warn('Api class not defined. Using default API path.');
          api = { baseUrl: window.location.origin + '/api' };
        } else {
          api = new Api(`${window.location.origin}/api`);
        }
        const apiUrl = api.baseUrl.endsWith('/') ? `${api.baseUrl}stream-24-7` : `${api.baseUrl}/stream-24-7`;
        fetchWithRetry(apiUrl)
          .then(data => {
            console.log('Stream API Response:', data);
            if (!data || !data.success || !Array.isArray(data.streams)) {
              throw new Error('Invalid stream data');
            }
            const event = data.streams.find(s => s.uri_name === uriName);
            if (!event || !event.streams || !Array.isArray(event.streams) || event.streams.length === 0) {
              throw new Error(`Stream not found for uri_name: ${uriName}`);
            }
            if (!event.name) {
              throw new Error('Missing required event fields');
            }
            eventTitle.innerText = event.name;
            streamData = event;
            playerContainer.classList.add('fade-in');
            initPlayer(streamData, errorContainer);
          })
          .catch(error => {
            console.error('API Fetch Error:', error.message);
            eventTitle.innerText = 'Error: Stream Not Found';
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = error.message.includes('Stream not found')
              ? `The requested stream "${uriName}" was not found. Redirecting to home...`

            setTimeout(() => window.location.href = '/', 3000);

        try {
          checkAuthStatus();
        } catch (error) {
          console.warn('Auth status check failed:', error);
        }
        console.log('Page initialized successfully');
      } catch (error) {
        console.error('Init page error:', error);
        eventTitle.innerText = 'Error: Failed to Initialize';
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'An error occurred while initializing the page. Please try again.';
      }
    }
    window.addEventListener('load', () => {
      console.log('Window load complete at', new Date().toISOString());
      setTimeout(() => {
        initOffcanvas();
        startTipCountdown();
        initPage();
      }, 500);
    });
  </script>
</body>
</html>
