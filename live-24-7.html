  <style>
    /* Big Screen Adaptation */
    .player-container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .error-alert {
      max-width: 500px;
      margin: 20px auto;
    }
    .fade-out {
      animation: fadeOut 0.5s ease-out forwards;
    }
    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .btn-fullscreen, .btn-cast {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 20px;
      margin-left: 10px;
      transition: transform 0.3s, background 0.3s;
      font-weight: 500;
    }
    [data-bs-theme="light"] .btn-fullscreen, [data-bs-theme="light"] .btn-cast {
      background: #e63939;
      color: #fff;
    }
    .btn-fullscreen:hover, .btn-cast:hover {
      transform: scale(1.05);
      background: #e63939;
      color: #fff;
    }
    .offcanvas {
      z-index: 1055 !important;
    }
    .offcanvas-backdrop {
      z-index: 1050 !important;
      background-color: rgba(0, 0, 0, 0.5);
    }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <div class="d-flex align-items-center mb-3">
            <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7 Streams</a>
            <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
          </div>
          <h2 id="eventTitle" class="mb-3"></h2>
          <div class="player-container">
            <div class="video-container">
              <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="width: 100%; height: 100%;" allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
              <div id="videoPlayerContainer" style="width: 100%; height: 100%;">
                <video id="videoPlayer" class="d-none" controls></video>
              </div>
            </div>
            <div class="stream-dropdown d-flex align-items-center justify-content-between mt-3">
              <div class="dropdown">
                <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">
                  Select Stream
                </button>
                <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
              </div>
              <button id="castBtn" class="btn btn-cast d-none"><i class="fas fa-tv"></i> Cast Stream</button>
            </div>
          </div>
          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
        <ul class="nav">
          <li class="nav-item"><a href="https://discord.gg/CmRcPbBB2k" class="nav-link px-2 text-body-secondary">Discord</a></li>
        </ul>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let videoPlayerInstance = null;
    let streamData = null;

    // THEME & NAV LOGIC
    function initTheme() {
      const themeToggle = document.getElementById('themeToggle');
      const html = document.documentElement;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      html.setAttribute('data-bs-theme', currentTheme);
      themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      themeToggle.onclick = () => {
        const next = html.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-bs-theme', next);
        localStorage.setItem('theme', next);
        themeToggle.innerHTML = next === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      };
    }

    async function initPlayer(event, index) {
      const url = event.streams[index].url;
      const embed = document.getElementById('embedPlayer');
      const container = document.getElementById('videoPlayerContainer');
      const fsBtn = document.getElementById('fullscreenBtn');
      const castBtn = document.getElementById('castBtn');

      if (url.includes('.m3u8')) {
        embed.style.display = 'none';
        container.style.display = 'block';
        videoPlayerInstance = jwplayer('videoPlayer').setup({
          file: url, 
          autostart: true, 
          mute: true, // FIXED: Always start muted to prevent browser audio block
          width: '100%', 
          aspectratio: '16:9'
        });
        // Removed the auto-unmute listener to prevent the "silent load" error.
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
      }

      fsBtn.classList.remove('d-none');
      castBtn.classList.remove('d-none');

      // FULLSCREEN & CAST LINKS
      fsBtn.onclick = () => {
        const target = url.includes('.m3u8') ? document.getElementById('videoPlayer') : embed;
        if (target.requestFullscreen) target.requestFullscreen();
        else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
      };

      castBtn.onclick = () => {
        // Trigger Cast Prompt
        if (window.chrome && chrome.cast && chrome.cast.isAvailable) {
            const sessionRequest = new chrome.cast.SessionRequest(chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID);
            const apiConfig = new chrome.cast.ApiConfig(sessionRequest, () => {}, () => {});
            chrome.cast.initialize(apiConfig, () => {
                chrome.cast.requestSession(s => console.log("Success"), e => console.log(e));
            }, e => console.log(e));
        } else {
            // Fallback for Safari/Native
            const target = document.querySelector('video') || embed;
            if (target.remote && target.remote.prompt) target.remote.prompt();
            else alert("Please use Chrome or Safari on a Cast-ready device.");
        }
      };
    }

    function initPage() {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        const all = [];
        Object.keys(data.streams).forEach(cat => all.push(...data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          const menu = document.getElementById('streamDropdownMenu');
          menu.innerHTML = event.streams.map((s, i) => `<li><a class="dropdown-item" href="#" onclick="initPlayer(streamData, ${i}); document.getElementById('streamDropdown').innerText='${s.label || 'Stream '+(i+1)}'; return false;">${s.label || 'Stream '+(i+1)}</a></li>`).join('');
          initPlayer(event, 0);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      initPage();
      const offcanvas = new bootstrap.Offcanvas(document.getElementById('sidebarMenu'));
      document.getElementById('sidebarToggler').onclick = () => offcanvas.show();
    });
  </script>
</body>
</html>
