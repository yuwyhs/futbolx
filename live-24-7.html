<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <meta name="description" content="FutbolX - Watch 24/7 cartoons and other content.">
  <meta name="keywords" content="futbolx, cartoons, 24/7, stream, online, free">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900|outfit:300,400,500,600,700" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <style>
    /* ===== FUTBOLX UI THEME ===== */
    :root {
      --fx-bg: #07080b;
      --fx-surface: #0f1118;
      --fx-surface-hover: #171a26;
      --fx-glass: rgba(15, 17, 24, 0.75);
      --fx-glass-border: rgba(255, 255, 255, 0.08);

      --fx-accent: #ef4444;
      --fx-accent-hover: #f87171;
      --fx-accent-dark: #dc2626;
      --fx-accent-glow: rgba(239, 68, 68, 0.30);

      --fx-gold: #ffc107;
      --fx-text-main: #f1f5f9;
      --fx-text-muted: #94a3b8;
      --fx-radius: 14px;
    }

    [data-bs-theme="light"] {
      --fx-bg: #f8fafc;
      --fx-surface: #ffffff;
      --fx-surface-hover: #f1f5f9;
      --fx-glass: rgba(255, 255, 255, 0.85);
      --fx-glass-border: rgba(0, 0, 0, 0.08);
      --fx-text-main: #0f172a;
      --fx-text-muted: #64748b;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--fx-bg) !important;
      color: var(--fx-text-main);
      font-family: 'Outfit', sans-serif;
      transition: background-color 0.3s ease;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ===== GLASS TOP BAR ===== */
    .top-bar {
      background: var(--fx-glass) !important;
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-bottom: 1px solid var(--fx-glass-border);
      padding: 12px 0;
      transition: all 0.3s ease;
    }

    .top-bar .container-fluid {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      max-width: 1600px;
    }

    #sidebarToggler {
      background: rgba(255, 255, 255, 0.05) !important;
      border: 1px solid var(--fx-glass-border) !important;
      color: var(--fx-text-main) !important;
      border-radius: 10px;
      padding: 8px 14px;
      transition: all 0.2s ease;
    }

    #sidebarToggler:hover {
      background: rgba(255, 255, 255, 0.12) !important;
      transform: scale(1.03);
    }

    /* ===== BRAND ===== */
    .futbolx-brand {
      font-family: 'Kanit', sans-serif;
      font-weight: 900;
      font-size: 1.5rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--fx-text-main) !important;
      display: inline-flex;
      align-items: center;
      user-select: none;
      text-decoration: none;
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      cursor: pointer;
      text-shadow: none !important;
      filter: none !important;
    }

    .futbolx-brand .ball-o {
      color: var(--fx-gold);
      font-size: 1.25rem;
      margin: 0 2px;
      filter: none !important;
      text-shadow: none !important;
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-block;
    }

    .futbolx-brand:hover .ball-o {
      transform: rotate(180deg) scale(1.1);
    }

    .futbolx-brand .ball-o.spinning {
      animation: ballSpin 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes ballSpin {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.3); }
      100% { transform: rotate(360deg) scale(1); }
    }

    /* ===== SIDEBAR ===== */
    .offcanvas {
      background-color: var(--fx-surface) !important;
      border-right: 1px solid var(--fx-glass-border) !important;
    }

    .offcanvas-header {
      border-bottom: 1px solid var(--fx-glass-border);
      padding: 16px;
    }

    .offcanvas-header .offcanvas-title {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      text-transform: uppercase;
    }

    .offcanvas-body {
      padding: 16px;
    }

    .offcanvas .nav-link {
      color: var(--fx-text-main) !important;
      font-weight: 500;
      padding: 12px 16px;
      border-radius: 10px;
      transition: all 0.2s ease;
      margin-bottom: 4px;
      text-decoration: none;
    }

    .offcanvas .nav-link:hover {
      background: var(--fx-surface-hover);
      color: var(--fx-accent) !important;
      transform: translateX(4px);
    }

    .offcanvas .nav-link.btn-link {
      width: 100%;
      text-align: left;
      border: 0;
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      padding-top: 70px;
    }

    .player-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* ===== BACK BUTTON ===== */
    .btn-back {
      background: var(--fx-accent-dark) !important;
      border-color: var(--fx-accent-dark) !important;
      color: #fff !important;
      font-weight: 700;
      border-radius: 10px;
      box-shadow: 0 5px 18px rgba(239, 68, 68, 0.12);
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background: var(--fx-accent) !important;
      border-color: var(--fx-accent) !important;
      color: #fff !important;
      transform: translateY(-1px);
      box-shadow: 0 7px 22px var(--fx-accent-glow);
    }

    /* ===== EVENT TITLE ===== */
    #eventTitle {
      font-family: 'Kanit', sans-serif;
      font-weight: 700;
      color: var(--fx-text-main);
      background: var(--fx-glass);
      border: 1px solid var(--fx-glass-border);
      border-radius: 12px;
      padding: 14px 18px;
      margin-top: 18px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* ===== VIDEO PLAYER ===== */
    .video-container {
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--fx-glass-border);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35);
    }

    #embedPlayer,
    #videoPlayerContainer {
      position: absolute !important;
      top: 0;
      left: 0;
      width: 100% !important;
      height: 100% !important;
    }

    /* =========================================================
       FUTBOLX CUSTOM VIDEO PLAYER
       ========================================================= */

    #videoPlayer {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #videoPlayer video {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
      object-fit: contain;
      background: #000;
    }

    .fx-player-ui {
      position: absolute;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      opacity: 1;
      transition: opacity .3s ease;
      background:
        linear-gradient(
          to bottom,
          rgba(0,0,0,.38),
          transparent 22%,
          transparent 65%,
          rgba(0,0,0,.78)
        );
    }

    .fx-player-ui.hidden {
      opacity: 0;
    }

    .fx-player-ui > * {
      pointer-events: auto;
    }

    /* Top area */
    .fx-player-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
    }

    .fx-live-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 7px;
      background: rgba(0,0,0,.58);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      font-family: 'Kanit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .fx-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 9px rgba(239,68,68,.9);
      animation: fxLivePulse 1.4s infinite;
    }

    @keyframes fxLivePulse {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: .45;
        transform: scale(.72);
      }
    }

    /* Center play button */
    .fx-center-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 66px;
      height: 66px;
      border: 0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(239,68,68,.95);
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 8px 35px rgba(0,0,0,.5);
      transition: transform .2s ease, opacity .25s ease;
    }

    .fx-center-play:hover {
      transform: translate(-50%, -50%) scale(1.08);
    }

    .fx-center-play.hide {
      opacity: 0;
      pointer-events: none;
    }

    /* Bottom controls */
    .fx-player-controls {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 12px 14px 14px;
    }

    .fx-control-btn {
      width: 40px;
      height: 40px;
      border: 0;
      border-radius: 9px;
      background: rgba(15,17,24,.78);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      transition: background .18s ease, transform .18s ease;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .fx-control-btn:hover {
      background: rgba(239,68,68,.9);
      transform: translateY(-1px);
    }

    .fx-control-btn:active {
      transform: scale(.94);
    }

    .fx-controls-spacer {
      flex: 1;
    }

    .fx-player-label {
      color: rgba(255,255,255,.82);
      font-size: 12px;
      font-weight: 600;
      margin-left: 4px;
      margin-right: 5px;
      white-space: nowrap;
      text-shadow: 0 1px 3px #000;
    }

    /* Volume */
    .fx-volume-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .fx-volume-slider {
      width: 0;
      opacity: 0;
      pointer-events: none;
      transition: width .2s ease, opacity .2s ease;
      accent-color: var(--fx-accent);
      cursor: pointer;
    }

    .fx-volume-wrap:hover .fx-volume-slider,
    .fx-volume-slider:focus {
      width: 70px;
      opacity: 1;
      pointer-events: auto;
    }

    /* AirPlay button hidden unless supported */
    #fxAirplay {
      display: none;
    }

    /* Fullscreen player */
    #videoPlayerContainer.fx-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      padding: 0 !important;
      z-index: 99999 !important;
      background: #000 !important;
    }

    #videoPlayerContainer.fx-fullscreen #videoPlayer {
      width: 100%;
      height: 100%;
    }

    /* =========================================================
       STREAM SELECTOR
       ========================================================= */

    .stream-dropdown {
      background: var(--fx-glass);
      border: 1px solid var(--fx-glass-border);
      border-radius: 12px;
      padding: 10px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .btn-stream {
      min-width: 180px;
      background: #0b1020 !important;
      color: #e7edf5 !important;
      border: 2px solid #167da5 !important;
      border-radius: 10px;
      padding: 10px 16px;
      font-weight: 600;
      transition: border-color .18s ease, background .18s ease;
    }

    .btn-stream:hover,
    .btn-stream:focus {
      background: #0e1424 !important;
      border-color: #2297c2 !important;
      color: #fff !important;
      box-shadow: none;
    }

    .stream-dropdown .dropdown-menu {
      background: #202126 !important;
      border: 1px solid #3a3b40 !important;
      border-radius: 12px;
      padding: 6px;
      box-shadow: 0 18px 55px rgba(0, 0, 0, 0.65);
    }

    .stream-dropdown .dropdown-item {
      color: #f1f1f3 !important;
      border-radius: 8px;
      padding: 10px 12px;
      transition: background .15s ease;
    }

    .stream-dropdown .dropdown-item:hover,
    .stream-dropdown .dropdown-item:focus {
      background: #2b2c31 !important;
      color: #fff !important;
    }

    /* ===== ERROR ===== */
    .error-alert {
      max-width: 500px;
      margin: 20px auto;
      border-radius: 12px;
    }

    /* ===== FOOTER ===== */
    footer {
      border-top-color: var(--fx-glass-border) !important;
    }

    footer .nav-link {
      transition: color 0.2s ease;
    }

    footer .nav-link:hover {
      color: var(--fx-accent) !important;
    }

    /* ===== MOBILE ===== */
    @media (max-width: 767.98px) {

      .main-content {
        padding-top: 65px;
      }

      .player-container {
        width: 100%;
      }

      #eventTitle {
        font-size: 1.5rem;
        padding: 12px 14px;
      }

      .stream-dropdown {
        padding: 8px;
      }

      .btn-stream {
        width: 100%;
        min-width: 0;
      }

      .fx-player-controls {
        padding: 8px 9px 10px;
        gap: 4px;
      }

      .fx-control-btn {
        width: 38px;
        height: 38px;
      }

      .fx-volume-slider {
        display: none;
      }

      .fx-player-label {
        display: none;
      }

      .fx-center-play {
        width: 58px;
        height: 58px;
        font-size: 19px;
      }

      .fx-live-badge {
        padding: 5px 9px;
        font-size: 11px;
      }
    }
  </style>
</head>

  <script src="https://cdn.jsdelivr.net/npm/mpegts.js@latest/dist/mpegts.min.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>

  <script>

    let videoPlayerInstance = null;
    let streamData = null;

    let fxVideo = null;
    let fxControlsTimer = null;

    document.addEventListener('DOMContentLoaded', () => {

      const brandLogo = document.getElementById('brandLogo');
      const logoBall = document.getElementById('logoBall');

      if (brandLogo && logoBall) {

        brandLogo.addEventListener('click', () => {

          logoBall.classList.add('spinning');

          setTimeout(() => {
            logoBall.classList.remove('spinning');
          }, 600);

        });

      }

    });

    function initTheme() {

      const themeToggle =
        document.getElementById('themeToggle');

      const html =
        document.documentElement;

      const currentTheme =
        localStorage.getItem('theme') || 'dark';

      html.setAttribute(
        'data-bs-theme',
        currentTheme
      );

      themeToggle.onclick = () => {

        const next =
          html.getAttribute('data-bs-theme') === 'dark'
            ? 'light'
            : 'dark';

        html.setAttribute(
          'data-bs-theme',
          next
        );

        localStorage.setItem(
          'theme',
          next
        );

      };

    }

    function destroyMpegtsPlayer() {

      if (videoPlayerInstance) {

        try {
          videoPlayerInstance.pause();
        } catch (e) {}

        try {
          videoPlayerInstance.unload();
        } catch (e) {}

        try {
          videoPlayerInstance.detachMediaElement();
        } catch (e) {}

        try {
          videoPlayerInstance.destroy();
        } catch (e) {}

        videoPlayerInstance = null;

      }

      fxVideo = null;

      const player =
        document.getElementById('videoPlayer');

      if (player) {
        player.innerHTML = '';
      }

    }

    function createPlayerUI(video, streamName) {

      const player =
        document.getElementById('videoPlayer');

      player.innerHTML = '';

      const ui =
        document.createElement('div');

      ui.className = 'fx-player-ui';

      ui.innerHTML = `

        <div class="fx-player-top">

          <div class="fx-live-badge">
            <span class="fx-live-dot"></span>
            LIVE
          </div>

        </div>

        <button
          type="button"
          class="fx-center-play"
          id="fxCenterPlay"
          aria-label="Play">

          <i class="fas fa-play"></i>

        </button>

        <div class="fx-player-controls">

          <button
            type="button"
            class="fx-control-btn"
            id="fxPlay"
            aria-label="Play/Pause">

            <i class="fas fa-play"></i>

          </button>

          <div class="fx-volume-wrap">

            <button
              type="button"
              class="fx-control-btn"
              id="fxMute"
              aria-label="Mute/Unmute">

              <i class="fas fa-volume-mute"></i>

            </button>

            <input
              type="range"
              class="fx-volume-slider"
              id="fxVolume"
              min="0"
              max="1"
              step="0.05"
              value="1"
              aria-label="Volume">

          </div>

          <span class="fx-player-label">
            ${escapeHtml(streamName || 'LIVE STREAM')}
          </span>

          <div class="fx-controls-spacer"></div>

          <button
            type="button"
            class="fx-control-btn"
            id="fxPip"
            aria-label="Picture in Picture"
            title="Picture in Picture">

            <i class="fas fa-clone"></i>

          </button>

          <button
            type="button"
            class="fx-control-btn"
            id="fxAirplay"
            aria-label="AirPlay"
            title="AirPlay">

            <i class="fab fa-apple"></i>

          </button>

          <button
            type="button"
            class="fx-control-btn"
            id="fxFullscreen"
            aria-label="Fullscreen"
            title="Fullscreen">

            <i class="fas fa-expand"></i>

          </button>

        </div>
      `;

      player.appendChild(video);
      player.appendChild(ui);

      const playButton =
        document.getElementById('fxPlay');

      const centerPlay =
        document.getElementById('fxCenterPlay');

      const muteButton =
        document.getElementById('fxMute');

      const volumeSlider =
        document.getElementById('fxVolume');

      const pipButton =
        document.getElementById('fxPip');

      const airplayButton =
        document.getElementById('fxAirplay');

      const fullscreenButton =
        document.getElementById('fxFullscreen');

      /*
       * Play / pause
       */
      function togglePlay() {

        if (video.paused) {

          video.play().catch(() => {});

        } else {

          video.pause();

        }

      }

      playButton.onclick = togglePlay;
      centerPlay.onclick = togglePlay;

      /*
       * Update play icons
       */
      video.addEventListener('play', () => {

        playButton.innerHTML =
          '<i class="fas fa-pause"></i>';

        centerPlay.innerHTML =
          '<i class="fas fa-pause"></i>';

        centerPlay.classList.add('hide');

      });

      video.addEventListener('pause', () => {

        playButton.innerHTML =
          '<i class="fas fa-play"></i>';

        centerPlay.innerHTML =
          '<i class="fas fa-play"></i>';

        centerPlay.classList.remove('hide');

        showPlayerControls();

      });

      /*
       * Mute / unmute
       */
      function updateMuteIcon() {

        if (
          video.muted ||
          video.volume === 0
        ) {

          muteButton.innerHTML =
            '<i class="fas fa-volume-mute"></i>';

        } else if (video.volume < 0.5) {

          muteButton.innerHTML =
            '<i class="fas fa-volume-down"></i>';

        } else {

          muteButton.innerHTML =
            '<i class="fas fa-volume-up"></i>';

        }

      }

      muteButton.onclick = () => {

        video.muted = !video.muted;

        updateMuteIcon();

      };

      volumeSlider.oninput = () => {

        video.volume =
          Number(volumeSlider.value);

        video.muted =
          video.volume === 0;

        updateMuteIcon();

      };

      /*
       * Picture in Picture
       */
      if (
        document.pictureInPictureEnabled ||
        video.webkitSupportsPresentationMode
      ) {

        pipButton.style.display =
          'inline-flex';

      } else {

        pipButton.style.display =
          'none';

      }

      pipButton.onclick = async () => {

        try {

          if (
            document.pictureInPictureElement
          ) {

            await document.exitPictureInPicture();

          } else if (
            document.pictureInPictureEnabled
          ) {

            await video.requestPictureInPicture();

          } else if (
            video.webkitSetPresentationMode
          ) {

            video.webkitSetPresentationMode(
              video.webkitPresentationMode ===
              'picture-in-picture'
                ? 'inline'
                : 'picture-in-picture'
            );

          }

        } catch (error) {

          console.error(
            'PiP error:',
            error
          );

        }

      };

      /*
       * AirPlay
       *
       * Safari exposes this through
       * webkitShowPlaybackTargetPicker().
       */
      if (
        typeof video.webkitShowPlaybackTargetPicker ===
        'function'
      ) {

        airplayButton.style.display =
          'inline-flex';

        airplayButton.onclick = () => {

          try {

            video.webkitShowPlaybackTargetPicker();

          } catch (error) {

            console.error(
              'AirPlay error:',
              error
            );

          }

        };

      }

      /*
       * Fullscreen
       */
      fullscreenButton.onclick = async () => {

        const container =
          document.getElementById(
            'videoPlayerContainer'
          );

        try {

          if (
            document.fullscreenElement
          ) {

            await document.exitFullscreen();

          } else if (
            container.requestFullscreen
          ) {

            await container.requestFullscreen();

          } else {

            container.classList.toggle(
              'fx-fullscreen'
            );

          }

        } catch (error) {

          container.classList.toggle(
            'fx-fullscreen'
          );

        }

      };

      document.addEventListener(
        'fullscreenchange',
        () => {

          const icon =
            fullscreenButton.querySelector('i');

          if (document.fullscreenElement) {

            icon.className =
              'fas fa-compress';

          } else {

            icon.className =
              'fas fa-expand';

          }

        }
      );

      /*
       * Double-click video = fullscreen
       */
      video.addEventListener(
        'dblclick',
        () => {

          fullscreenButton.click();

        }
      );

      /*
       * Show/hide controls
       */
      function showPlayerControls() {

        ui.classList.remove('hidden');

        clearTimeout(
          fxControlsTimer
        );

        if (!video.paused) {

          fxControlsTimer =
            setTimeout(() => {

              ui.classList.add('hidden');

            }, 3000);

        }

      }

      function toggleControls() {

        if (
          ui.classList.contains('hidden')
        ) {

          showPlayerControls();

        } else if (!video.paused) {

          ui.classList.add('hidden');

        }

      }

      player.addEventListener(
        'mousemove',
        showPlayerControls
      );

      player.addEventListener(
        'touchstart',
        showPlayerControls,
        { passive: true }
      );

      video.addEventListener(
        'click',
        toggleControls
      );

      ui.addEventListener(
        'click',
        showPlayerControls
      );

      /*
       * Initial state
       */
      video.muted = true;
      video.volume = 1;

      updateMuteIcon();

      fxVideo = video;

    }

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }

    async function initPlayer(event, index) {

      const url =
        event.streams[index].url;

      const embed =
        document.getElementById('embedPlayer');

      const container =
        document.getElementById(
          'videoPlayerContainer'
        );

      const errorContainer =
        document.getElementById(
          'errorContainer'
        );

      errorContainer.classList.add('d-none');
      errorContainer.innerText = '';

      destroyMpegtsPlayer();

      embed.src = 'about:blank';

      /*
       * =====================================================
       * MPEG-TS STREAM
       * =====================================================
       */

      if (
        url.toLowerCase().includes('.ts')
      ) {

        embed.style.display = 'none';
        container.style.display = 'block';

        const video =
          document.createElement('video');

        video.controls = false;
        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;

        video.setAttribute(
          'playsinline',
          ''
        );

        video.setAttribute(
          'webkit-playsinline',
          ''
        );

        video.style.width = '100%';
        video.style.height = '100%';
        video.style.objectFit = 'contain';
        video.style.background = '#000';

        createPlayerUI(
          video,
          event.streams[index].label ||
          event.name ||
          'LIVE STREAM'
        );

        if (
          typeof mpegts !== 'undefined' &&
          mpegts.isSupported()
        ) {

          videoPlayerInstance =
            mpegts.createPlayer({

              type: 'mpegts',

              isLive: true,

              url: url

            });

          videoPlayerInstance.attachMediaElement(
            video
          );

          videoPlayerInstance.load();

          videoPlayerInstance.play()
            .catch(() => {});

          videoPlayerInstance.on(
            mpegts.Events.ERROR,
            function(type, detail, info) {

              console.error(
                'mpegts.js error:',
                type,
                detail,
                info
              );

              errorContainer.innerText =
                'Unable to play this stream in the browser.';

              errorContainer.classList.remove(
                'd-none'
              );

            }
          );

        } else {

          errorContainer.innerText =
            'This browser does not support MPEG-TS playback.';

          errorContainer.classList.remove(
            'd-none'
          );

        }

        return;

      }

      /*
       * =====================================================
       * EXISTING IFRAME
       * =====================================================
       *
       * The iframe is intentionally left untouched
       * for non-.ts streams.
       */

      container.style.display = 'none';
      embed.style.display = 'block';

      embed.src =
        url +
        (url.includes('?') ? '&' : '?') +
        'autoplay=1';

    }

    function initPage() {

      const uriName =
        window.location.pathname.split('/').pop();

      fetch('/api/stream-24-7')
        .then(r => r.json())
        .then(data => {

          const all = [];

          Object.keys(data.streams)
            .forEach(cat =>
              all.push(...data.streams[cat])
            );

          const event =
            all.find(
              s => s.uri_name === uriName
            );

          if (event) {

            document.getElementById('eventTitle')
              .innerText = event.name;

            streamData = event;

            const menu =
              document.getElementById(
                'streamDropdownMenu'
              );

            menu.innerHTML =
              event.streams.map((s, i) =>
                `<li>
                  <a class="dropdown-item"
                     href="#"
                     onclick="initPlayer(streamData, ${i}); document.getElementById('streamDropdown').innerText='${s.label || 'Stream ' + (i + 1)}'; return false;">
                    ${s.label || 'Stream ' + (i + 1)}
                  </a>
                </li>`
              ).join('');

            initPlayer(event, 0);

          }

        });

    }

    document.addEventListener(
      'DOMContentLoaded',
      () => {

        initTheme();
        initPage();

      }
    );

  </script>

</body>
  </html>
