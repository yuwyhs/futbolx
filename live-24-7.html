<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* UI Structure */
    .video-container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
    #oplayer-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }
    .plyr { font-family: 'Kanit', sans-serif; height: 100%; --plyr-color-main: #ff4d4d; }

    /* Vertical Attached Volume */
    .plyr__volume { min-width: unset !important; position: relative !important; }
    .plyr__volume input[type=range] {
      position: absolute !important;
      bottom: 50px !important;
      left: 50% !important;
      transform: translateX(-50%) rotate(-90deg) !important;
      width: 90px !important;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s ease;
      z-index: 100;
      background: rgba(0,0,0,0.85) !important;
    }
    .plyr__volume:hover input[type=range], .plyr__volume--active input[type=range] {
      opacity: 1; 
      visibility: visible;
      bottom: 60px !important;
    }

    /* Scrollable Quality Menu */
    .plyr__menu__container [role=menu] { max-height: 200px; overflow-y: auto; }

    /* Cast Text Button Styling */
    .btn-cast-text { background: transparent; border: 1px solid #444; color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-family: 'Kanit'; font-size: 0.9rem; transition: 0.3s; }
    .btn-cast-text:hover { background: #ff4d4d; border-color: #ff4d4d; }

    .offcanvas { z-index: 1055 !important; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item">
            <button id="themeToggle" class="nav-link btn btn-link"><i class="fas fa-moon"></i></button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="d-flex align-items-center mb-3">
        <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7</a>
        <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
      </div>

      <h2 id="eventTitle" class="mb-3"></h2>
      
      <div class="video-container">
        <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="display:none; width:100%; height:100%;"></iframe>
        <div id="oplayer-container" style="display:none;">
          <video id="videoPlayer" playsinline controls crossorigin></video>
        </div>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div class="dropdown">
          <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">
            Select Stream
          </button>
          <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
        </div>
        <button id="externalCastBtn" class="btn-cast-text d-none">CAST</button>
      </div>

      <div id="errorContainer" class="alert alert-danger mt-3 d-none"></div>

      <footer class="py-2 border-top mt-5">
        <p class="text-body-secondary">FutbolX 2026</p>
      </footer>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;
    let streamData = null;

    function isHLS(url) {
        return url.split('?')[0].toLowerCase().endsWith('.m3u8') || url.toLowerCase().includes('.m3u8?');
    }

    async function initPlayer(event, streamIndex) {
      const streamUrl = event.streams[streamIndex].url;
      const video = document.getElementById('videoPlayer');
      const container = document.getElementById('oplayer-container');
      const embed = document.getElementById('embedPlayer');
      const castBtn = document.getElementById('externalCastBtn');
      const fsBtn = document.getElementById('fullscreenBtn');

      if (player) player.destroy();
      if (hls) hls.destroy();

      if (isHLS(streamUrl)) {
        embed.style.display = 'none';
        container.style.display = 'block';
        castBtn.classList.remove('d-none');
        fsBtn.classList.remove('d-none');

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            const qualities = hls.levels.map(l => l.height);
            player = new Plyr(video, {
              autoplay: true,
              controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
              quality: {
                default: 0,
                options: [0, ...qualities],
                forced: true,
                onChange: (q) => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); }
              }
            });

            player.on('ready', () => {
              // 0p to Auto Fix
              const labels = { 0: 'Auto' };
              qualities.forEach(q => { labels[q] = q + 'p'; });
              player.config.quality.labels = labels;

              // Hide captions if empty
              if (video.textTracks.length === 0) {
                const cBtn = document.querySelector('.plyr__control[data-plyr="captions"]');
                if (cBtn) cBtn.style.display = 'none';
              }

              // Volume Stability - Stop click-to-mute
              const muteBtn = document.querySelector('.plyr__control[data-plyr="mute"]');
              if(muteBtn) muteBtn.addEventListener('click', (e) => e.stopPropagation(), true);
            });
            video.play();
          });
        }
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = streamUrl;
      }
    }

    // External Cast Trigger
    document.getElementById('externalCastBtn').onclick = () => {
        if (window.chrome && window.chrome.cast) {
            chrome.cast.requestSession(s => console.log("Cast Session started"), e => console.log(e));
        } else {
            alert("Please use Chrome or Edge for casting.");
        }
    };

    document.getElementById('fullscreenBtn').onclick = () => player ? player.fullscreen.enter() : document.getElementById('embedPlayer').requestFullscreen();

    function populateDropdown(streams) {
      const menu = document.getElementById('streamDropdownMenu');
      const btn = document.getElementById('streamDropdown');
      menu.innerHTML = streams.map((s, i) => `<li><a class="dropdown-item" href="#" data-index="${i}">${s.label || 'Stream '+(i+1)}</a></li>`).join('');
      menu.querySelectorAll('.dropdown-item').forEach(item => {
        item.onclick = (e) => {
            e.preventDefault();
            const idx = item.dataset.index;
            btn.textContent = item.textContent;
            initPlayer(streamData, idx);
        };
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        let all = [];
        Object.keys(data.streams).forEach(cat => all = all.concat(data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          populateDropdown(event.streams);
          initPlayer(event, 0);
        }
      });
    });
  </script>
</body>
</html>
