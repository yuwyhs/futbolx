    // Clear error messages
    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {

    // Tip countdown
    function startTipCountdown() {
      const tipContainer = document.querySelector('.tip-container');
      const tipAlert = document.querySelector('.alert-info');
      const countdownTimer = document.getElementById('countdownTimer');
      let seconds = 10;
      if (!tipContainer || !tipAlert || !countdownTimer) {
        console.warn('Tip container or elements not found');
        return;
      }
      tipContainer.style.height = `${tipAlert.offsetHeight}px`;
      const interval = setInterval(() => {
        seconds--;
        countdownTimer.textContent = `${seconds}s`;
        if (seconds <= 0) {
          clearInterval(interval);
          tipAlert.classList.add('fade-out');
          setTimeout(() => {
            tipContainer.style.height = '0';
            tipAlert.style.display = 'none';
          }, 500);
        }
      }, 1000);
      setTimeout(() => {
        tipContainer.style.height = '0';
        tipAlert.style.display = 'none';
        clearInterval(interval);
      }, 10500);
    }

    // Initialize offcanvas
    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');

      console.log('Initializing offcanvas at', new Date().toISOString());
      if (typeof bootstrap === 'undefined') {
        console.error('Bootstrap not loaded. Ensure Bootstrap JS is included.');
        return;

      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement, {

        });

        if (logoutButton) {

            offcanvas.hide();

    // Detect M3U8 stream by content
    async function isM3U8Stream(url) {
      if (url.toLowerCase().includes('.m3u8')) {
        return true;
      }
      try {
        const response = await fetch(url, { 
          method: 'GET', 
          headers: { 'Range': 'bytes=0-1023' },
          signal: AbortSignal.timeout(5000)
        });
        if (!response.ok) return false;
        const content = await response.text();
        return content.includes('#EXTM3U') || content.includes('.ts');
      } catch (error) {
        console.warn(`M3U8 detection fetch failed for ${url}:`, error);
        return false;
      }
    }

    // Initialize player
    async function initPlayer(event, streamIndex, errorContainer) {
      console.log('initPlayer called with event:', event, 'streamIndex:', streamIndex);
      try {
        clearError();
        embedPlayer = document.getElementById('embedPlayer');
        const videoContainer = document.getElementById('videoPlayerContainer');
        const stream = event.streams[streamIndex];
        const streamUrl = stream.url;
        if (!streamUrl || !/^https?:/.test(streamUrl)) {
          throw new Error('Invalid or missing stream URL');
        }
        console.log('Stream URL:', streamUrl);

        const isM3U8 = await isM3U8Stream(streamUrl);
        console.log('Is M3U8 stream:', isM3U8);

        if (isM3U8) {
          embedPlayer.style.display = 'none';
          let videoPlayer = document.getElementById('videoPlayer');
          if (!videoPlayer) {
            videoPlayer = recreateVideoElement(true);
          }
          videoPlayer.classList.remove('d-none');
          videoContainer.style.display = 'block';
          if (typeof jwplayer === 'undefined') {
            console.error('JW Player not loaded');
            throw new Error('JW Player library not loaded');
          }
          videoPlayerInstance = jwplayer('videoPlayer').setup({
            file: streamUrl,
            autostart: true,
            mute: true,
            width: '100%',
            aspectratio: '16:9',
            controls: true,
            displaytitle: false,
            pipIcon: 'enabled',
            captions: {
              color: '#ffffff',
              backgroundOpacity: 50
            }
          });
          videoPlayerInstance.on('ready', () => {
            console.log('JW Player ready for HLS');
            clearError();
            videoPlayerInstance.play();
            try {
              videoPlayerInstance.setMute(false);
              console.log('JV Player unmuted');
            } catch (e) {
              console.warn('Failed to unmute JW Player:', e);
            }
          });
          videoPlayerInstance.on('error', (e) => {
            console.error('JW Player error:', e);
            let errorMessage = 'Failed to load M3U8 stream: ';
            if (e.code === 232011 || e.code === 232001) {
              errorMessage += `Failed to load playlist (Code: ${e.code}). The stream may be down or blocked.`;
            } else if (e.code === 230001) {
              errorMessage += `Network error loading stream (Code: ${e.code}). Check your connection or stream URL.`;
            } else {
              errorMessage += e.message || 'Unknown error';
            }
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = errorMessage;
            console.log('JW Player error details:', {
              code: e.code,
              message: e.message,
              sourceError: e.sourceError
            });
          });
        } else {
          videoContainer.style.display = 'none';
          embedPlayer.style.display = 'block';
          if (videoPlayerInstance) {
            if (videoPlayerInstance.destroy) {
              videoPlayerInstance.destroy();
            }
            videoPlayerInstance = null;
            recreateVideoElement(false);
          }
          const url = new URL(streamUrl);
          url.searchParams.append('autoplay', '1');
          embedPlayer.contentWindow.location.replace(url.toString());
          embedPlayer.muted = true;
          console.log('Embed initialized successfully');
          embed """
Player.addEventListener('load', () => {
            console.log('Embed loaded successfully');
            clearError();
            try {
              embedPlayer.contentWindow.postMessage({ type: 'play' }, '*');
              embedPlayer.contentWindow.postMessage({ type: 'unmute' }, '*');
              embedPlayer.muted = false;
              console.log('Iframe unmuted');
            } catch (e) {
              console.warn('Iframe play/unmute message failed:', e);
            }
          });
          embedPlayer.addEventListener('error', () => {
            console.error('Embed load error');
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load stream. The stream may be invalid or restricted.';
          });
        }
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        if (fullscreenBtn) {
          fullscreenBtn.classList.remove('d-none');
          fullscreenBtn.addEventListener('click', () => {
            if (isM3U8 && videoPlayerInstance) {
              const container = videoPlayerInstance.getContainer ? videoPlayerInstance.getContainer() : videoPlayer;
              if (container.requestFullscreen) {
                container.requestFullscreen().catch(err => {
                  console.error('Fullscreen failed:', err);
                  errorContainer.className = 'alert alert-danger error-alert mt-3';
                  errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
                });
              } else if (container.webkitRequestFullscreen) {
                container.webkitRequestFullscreen();
              } else if (container.msRequestFullscreen) {
                container.msRequestFullscreen();
              }
            } else if (embedPlayer.requestFullscreen) {
              embedPlayer.requestFullscreen().catch(err => {
                console.error('Fullscreen request failed:', err);
                errorContainer.innerText = 'Failed to enter fullscreen: ' + (err.message || 'Not supported');
              });
            } else if (embedPlayer.webkitRequestFullscreen) {
              embedPlayer.webkitRequestFullscreen();
            } else if (embedPlayer.msRequestFullscreen) {
              embedPlayer.msRequestFullscreen();
            } else {
              console.error('Fullscreen API not supported');
              errorContainer.innerText = 'Fullscreen is not supported in this browser.';
            }
          });
        }
      } catch (err) {
        console.error('Player init error:', err);
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'Failed to initialize stream: ' + (err.message || 'Unknown error');
      }
    }

    // Populate stream dropdown
    function populateStreamDropdown(streams) {
      const dropdownMenu = document.getElementById('streamDropdownMenu');
      const dropdownButton = document.getElementById('streamDropdown');
      dropdownMenu.innerHTML = '';

      if (streams.length === 0) {
        dropdownMenu.innerHTML = '<li><span class="dropdown-item disabled">No streams available</span></li>';
        dropdownButton.textContent = 'No Streams';
        dropdownButton.disabled = true;
        return;
      }

      streams.forEach((stream, index) => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.className = 'dropdown-item';
        a.href = '#';
        a.textContent = stream.label || `Stream ${index + 1}`;
        a.dataset.streamIndex = index;
        li.appendChild(a);
        dropdownMenu.appendChild(li);
      });

      dropdownButton.textContent = streams[currentStreamIndex].label || `Stream ${currentStreamIndex + 1}`;
      dropdownButton.disabled = streams.length === 1;

      const dropdownItems = dropdownMenu.querySelectorAll('.dropdown-item');
      dropdownItems.forEach(item => {
        item.addEventListener('click', (event) => {
          event.preventDefault();
          const streamIndex = parseInt(item.dataset.streamIndex);
          if (streamIndex !== currentStreamIndex) {
            currentStreamIndex = streamIndex;
            dropdownButton.textContent = streams[streamIndex].label || `Stream ${streamIndex + 1}`;
            initPlayer(streamData, streamIndex, document.getElementById('errorContainer'));
          }
        });
      });
    }

    // Fetch stream data with retry
    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(() => attempt(), delay);
              } else {
                console.error('All fetch attempts failed:', error);
                reject(error);
              }
            });
        }
        attempt();
      });
    }

    // Initialize page
    function initPage() {

      try {
        const uriName = window.location.pathname.split('/').pop();
        const playerContainer = document.querySelector('.video-container');
        const apiUrl = '/api/stream-24-7';
        fetchWithRetry(apiUrl)
          .then(data => {
            console.log('Stream API Response:', data);
            if (!data || !data.success) {
              throw new Error('Invalid stream data');
            }
            const streams = [];
            Object.keys(data.streams).forEach(category => {
              data.streams[category].forEach(stream => {
                streams.push({ ...stream, category });
              });
            });
            const event = streams.find(s => s.uri_name === uriName);
            if (!event || !event.streams || !Array.isArray(event.streams) || event.streams.length === 0) {
              throw new Error(`Stream not found for uri_name: ${uriName}`);
            }
            if (!event.name) {
              throw new Error('Missing required event fields');
            }
            eventTitle.innerText = event.name;
            streamData = event;
            playerContainer.classList.add('fade-in');
            populateStreamDropdown(event.streams);
            initPlayer(streamData, currentStreamIndex, errorContainer);
          })
          .catch(error => {
            console.error('API Fetch Error:', error.message, error.stack);
            eventTitle.innerText = 'Error: Stream Not Found';
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = error.message.includes('Stream not found')
              ? `The requested stream "${uriName}" was not found. Redirecting to 24/7 streams...`
              : 'Failed to load stream data: ' + error.message + '. Please try again.';
            set автомобилей

Timeout(() => window.location.href = '/24-7', 3000);

        try {

        errorContainer.innerText = 'An error occurred while initializing the page: ' + error.message + '. Please try again.';
      }
