    /* Big Screen Adaptation */
    .player-container {
      max-width: 1200px;

    .error-alert {
      max-width: 500px;

    .fade-out {

    @keyframes fadeOut {
      from { opacity: 1; }
      to { opacity: 0; }
    }
    .btn-fullscreen, .btn-cast {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 20px;
      margin-left: 10px;
      transition: transform 0.3s, background 0.3s;
      font-weight: 500;
    }
    [data-bs-theme="light"] .btn-fullscreen, [data-bs-theme="light"] .btn-cast {
      background: #e63939;
      color: #fff;
    }
    .btn-fullscreen:hover, .btn-cast:hover {
      transform: scale(1.05);
      background: #e63939;
      color: #fff;
    }
    .offcanvas {
      z-index: 1055 !important;

    .offcanvas-backdrop {

    .offcanvas .nav-link, .offcanvas .btn-link, .offcanvas button {

<body>

        <li class="nav-item"><button class="nav-link btn btn-link d-none" id="logoutButton">Logout</button></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>

  </div>
  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="row">
        <div class="col-12">
          <div class="d-flex align-items-center mb-3">
            <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back to 24/7 Streams</a>
            <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
          </div>
          <h2 id="eventTitle" class="mb-3"></h2>
          <div class="player-container">
            <div class="video-container">
              <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="width: 100%; height: 100%;" allow="autoplay; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation"></iframe>
              <div id="videoPlayerContainer" style="width: 100%; height: 100%;">
                <video id="videoPlayer" class="d-none" controls></video>
              </div>
            </div>
            <div class="stream-dropdown d-flex align-items-center justify-content-between mt-3">
              <div class="dropdown">
                <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                  Select Stream
                </button>
                <ul class="dropdown-menu" id="streamDropdownMenu" aria-labelledby="streamDropdown">
                </ul>
              </div>
              <button id="castBtn" class="btn btn-cast d-none"><i class="fas fa-tv"></i> Cast Stream</button>
            </div>
          </div>
          <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>
        </div>
      </div>
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary text-center text-lg-start">FutbolX 2026</p>
        <ul class="nav justify-content-center justify-content-lg-end mb-0">
          <li class="nav-item"><a href="https://discord.gg/CmRcPbBB2k" class="nav-link px-2 text-body-secondary">Discord</a></li>
        </ul>
      </footer>
    </div>
  </div>
  <script src="https://cdn.jwplayer.com/libraries/IDzF9Zmk.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
  <script defer src="/assets/js/api.js"></script>
  <script defer src="/assets/js/auth.js"></script>
  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    let embedPlayer = null;
    let videoPlayerInstance = null;
    let streamData = null;
    let currentStreamIndex = 0;

    const originalOpen = window.open;
    window.open = function(url) {
      console.log('Blocked popup attempt to:', url);
      return null;
    };

    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      if (!offcanvasElement || !toggler) return;
      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement, {
          backdrop: true,
          keyboard: true,
          scroll: false
        });
        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', () => {
            const href = link.getAttribute('href');
            if (href) {
              window.location.href = href;
              offcanvas.hide();
            }
          });
        });
      } catch (error) { console.error('Offcanvas error:', error); }
    }

    function initThemeToggle() {
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      if (!themeToggle || !htmlElement) return;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      themeToggle.addEventListener('click', () => {
        const currentTheme = htmlElement.getAttribute('data-bs-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        htmlElement.setAttribute('data-bs-theme', newTheme);
        localStorage.setItem('theme', newTheme);
        themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
      });
    }

    function recreateVideoElement(isM3U8) {
      const videoContainer = document.getElementById('videoPlayerContainer');
      if (!videoContainer) return null;
      videoContainer.innerHTML = '';
      const videoElement = isM3U8 ? document.createElement('div') : document.createElement('video');
      videoElement.id = 'videoPlayer';
      videoElement.className = isM3U8 ? 'jwplayer d-none' : 'd-none';
      if (!isM3U8) {
        videoElement.controls = true;
        videoElement.muted = true;
        videoElement.autoplay = true;
        videoElement.style.width = '100%';
        videoElement.style.height = '100%';
        videoElement.addEventListener('play', () => { videoElement.muted = false; });
      }
      videoContainer.appendChild(videoElement);
      return videoElement;
    }

    async function isM3U8Stream(url) {
      if (url.toLowerCase().includes('.m3u8')) return true;
      try {
        const response = await fetch(url, { method: 'GET', headers: { 'Range': 'bytes=0-1023' }, signal: AbortSignal.timeout(5000) });
        const content = await response.text();
        return content.includes('#EXTM3U');
      } catch (e) { return false; }
    }

    async function initPlayer(event, streamIndex, errorContainer) {
      try {
        clearError();
        embedPlayer = document.getElementById('embedPlayer');
        const videoContainer = document.getElementById('videoPlayerContainer');
        const stream = event.streams[streamIndex];
        const streamUrl = stream.url;
        const isM3U8 = await isM3U8Stream(streamUrl);
        
        if (isM3U8) {
          embedPlayer.style.display = 'none';
          let videoPlayer = document.getElementById('videoPlayer') || recreateVideoElement(true);
          videoPlayer.classList.remove('d-none');
          videoContainer.style.display = 'block';
          videoPlayerInstance = jwplayer('videoPlayer').setup({
            file: streamUrl, autostart: true, mute: true, width: '100%', aspectratio: '16:9', controls: true
          });
          videoPlayerInstance.on('ready', () => { videoPlayerInstance.play(); videoPlayerInstance.setMute(false); });
        } else {
          videoContainer.style.display = 'none';
          embedPlayer.style.display = 'block';
          if (videoPlayerInstance) { videoPlayerInstance.destroy(); videoPlayerInstance = null; recreateVideoElement(false); }
          embedPlayer.src = streamUrl + (streamUrl.includes('?') ? '&' : '?') + 'autoplay=1';
        }

        const fsBtn = document.getElementById('fullscreenBtn');
        const castBtn = document.getElementById('castBtn');
        [fsBtn, castBtn].forEach(btn => btn.classList.remove('d-none'));

        fsBtn.onclick = () => {
          const target = isM3U8 ? (videoPlayerInstance.getContainer ? videoPlayerInstance.getContainer() : document.getElementById('videoPlayer')) : embedPlayer;
          if (target.requestFullscreen) target.requestFullscreen();
          else if (target.webkitRequestFullscreen) target.webkitRequestFullscreen();
        };

        castBtn.onclick = () => {
          const target = isM3U8 ? document.querySelector('video') : embedPlayer;
          if (target.remote && target.remote.prompt) {
              target.remote.prompt();
          } else if (target.webkitShowPlaybackTargetPicker) {
              target.webkitShowPlaybackTargetPicker();
          } else {
              alert("Casting is not supported on this browser or device.");
          }
        };

      } catch (err) { errorContainer.classList.remove('d-none'); errorContainer.innerText = 'Error: ' + err.message; }
    }

    function populateStreamDropdown(streams) {
      const menu = document.getElementById('streamDropdownMenu');
      const btn = document.getElementById('streamDropdown');
      menu.innerHTML = '';
      streams.forEach((stream, index) => {
        const li = document.createElement('li');
        li.innerHTML = `<a class="dropdown-item" href="#">${stream.label || `Stream ${index + 1}`}</a>`;
        li.querySelector('a').onclick = (e) => {
          e.preventDefault();
          currentStreamIndex = index;
          btn.textContent = stream.label || `Stream ${index + 1}`;
          initPlayer(streamData, index, document.getElementById('errorContainer'));
        };
        menu.appendChild(li);
      });
      btn.textContent = streams[0].label || 'Stream 1';
    }

    function initPage() {
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(res => res.json()).then(data => {
        const streams = [];
        Object.keys(data.streams).forEach(cat => streams.push(...data.streams[cat]));
        const event = streams.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          populateStreamDropdown(event.streams);
          initPlayer(event, 0, document.getElementById('errorContainer'));
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      initThemeToggle();
      initOffcanvas();
      initPage();
    });
  </script>
</body>
</html>
