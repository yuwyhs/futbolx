  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };

    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'd-none error-alert';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    function showError(message) {
      const errorContainer = document.getElementById('errorContainer');
      errorContainer.className = 'alert alert-danger error-alert';
      errorContainer.innerHTML = message;
    }

    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(5000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(attempt, delay);
              } else {
                reject(error);
              }
            });
        }
        attempt();
      });
    }

    function loadStream(api) {
      console.log('Starting loadStream at', new Date().toISOString());
      const streamTitle = document.getElementById('streamTitle');
      const playerDiv = document.getElementById('player');
      const playerIframe = document.getElementById('player-iframe');
      const errorContainer = document.getElementById('errorContainer');

      const uriName = window.location.pathname.split('/').pop();
      streamTitle.innerText = 'Loading stream...';

      const apiUrl = api.baseUrl.endsWith('/') ? `${api.baseUrl}stream-24-7` : `${api.baseUrl}/stream-24-7`;
      fetchWithRetry(apiUrl)
        .then(streamData => {
          console.log('24/7 Stream API Response:', streamData);

          if (!streamData || !streamData.success || !Array.isArray(streamData.streams)) {
            showError('Invalid stream data received. Please try again.');
            streamTitle.innerText = 'Stream Not Found';
            return;
          }

          const stream = streamData.streams.find(s => s.uri_name === uriName);
          if (!stream || !stream.streams || !Array.isArray(stream.streams) || stream.streams.length === 0) {
            showError(`The requested stream "${uriName}" was not found. Please select another stream.`);
            streamTitle.innerText = 'Stream Not Found';
            return;
          }

          streamTitle.innerText = stream.name || '24/7 Stream';
          const streamUrl = stream.streams[0]; // Use the first stream URL

          if (streamUrl.endsWith('.m3u8')) {
            // Check if JW Player is available
            if (typeof jwplayer === 'undefined') {
              showError('JW Player library failed to load. Please refresh the page or try again later.');
              streamTitle.innerText = 'Stream Error';
              return;
            }
            // Use JW Player for .m3u8 streams
            playerIframe.classList.add('d-none');
            playerDiv.classList.remove('d-none');
            jwplayer('player').setup({
              file: streamUrl,
              width: '100%',
              aspectratio: '16:9',
              autostart: true,
              controls: true
            });
          } else {
            // Use iframe for other URLs
            playerDiv.classList.add('d-none');
            playerIframe.classList.remove('d-none');
            playerIframe.src = streamUrl;
          }
        })
        .catch(error => {
          console.error('API Fetch Error:', error.message);
          showError(`Failed to load stream: ${error.message}. Please try again.`);
          streamTitle.innerText = 'Stream Not Found';
        });
    }

    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      
      if (!offcanvasElement || !toggler) {
        console.error('Offcanvas or toggler not found');
        return;
      }

      console.log('Initializing offcanvas');
      if (typeof bootstrap === 'undefined') {
        console.warn('Bootstrap not loaded. Relying on data attributes.');
        return;
      }

      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement);
        offcanvasElement.addEventListener('hidden.bs.offcanvas', () => {
          console.log('Offcanvas closed');
        });

        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', (event) => {
            event.stopPropagation();
            const href = link.getAttribute('href');
            if (href) {
              console.log('Nav link clicked:', href);
              window.location.href = href;
            }
          });
        });

        const logoutButton = document.getElementById('logoutButton');
        if (logoutButton) {
          logoutButton.addEventListener('click', (event) => {
            event.stopPropagation();
            console.log('Logout button clicked');
            // Assume logout logic is in auth.js
          });
        }
      } catch (error) {
        console.error('Offcanvas initialization error:', error);
      }
    }

    function waitForJwplayer(callback) {
      if (typeof jwplayer !== 'undefined') {
        callback();
      } else {
        setTimeout(() => waitForJwplayer(callback), 100);
      }
    }

    function initPage() {
      console.log('Initializing page at', new Date().toISOString());
      const errorContainer = document.getElementById('errorContainer');
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;

      // Initialize theme
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      if (themeToggle) {
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        themeToggle.addEventListener('click', () => {
          console.log('Theme toggle clicked');
          const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });
      } else {
        console.error('Theme toggle element not found');
      }

      // Initialize offcanvas
      initOffcanvas();

      // Load stream after JW Player is ready
      try {
        if (typeof Api === 'undefined') {
          console.warn('Api class not defined. Using default API path.');
          apiInstance = { baseUrl: window.location.origin + '/api' };
        } else {
          apiInstance = new Api(`${window.location.origin}/api`);
        }
        waitForJwplayer(() => loadStream(apiInstance));
      } catch (error) {
        console.error('API initialization error:', error);
        showError('Failed to initialize stream. Please try again.');
        document.getElementById('streamTitle').innerText = 'Stream Error';
      }

      // Auth status
      try {
        checkAuthStatus();
      } catch (error) {
        console.warn('Auth status check failed:', error);
      }

      console.log('Page initialized successfully');
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded at', new Date().toISOString());
      initPage();
    });
  </script>
