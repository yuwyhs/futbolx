<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    .theater-container { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
    .main-player-col { flex: 1 1 65%; min-width: 350px; }
    .side-epg-col { flex: 1 1 30%; min-width: 320px; }

    .btn-control { display: inline-flex; align-items: center; justify-content: center; padding: 8px 16px; background: #ff4d4d; color: #fff; border: none; border-radius: 20px; transition: .3s; cursor: pointer; height: 40px; }
    .btn-control:hover { background: #e63939; }
    
    /* Fixed Cast Icon - Visible in all modes */
    .btn-cast-icon { width: 45px; background: #333; color: white !important; border: 1px solid #555; }
    .btn-cast-icon:hover { background: #444; }

    .video-container { position: relative; width: 100%; height: 0; padding-bottom: 56.25%; background: #000; border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
    #oplayer-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

    .plyr { --plyr-color-main: #ff4d4d; font-family: 'Kanit', sans-serif; height: 100%; }
    
    /* VERTICAL VOLUME - FIXED JUMPING */
    .plyr__volume { min-width: unset !important; position: relative !important; }
    .plyr__volume input[type=range] {
      position: absolute !important;
      bottom: 50px !important;
      left: 50% !important;
      transform: translateX(-50%) rotate(-90deg) !important;
      width: 100px !important;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease;
      z-index: 100;
    }
    .plyr__volume:hover input[type=range], .plyr__volume--active input[type=range] {
      opacity: 1;
      visibility: visible;
    }

    .plyr__menu__container [role=menu] { max-height: 180px; overflow-y: auto; }
    .disclaimer { text-align: center; font-size: 0.85rem; padding: 20px 15px; margin-top: 30px; border-top: 1px solid #444; color: #aaa; }
  </style>
</head>
<body>

  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler"><i class="fas fa-bars"></i></button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header"><h5 class="offcanvas-title">Menu</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button></div>
    <div class="offcanvas-body">
      <ul class="nav flex-column"><li class="nav-item"><a class="nav-link text-white" href="/">Home</a></li></ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="d-flex align-items-center mb-3 gap-2">
        <a href="/24-7" class="btn-control text-decoration-none"><i class="fas fa-arrow-left"></i> Back</a>
        <button id="fullscreenBtn" class="btn-control d-none"><i class="fas fa-expand"></i> Go Fullscreen</button>
      </div>

      <div class="theater-container">
        <div class="main-player-col">
          <h2 id="eventTitle" class="mb-3"></h2>
          <div class="video-container">
            <div id="oplayer-container" style="display:none;"><video id="plyr-player" playsinline controls crossorigin></video></div>
          </div>
          
          <div class="d-flex align-items-center mt-3 gap-3">
            <div class="dropdown">
              <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">Select Channel</button>
              <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
            </div>
            <button id="externalCastBtn" class="btn-control btn-cast-icon d-none"><i class="fas fa-cast"></i></button>
          </div>
        </div>
        <div class="side-epg-col"></div>
      </div>
      
      <footer class="container-fluid py-2 border-top mt-5 text-center">
        <p class="text-body-secondary">FutbolX 2026</p>
      </footer>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;

    // Fixed Sidebar Trigger
    document.getElementById('sidebarToggler').onclick = () => {
      const myOffcanvas = document.getElementById('sidebarMenu');
      const bsOffcanvas = new bootstrap.Offcanvas(myOffcanvas);
      bsOffcanvas.show();
    };

    function isHLS(url) { return url.includes('.m3u8'); }

    async function initPlayer(url) {
      const video = document.getElementById('plyr-player');
      if (player) player.destroy();
      if (hls) hls.destroy();

      document.getElementById('oplayer-container').style.display = 'block';

      if (isHLS(url) && Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          const qualities = hls.levels.map(l => l.height);
          player = new Plyr(video, {
            autoplay: true,
            controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
            quality: {
              default: 0,
              options: [0, ...qualities],
              forced: true,
              onChange: (q) => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); }
            }
          });

          player.on('ready', () => {
            // Fix "0p" Label
            player.config.quality.labels = { 0: 'Auto' };
            qualities.forEach(q => { player.config.quality.labels[q] = q + 'p'; });
            
            // Fix volume "self-increasing" by stopping click-to-mute on the container
            const volContainer = document.querySelector('.plyr__volume');
            volContainer.addEventListener('click', (e) => e.stopPropagation(), true);

            // Hide captions if empty
            if (video.textTracks.length === 0) {
              const capBtn = document.querySelector('.plyr__control[data-plyr="captions"]');
              if (capBtn) capBtn.style.display = 'none';
            }
          });
        });
      }
      document.getElementById('fullscreenBtn').classList.remove('d-none');
      document.getElementById('externalCastBtn').classList.remove('d-none');
    }

    document.getElementById('fullscreenBtn').onclick = () => player.fullscreen.enter();
    
    document.getElementById('externalCastBtn').onclick = () => {
      if (window.chrome && window.chrome.cast) {
        chrome.cast.requestSession(s => console.log("Success"), e => console.log("Error", e));
      } else {
        alert("Cast requires Chrome/Edge on a secure connection.");
      }
    };

    // Placeholder fetch logic (keeping your API structure)
    fetch('/api/stream-24-7').then(r => r.json()).then(data => {
      const menu = document.getElementById('streamDropdownMenu');
      // Logic to populate menu and call initPlayer(firstStreamUrl)
    });
  </script>
</body>
</html>
