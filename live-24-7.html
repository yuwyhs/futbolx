<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Watch 24/7</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin>
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
  <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>

  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* HIDE TIPS AS REQUESTED */
    .tip-container { display: none !important; }

    /* HIDE VOLUME BAR ONLY */
    .plyr__volume input[type=range] { display: none !important; }
    .plyr__volume { min-width: unset !important; }
    
    /* QUALITY MENU SCROLLABLE */
    .plyr__menu__container [role=menu] { max-height: 200px; overflow-y: auto; }

    /* EXTERNAL CAST TEXT */
    .btn-cast-link {
        color: #fff;
        text-decoration: none;
        font-weight: 500;
        margin-left: 15px;
        cursor: pointer;
        text-transform: uppercase;
        font-size: 0.9rem;
    }
    [data-bs-theme="light"] .btn-cast-link { color: #333; }

    /* FULLSCREEN BUTTON STYLE */
    .btn-fullscreen {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: #ff4d4d;
      color: #fff;
      border: none;
      border-radius: 20px;
      margin-left: 10px;
      transition: transform 0.3s, background 0.3s;
    }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container mt-4">
      <div class="d-flex align-items-center mb-3">
        <a href="/24-7" class="btn btn-back"><i class="fas fa-arrow-left"></i> Back</a>
        <button id="fullscreenBtn" class="btn btn-fullscreen ms-3 d-none">Go Fullscreen</button>
      </div>
      
      <h2 id="eventTitle" class="mb-3"></h2>
      
      <div class="player-container">
        <div class="video-container">
          <iframe id="embedPlayer" src="about:blank" frameborder="0" allowfullscreen style="width:100%; height:100%; display:none;"></iframe>
          <div id="videoPlayerContainer" style="width:100%; height:100%;">
            <video id="videoPlayer" playsinline controls crossorigin></video>
          </div>
        </div>
        
        <div class="stream-dropdown d-flex align-items-center">
          <div class="dropdown">
            <button class="btn btn-stream dropdown-toggle" type="button" id="streamDropdown" data-bs-toggle="dropdown">
              Select Stream
            </button>
            <ul class="dropdown-menu" id="streamDropdownMenu"></ul>
          </div>
          <span id="castTrigger" class="btn-cast-link d-none">Cast</span>
        </div>
      </div>

      <div id="errorContainer" class="alert alert-danger error-alert mt-3 d-none"></div>

      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
      </footer>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/js/bootstrap.bundle.min.js"></script>
  <script>
    let player = null;
    let hls = null;
    let streamData = null;

    // THEME TOGGLE FIX
    function initTheme() {
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        const currentTheme = localStorage.getItem('theme') || 'dark';
        html.setAttribute('data-bs-theme', currentTheme);
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        
        themeToggle.onclick = () => {
            const now = html.getAttribute('data-bs-theme');
            const next = now === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-bs-theme', next);
            localStorage.setItem('theme', next);
            themeToggle.innerHTML = next === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        };
    }

    function isM3U8(url) { return url.includes('.m3u8'); }

    async function initPlayer(event, index) {
      const url = event.streams[index].url;
      const video = document.getElementById('videoPlayer');
      const container = document.getElementById('videoPlayerContainer');
      const embed = document.getElementById('embedPlayer');

      if (player) player.destroy();
      if (hls) hls.destroy();

      if (isM3U8(url)) {
        embed.style.display = 'none';
        container.style.display = 'block';
        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(url);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            const qualities = hls.levels.map(l => l.height);
            player = new Plyr(video, {
              autoplay: true,
              controls: ['play-large', 'play', 'mute', 'volume', 'captions', 'settings', 'pip', 'fullscreen'],
              settings: ['quality', 'captions'],
              quality: {
                default: 0,
                options: [0, ...qualities],
                forced: true,
                onChange: (q) => { hls.currentLevel = q === 0 ? -1 : hls.levels.findIndex(l => l.height === q); }
              }
            });

            player.on('ready', () => {
              // QUALITY LABEL FIX
              const labels = { 0: 'Auto' };
              qualities.forEach(q => { labels[q] = q + 'p'; });
              player.config.quality.labels = labels;

              // VOLUME TOGGLE FIX
              const muteBtn = document.querySelector('.plyr__control[data-plyr="mute"]');
              if(muteBtn) {
                  muteBtn.addEventListener('click', (e) => {
                      e.preventDefault();
                      e.stopPropagation();
                      if (player.muted || player.volume === 0) {
                          player.muted = false;
                          player.volume = 1;
                      } else {
                          player.muted = true;
                      }
                  }, true);
              }
            });
            video.play().catch(() => { player.muted = true; video.play(); });
          });
        }
        document.getElementById('fullscreenBtn').classList.remove('d-none');
        document.getElementById('castTrigger').classList.remove('d-none');
      } else {
        container.style.display = 'none';
        embed.style.display = 'block';
        embed.src = url;
      }
    }

    // CAST FIX
    document.getElementById('castTrigger').onclick = () => {
        if (!window.chrome || !window.chrome.cast) return alert("Chrome/Edge required.");
        chrome.cast.requestSession(s => console.log("Cast success"), e => console.log(e));
    };

    document.getElementById('fullscreenBtn').onclick = () => player ? player.fullscreen.enter() : document.getElementById('embedPlayer').requestFullscreen();

    document.addEventListener('DOMContentLoaded', () => {
      initTheme();
      const uriName = window.location.pathname.split('/').pop();
      fetch('/api/stream-24-7').then(r => r.json()).then(data => {
        let all = [];
        Object.keys(data.streams).forEach(cat => all = all.concat(data.streams[cat]));
        const event = all.find(s => s.uri_name === uriName);
        if (event) {
          document.getElementById('eventTitle').innerText = event.name;
          streamData = event;
          const menu = document.getElementById('streamDropdownMenu');
          menu.innerHTML = event.streams.map((s, i) => `<li><a class="dropdown-item" href="#" data-index="${i}">${s.label || 'Stream '+(i+1)}</a></li>`).join('');
          menu.querySelectorAll('.dropdown-item').forEach(item => {
            item.onclick = (e) => {
                e.preventDefault();
                initPlayer(streamData, item.dataset.index);
                document.getElementById('streamDropdown').textContent = item.textContent;
            };
          });
          initPlayer(streamData, 0);
        }
      });
    });
  </script>
</body>
</html>
