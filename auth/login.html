<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - Login</title>
  <meta name="description" content="Login to FutbolX - Free PPV boxing, UFC, Basketball, Football, and more.">

  <!-- Keep exactly the same meta, fonts, css as index.html -->
  <meta name="keywords" content="futbolx, ppv, free ppv, boxing, ufc, basketball, football, stream, online, free">
  <meta property="og:title" content="FutbolX - Login" />
  <meta property="og:url" content="https://futbol-x.site/auth/login" />
  <meta property="og:image" content="/assets/img/og-image.jpg">
  <meta name="twitter:title" content="FutbolX - Login">
  <meta name="twitter:description" content="Login to access free PPV streams and more.">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css" integrity="sha512-Z/def5z5u2aR89OuzYcxmDJ0Bnd5V1cKqBEbvLOiUNWdg9PQeXVvXLI90SE4QOHGlfLqUnDNVAYyZi8UwUTmWQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="/assets/css/main.css?v=26">

  <!-- Same card animation and responsive grid styles -->
  <style>
    .error-alert { max-width: 500px; margin: 20px auto; }
    .card { 
      opacity: 0; 
      transform: translateY(50px); 
      transition: opacity 0.6s ease-out, transform 0.6s ease-out; 
    }
    .card.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }
    .fade-out { 
      animation: fadeOut 0.5s ease-out forwards; 
    }
    @keyframes fadeOut { 
      from { opacity: 1; } 
      to { opacity: 0; }
    }
    /* Form container styling to match site feel */
    .auth-container {
      max-width: 460px;
      margin: 3rem auto;
      padding: 2.5rem;
      background: #1e1e1e;
      border-radius: 12px;
      border: 1px solid #333;
      box-shadow: 0 8px 30px rgba(0,0,0,0.6);
    }
    .auth-title {
      font-size: 2rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .form-label {
      font-weight: 500;
    }
    .btn-auth {
      font-size: 1.1rem;
      padding: 0.75rem;
    }
  </style>
</head>
<body>

  <!-- Top Bar – identical -->
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <!-- Sidebar – identical, including login/logout -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link active" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item"><button class="nav-link btn btn-link d-none" id="logoutButton">Logout</button></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link" aria-label="Toggle theme">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Main content area – same layout structure -->
  <div class="container-fluid main-content">
    <div class="text-center py-5 bg-dark hero-background">
      <h1 class="display-4 fw-bold">FutbolX Account</h1>
      <p class="lead">Login to access all streams and features</p>
    </div>

    <div class="container pt-4 pb-5">
      <div id="errorContainer" class="d-none error-alert alert alert-danger"></div>

      <div class="auth-container">
        <h2 class="auth-title">Sign In</h2>
        
        <form id="loginForm">
          <div class="mb-4">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control form-control-lg" id="email" placeholder="you@example.com" required>
          </div>
          
          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" id="password" required>
          </div>

          <button type="submit" class="btn btn-danger btn-lg w-100 btn-auth">Login</button>
        </form>

        <div class="text-center mt-4">
          <p class="text-muted">
            Don't have an account? 
            <a href="#" class="text-danger" id="switchToSignup">Sign up here</a>
          </p>
          <p class="text-muted small mt-3">
            <a href="#" class="text-muted">Forgot password?</a>
          </p>
        </div>
      </div>

      <!-- Footer – identical -->
      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary text-center text-lg-start">FutbolX 2026</p>
        <ul class="nav justify-content-center justify-content-lg-end mb-0">
          <li class="nav-item">
            <a href="/vip" class="nav-link px-2 text-body-secondary">Donate / VIP Access</a>
          </li>
        </ul>
      </footer>
    </div>
  </div>

  <!-- Discord floating button – identical -->
  <a href="https://discord.gg/UzHzerb6XY" target="_blank" rel="noopener" id="discordBtn">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQeN56pzA4LKgAiLZ8zrvSqhPhTy-WAUWHywdrFq0CjSg&s=10" 
         alt="Join Discord" width="48" height="48">
  </a>

  <!-- Scripts – keep only what's needed for layout -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

  <!-- Theme toggle & sidebar behavior (copied from index) -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Theme toggle
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      
      if (themeToggle) {
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        themeToggle.addEventListener('click', () => {
          const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });
      }

      // Optional: placeholder for form submit (we'll connect Firebase next)
      document.getElementById('loginForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        alert('Login functionality will be added in the next step.');
      });

      // Switch to signup link (placeholder)
      document.getElementById('switchToSignup')?.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Signup form will be added soon.');
      });
    });
  </script>
</body>
</html>
