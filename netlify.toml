[build]
  # No build step needed (your site is already static HTML + assets)
  # If you later add a build command (e.g. npm run build), change this
  command = ""
  # Root of your project contains index.html, assets/, api/, etc.
  publish = "."

[functions]
  # Keeps your existing api/*.js files exactly where they are
  # Netlify will automatically turn every api/*.js into a serverless function
  # (api/*.json files stay as static files — no conflict)
  directory = "api"

# ====================== REDIRECTS / REWRITES ======================
# Order matters! Netlify checks top-to-bottom (first match wins)

[[redirects]]
  from = "/api/stream"
  to = "/api/stream.json"
  status = 200

[[redirects]]
  from = "/api/stream-24-7"
  to = "/api/stream-24-7.json"
  status = 200

# All other /api/* routes go to your Node.js functions (api/*.js)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Clean URLs for pages (exactly like your Vercel routes)
[[redirects]]
  from = "/auth/login"
  to = "/auth/login.html"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/auth/signup.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/vip"
  to = "/vip.html"
  status = 200

[[redirects]]
  from = "/24-7"
  to = "/24-7.html"
  status = 200

# Dynamic routes
[[redirects]]
  from = "/live/*"
  to = "/live.html"
  status = 200

[[redirects]]
  from = "/live-24-7/*"
  to = "/live-24-7.html"
  status = 200

# Final SPA fallback (catch everything else)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
