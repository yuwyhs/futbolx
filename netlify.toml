[build]
  command = "" 
  publish = "."
  functions = "api"

[[redirects]]
  from = "/api/stream"
  to = "/api/stream.json"
  status = 200

[[redirects]]
  from = "/api/stream-24-7"
  to = "/api/stream-24-7.json"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/auth/login"
  to = "/auth/login.html"
  status = 200

[[redirects]]
  from = "/auth/signup"
  to = "/auth/signup.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/live/*"
  to = "/live.html"
  status = 200

[[redirects]]
  from = "/live-24-7/*"
  to = "/live-24-7.html"
  status = 200

[[redirects]]
  from = "/vip"
  to = "/vip.html"
  status = 200

[[redirects]]
  from = "/24-7"
  to = "/24-7.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
