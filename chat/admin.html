<!-- MODERATION DASHBOARD MODAL - UNCHANGED -->
  <div class="modal fade admin-dashboard-modal" id="adminDashboardModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
          <div class="modal-content">
              <div class="modal-header border-bottom border-secondary">
                  <h5 class="modal-title text-fx-accent" id="dashTitle">
                      <i class="fas fa-shield-alt me-2"></i> FutbolX Moderation Dashboard
                  </h5>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body">
                  <ul class="nav nav-tabs mb-3">
                      <li class="nav-item">
                          <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabMembers">Members List</button>
                      </li>
                      <li class="nav-item">
                          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabMod">Room Actions</button>
                      </li>
                      <li class="nav-item owner-only-tab">
                          <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabAnnouncements">Announcements</button>
                      </li>
                  </ul>
                  <div class="tab-content">
                      <div class="tab-pane fade show active" id="tabMembers">
                          <div class="mb-3">
                              <input type="text" id="memberSearchInput" class="form-control form-control-sm bg-dark text-white border-secondary" placeholder="Search members by username or IP...">
                          </div>
                          <div id="adminMemberList" class="list-group" style="max-height:320px; overflow-y:auto;"></div>
                      </div>
                      <div class="tab-pane fade" id="tabMod">
                          <div class="d-flex flex-column gap-3">
                              <div>
                                  <h6>Chat Lock State</h6>
                                  <button id="toggleChatClosedBtn" class="btn btn-sm btn-warning" onclick="toggleChatClosedState()"></button>
                                  <small class="text-muted d-block mt-1">Closing chat prevents normal users from typing. Mods & Owner can still speak.</small>
                              </div>
                              <hr class="border-secondary my-1">
                              <div>
                                  <h6>Slow Mode Control</h6>
                                  <div class="d-flex align-items-center gap-2">
                                      <select id="slowModeSelect" class="form-select form-select-sm bg-dark text-white border-secondary" style="width: auto;">
                                          <option value="0">Disabled (0s)</option>
                                          <option value="3">3 Seconds</option>
                                          <option value="5">5 Seconds</option>
                                          <option value="10">10 Seconds</option>
                                          <option value="30">30 Seconds</option>
                                      </select>
                                      <button class="btn btn-sm btn-fx-accent" onclick="saveSlowModeSetting()">Apply Slow Mode</button>
                                  </div>
                              </div>
                              <hr class="border-secondary my-1">
                              <div>
                                  <h6>Room History</h6>
                                  <button class="btn btn-sm btn-fx-accent" onclick="clearAllChat()">
                                      <i class="fas fa-trash me-1"></i> Clear Room Chat
                                  </button>
                              </div>
                          </div>
                      </div>
                      <div class="tab-pane fade owner-only-tab" id="tabAnnouncements">
                          <textarea id="announcementInput" class="form-control form-control-sm mb-2" rows="2" placeholder="Broadcast message..."></textarea>
                          <button class="btn btn-sm btn-fx-accent" onclick="publishAnnouncement()">Publish Banner</button>
                          <button class="btn btn-sm btn-outline-secondary ms-2" onclick="dismissAnnouncement()">Clear Banner</button>
                      </div>
                  </div>
              </div>
          </div>
      </div>
  </div>

  <!-- MEMBER ACTION MODAL - UNCHANGED -->
  <div class="modal fade" id="memberActionModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-sm">
          <div class="modal-content bg-dark border border-secondary text-white">
              <div class="modal-header border-bottom border-secondary py-2">
                  <h6 class="modal-title text-fx-accent" id="actionModalUsername">User Options</h6>
                  <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
              </div>
              <div class="modal-body d-flex flex-column gap-2" id="memberActionButtons"></div>
          </div>
      </div>
  </div>
