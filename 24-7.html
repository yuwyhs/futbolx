<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* 1. FORCED 3-COLUMN LAYOUT */
    .event-grid {
      display: grid;
      gap: 1.5rem;
      padding: 1rem;
      grid-template-columns: 1fr; /* Mobile */
    }
    @media (min-width: 768px) {
      .event-grid { grid-template-columns: repeat(2, 1fr); } /* Tablet */
    }
    @media (min-width: 992px) {
      .event-grid { 
        /* FORCED 3 COLUMNS */
        grid-template-columns: repeat(3, 1fr) !important; 
      }
    }

    /* 2. ORIGINAL SITE UI RESTORED */
    .top-bar { 
      background: linear-gradient(90deg, #c53030 0%, #000000 100%); 
      height: 60px;
    }
    .futbolx-brand { font-weight: 800; font-size: 1.5rem; color: white; margin-left: 10px; }
    
    /* Card Styles from your original code */
    .card {
      width: 100%;
      margin: 0 auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #1a1d21;
      opacity: 0; transform: translateY(50px);
    }
    .card.visible { opacity: 1; transform: translateY(0); transition: 0.6s ease-out; }
    .card:hover { transform: translateY(-8px); border-color: #ff4d4d; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    
    .card-img-top { height: 220px; object-fit: cover; }
    .card-title { font-size: 1.3rem; color: #3b82f6; margin-bottom: 0.5rem; }
    
    .live-badge {
      position: absolute; top: 10px; right: 10px;
      background: #dc3545; color: white; padding: 2px 10px;
      border-radius: 15px; font-size: 0.75rem; font-weight: bold; z-index: 5;
    }
    .watch-button {
      background-color: #c53030; color: white; border: none;
      padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.95rem; float: right;
    }

    /* Sidebar Styling */
    .offcanvas { background-color: #111; width: 280px !important; }
    .nav-link { color: #ccc !important; font-size: 1.1rem; padding: 12px 20px; border-bottom: 1px solid #222; }
    .nav-link:hover { background: #222; color: white !important; }
  </style>
</head>
<body>

  <nav class="top-bar fixed-top d-flex align-items-center px-3">
    <button class="btn btn-dark" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
      <i class="fas fa-bars"></i>
    </button>
    <span class="futbolx-brand">FutbolX</span>
  </nav>

  <div class="offcanvas offcanvas-start" id="sidebarMenu">
    <div class="offcanvas-header border-bottom">
      <h5 class="text-white mb-0">Navigation</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body p-0">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/"><i class="fas fa-home me-2"></i> Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request"><i class="fas fa-paper-plane me-2"></i> Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods"><i class="fas fa-film me-2"></i> VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7"><i class="fas fa-clock me-2"></i> 24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k"><i class="fab fa-discord me-2"></i> Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip"><i class="fas fa-gem me-2"></i> VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login"><i class="fas fa-user me-2"></i> Login</a></li>
      </ul>
    </div>
  </div>

  <div class="container-fluid mt-5 pt-4">
    <div class="text-center my-4">
      <div class="dropdown">
        <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown">
          Select Category
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#" data-category="All">All</a></li>
          <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
          <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
          <li><a class="dropdown-item" href="#" data-category="Kids">Kids</a></li>
          <li><a class="dropdown-item" href="#" data-category="Music">Music</a></li>
          <li><a class="dropdown-item" href="#" data-category="Movies VOD">Movies VOD</a></li>
          <li><a class="dropdown-item" href="#" data-category="News">News</a></li>
          <li><a class="dropdown-item" href="#" data-category="Religion">Religion</a></li>
          <li><a class="dropdown-item" href="#" data-category="Anime">Anime</a></li>
        </ul>
      </div>
    </div>

    <div id="livecards" class="event-grid">
      <p class="text-center">Loading streams...</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allStreams = [];

    function renderStreams(streams) {
      const container = document.getElementById('livecards');
      container.innerHTML = '';
      
      streams.forEach(stream => {
        const poster = stream.poster || 'https://via.placeholder.com/285x160?text=FutbolX';
        container.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}" style="text-decoration:none">
            <div class="card">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}">
              <div class="card-body">
                <h5 class="card-title">${stream.name}</h5>
                <div>
                  <span style="color:#888">${stream.category}</span>
                  <button class="watch-button">Watch</button>
                </div>
              </div>
            </div>
          </a>`;
      });

      // Original visibility animation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if(e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card').forEach(c => observer.observe(c));
    }

    function loadContent() {
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            allStreams = [];
            Object.keys(data.streams).forEach(cat => {
              data.streams[cat].forEach(s => allStreams.push({...s, category: cat}));
            });
            renderStreams(allStreams);
          }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          const cat = e.target.getAttribute('data-category');
          document.getElementById('categoryDropdown').textContent = cat;
          renderStreams(cat === 'All' ? allStreams : allStreams.filter(s => s.category === cat));
        });
      });
    });
  </script>
</body>
</html>
