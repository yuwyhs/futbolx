<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* 1. GRID ARRANGEMENT: FIXED FOR 3 COLUMNS */
    .event-grid, #livecards.event-grid {
      display: grid;
      gap: 1.5rem;
      padding: 1rem 0;
      grid-template-columns: 1fr; /* Mobile */
    }

    @media (min-width: 768px) {
      .event-grid, #livecards.event-grid {
        grid-template-columns: repeat(2, 1fr); /* Tablet */
      }
    }

    @media (min-width: 1100px) {
      .event-grid, #livecards.event-grid {
        /* This forces 3 columns like the reference image */
        grid-template-columns: repeat(3, 1fr); 
      }
    }

    /* 2. ORIGINAL CARD DESIGN RESTORED */
    .event-grid a { text-decoration: none; color: inherit; }
    
    .card {
      width: 100%;
      /* Removed strict max-width to allow 3-column fit */
      margin: 0 auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #1a1d21;
      opacity: 0; 
      transform: translateY(50px); 
    }

    .card.visible { 
      opacity: 1; 
      transform: translateY(0); 
      transition: opacity 0.6s ease-out, transform 0.6s ease-out; 
    }

    .card:hover {
      transform: translateY(-8px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
      border-color: #ff4d4d;
    }

    /* Original Image Aspect Ratio */
    .card-img-top {
      height: 220px;
      object-fit: cover;
    }

    .card-body { padding: 1rem; }
    
    .card-title {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #3b82f6; /* Blue title from your site */
    }

    /* LIVE BADGE RESTORED */
    .live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #ff4d4d;
      color: white;
      padding: 2px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 5;
    }

    /* WATCH BUTTON RESTORED */
    .watch-button {
      font-size: 0.95rem;
      padding: 0.5rem 1.2rem;
      background-color: #c53030;
      border: none;
      border-radius: 8px;
      color: white;
      float: right;
    }

    .event-tag { font-size: 0.95rem; color: #888; }
    .category-dropdown { display: flex; justify-content: center; margin: 1rem 0; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="container-fluid main-content pt-5">
    <div class="container">
      <div class="category-dropdown">
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown">
            Select Category
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-category="All">All</a></li>
            <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
            <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
            <li><a class="dropdown-item" href="#" data-category="Kids">Kids</a></li>
            <li><a class="dropdown-item" href="#" data-category="Music">Music</a></li>
            <li><a class="dropdown-item" href="#" data-category="Movies VOD">Movies VOD</a></li>
            <li><a class="dropdown-item" href="#" data-category="News">News</a></li>
            <li><a class="dropdown-item" href="#" data-category="Religion">Religion</a></li>
            <li><a class="dropdown-item" href="#" data-category="Anime">Anime</a></li>
            <li><a class="dropdown-item" href="#" data-category="Movies Live">Movies Live</a></li>
          </ul>
        </div>
      </div>

      <div id="live" class="mt-4">
        <h2>24/7 Streams <span id="liveAnimation" class="live-animation"></span></h2>
        <div id="livecards" class="event-grid">
          <p>Loading streams...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allStreams = [];

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      livecards.innerHTML = '';

      if (streams.length === 0) {
        livecards.innerHTML = '<p>No streams available.</p>';
        return;
      }

      streams.forEach(stream => {
        let poster = stream.poster || 'https://via.placeholder.com/285x160?text=FutbolX';
        livecards.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}">
            <div class="card">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy">
              <div class="card-body">
                <h5 class="card-title">${stream.name}</h5>
                <p class="card-text">
                  <span class="event-tag">${stream.category}</span>
                  <button class="watch-button">Watch</button>
                </p>
              </div>
            </div>
          </a>`;
      });

      // Observer for scroll animation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    // Fixed filtering logic
    function initCategoryDropdown() {
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const category = item.getAttribute('data-category');
          document.getElementById('categoryDropdown').textContent = category;
          
          const filtered = (category === 'All') 
            ? allStreams 
            : allStreams.filter(s => s.category === category);
          
          renderStreams(filtered);
        });
      });
    }

    function loadContent() {
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            allStreams = [];
            Object.keys(data.streams).forEach(cat => {
              data.streams[cat].forEach(s => allStreams.push({...s, category: cat}));
            });
            renderStreams(allStreams);
          }
        }).catch(err => console.error(err));
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      initCategoryDropdown();
    });
  </script>
</body>
</html>
