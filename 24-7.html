<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX • 24/7 Streams</title>
  <meta name="description" content="FutbolX - Watch 24/7 live sports streams including boxing, UFC, Basketball, Football, and more.">

  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:300,400,500,600,700,800,900" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" integrity="sha512-jnSuA4Ss2PkkikSOLtYs8BlYIeeIK1h99ty4YfvRPAlzr377vr3CXDb7sb7nVjiIVsz47i0zVxGEz0SiCKA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root {
      --bg-main: #0b0b10;
      --bg-card: #111118;
      --accent: #e63946;
      --accent-dark: #c51d2e;
      --accent-glow: rgba(230, 57, 70, 0.4);
      --text-main: #f0f0f5;
      --text-muted: #a8a8c0;
    }

    body {
      background: var(--bg-main);
      color: var(--text-main);
      font-family: 'Kanit', sans-serif;
    }

    /* Top bar */
    .top-bar {
      background: rgba(15, 15, 25, 0.92);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(230, 57, 70, 0.15);
      height: 58px;
      z-index: 1030;
    }

    .futbolx-brand {
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.8px;
      background: linear-gradient(90deg, #ff5e6b, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Category selector - sticky */
    .category-bar {
      position: sticky;
      top: 58px;
      z-index: 1020;
      background: rgba(11, 11, 16, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(230, 57, 70, 0.12);
      padding: 1rem 0;
    }

    /* Cards */
    .event-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.6rem;
      padding: 1.5rem 1rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid rgba(230, 57, 70, 0.08);
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s ease;
      box-shadow: 0 6px 22px rgba(0,0,0,0.45);
      position: relative;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 18px 48px rgba(0,0,0,0.6),
                  0 0 0 2px var(--accent-glow);
      border-color: rgba(230, 57, 70, 0.45);
    }

    .card-img-top {
      height: 175px;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .card:hover .card-img-top {
      transform: scale(1.07);
    }

    .live-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: var(--accent);
      color: white;
      padding: 0.4rem 1rem;
      border-radius: 50px;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      box-shadow: 0 3px 14px rgba(230, 57, 70, 0.65);
      animation: pulse 2.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50%      { transform: scale(1.04); opacity: 0.92; }
    }

    .card-body {
      padding: 1.1rem;
    }

    .card-title {
      font-size: 1.32rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      line-height: 1.28;
    }

    .event-tag {
      font-size: 0.96rem;
      color: var(--text-muted);
      background: rgba(230,57,70,0.08);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
    }

    .btn-watch {
      border-radius: 50px;
      font-weight: 600;
      padding: 0.55rem 1.5rem;
      transition: all 0.25s ease;
    }

    .btn-watch:hover {
      transform: translateY(-2px);
    }

    /* Snow - much lighter & elegant */
    #snow-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }

    .snow {
      position: absolute;
      color: rgba(255,255,255,0.25);
      font-size: 1.1rem;
      animation: fall linear infinite;
      user-select: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh); }
    }

    @media (min-width: 768px) {
      .event-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
    }

    @media (min-width: 1200px) {
      .event-grid { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <nav class="top-bar fixed-top">
    <div class="container-fluid h-100 px-3 d-flex align-items-center">
      <button class="btn btn-dark border-0 me-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars fa-lg"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu" aria-labelledby="sidebarMenuLabel">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title" id="sidebarMenuLabel">FutbolX</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link py-3" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link py-3" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link py-3" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link py-3 active" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link py-3" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link py-3 text-danger fw-bold" href="/vip">VIP</a></li>
        <li class="nav-item mt-4">
          <button id="themeToggle" class="btn btn-link nav-link" aria-label="Toggle theme">
            <i class="fas fa-moon"></i> Theme
          </button>
        </li>
      </ul>
    </div>
  </div>

  <!-- Category Selector (sticky) -->
  <div class="category-bar">
    <div class="container-fluid px-3 text-center">
      <div class="dropdown d-inline-block">
        <button class="btn btn-outline-light dropdown-toggle px-5 py-2 fw-medium" type="button" id="categoryDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          Select Category
        </button>
        <ul class="dropdown-menu dropdown-menu-dark shadow-lg" aria-labelledby="categoryDropdown">
          <li><a class="dropdown-item" href="#" data-category="all">All Channels</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
          <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
          <li><a class="dropdown-item" href="#" data-category="Music">Music</a></li>
          <li><a class="dropdown-item" href="#" data-category="Movies VOD">Movies VOD</a></li>
          <li><a class="dropdown-item" href="#" data-category="News">News</a></li>
          <li><a class="dropdown-item" href="#" data-category="Anime">Anime</a></li>
          <li><a class="dropdown-item" href="#" data-category="Movies Live">Movies Live</a></li>
        </ul>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <main class="container-fluid pt-4 pb-5">
    <div id="errorContainer" class="alert alert-danger d-none mx-3 my-3"></div>

    <div id="livecards" class="event-grid">
      <!-- cards loaded here by JS -->
    </div>
  </main>

  <!-- Snow container -->
  <div id="snow-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Your existing scripts (api.js, auth.js, etc.) should still work -->
  <!-- Just keep your original JS logic for loading and rendering cards -->

  <script>
    // Light elegant snow
    function initSnow() {
      const container = document.getElementById('snow-container');
      const symbols = ['❄︎', '✦', '✧', '❅'];
      for (let i = 0; i < 28; i++) {
        const el = document.createElement('div');
        el.className = 'snow';
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (Math.random() * 20 + 18) + 's';
        el.style.opacity = Math.random() * 0.4 + 0.25;
        el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
        container.appendChild(el);
      }
    }

    window.addEventListener('load', initSnow);
  </script>

</body>
</html>
