    .error-alert { max-width: 500px; margin: 20px auto; }
    .card { 
      opacity: 0; 
      transform: translateY(50px); 
      transition: opacity 0.6s ease-out, transform 0.6s ease-out; 
    }
    .card.visible { 
      opacity: 1; 
      transform: translateY(0); 
    }
    .fade-out { 
      animation: fadeOut 0.5s ease-out forwards; 
    }
    @keyframes fadeOut { 
      from { opacity: 1; } 
      to { opacity: 0; } 
    }
    .watch-button {
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    /* Flexible grid layout for all screen sizes */

    .card {
      width: 100%;

      border-radius: 10px;

    .card:hover {

    }
    [data-bs-theme="light"] .card:hover {

    }
    .card-img-top {

    .card-body {

    .card-title {

    /* Dropdown styling */

    .category-dropdown .dropdown-menu {
      background-color: var(--bs-body-bg);

    }
    .category-dropdown .dropdown-item:hover {
      background-color: var(--bs-primary);

    }
    /* Media queries for larger screens */

        max-width: 350px;
      }
      .event-grid {
        gap: 2rem;
      }
    }
    @media (min-width: 1800px) {
      .card {
        max-width: 320px;
      }
      .event-grid {
        gap: 2.5rem;
      }
    }

  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };

    let apiInstance = null;
    let allStreams = [];

    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'd-none error-alert';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }

    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(attempt, delay);
              } else {
                console.error('All fetch attempts failed:', error);
                reject(error);
              }
            });
        }
        attempt();
      });
    }

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      const liveAnimation = document.getElementById('liveAnimation');
      livecards.innerHTML = '';

      if (streams.length === 0) {
        livecards.innerHTML = '<p>No streams available for this category.</p>';
        liveAnimation.classList.add('d-none');
        return;
      }

      streams.forEach(stream => {
        let poster = stream.poster && stream.poster !== '' ? stream.poster : 'https://via.placeholder.com/285x160?text=FutbolX';
        let streamHtml = `
          <a href="/live-24-7/${stream.uri_name}">
            <div class="card">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy" onerror="this.src='https://via.placeholder.com/285x160?text=Image+Failed';">
              <div class="card-body">
                <h5 class="card-title">${stream.name}</h5>
                <p class="card-text">
                  <span class="event-tag">${stream.tag}</span>
                  <span class="event-timer">
                    <a href="/live-24-7/${stream.uri_name}" class="btn btn-danger btn-sm watch-button">Watch</a>
                  </span>
                </p>
              </div>
            </div>
          </a>`;
        livecards.innerHTML += streamHtml;
      });

      liveAnimation.classList.remove('d-none');
      const cards = document.querySelectorAll('.card');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      cards.forEach(card => observer.observe(card));
    }

    function loadContent() {
      console.log('Starting loadContent at', new Date().toISOString());
      const errorContainer = document.getElementById('errorContainer');
      const livecards = document.getElementById('livecards');
      const liveAnimation = document.getElementById('liveAnimation');

      errorContainer.className = 'd-none error-alert';
      errorContainer.innerHTML = '';
      livecards.innerHTML = '<p>Loading streams...</p>';

      const timeout = setTimeout(() => {
        if (livecards.innerHTML.includes('Loading streams...')) {
          livecards.innerHTML = '<p>Failed to load streams. <button id="retryButton" class="btn btn-primary btn-sm">Retry</button></p>';
          errorContainer.className = 'alert alert-danger error-alert';
          errorContainer.innerHTML = 'Request timed out. Please check your connection or try again.';
          const retryButton = document.getElementById('retryButton');
          if (retryButton) {
            retryButton.addEventListener('click', () => loadContent());
          }
        }
      }, 15000);

      const apiUrl = '/api/stream-24-7';
      fetchWithRetry(apiUrl)
        .then(data => {
          clearTimeout(timeout);
          console.log('24/7 Stream API Response:', data);

          if (!data || !data.success) {
            console.warn('Invalid stream data received:', data);
            livecards.innerHTML = '<p>No streams are available right now. <button id="retryButton" class="btn btn-primary btn-sm">Retry</button></p>';
            liveAnimation.classList.add('d-none');
            errorContainer.className = 'alert alert-danger error-alert';
            errorContainer.innerHTML = 'Invalid stream data received. Please try again.';
            const retryButton = document.getElementById('retryButton');
            if (retryButton) {
              retryButton.addEventListener('click', () => loadContent());
            }
            return;
          }

          // Flatten categorized streams into a single array
          allStreams = [];
          Object.keys(data.streams).forEach(category => {
            data.streams[category].forEach(stream => {
              allStreams.push({ ...stream, category });
            });
          });

          allStreams = allStreams.filter(stream => 
            stream.name && stream.uri_name && stream.tag && stream.streams && Array.isArray(stream.streams)
          );
          renderStreams(allStreams); // Default to all streams
        })
        .catch(error => {
          clearTimeout(timeout);
          console.error('API Fetch Error:', error.message, error.stack);
          livecards.innerHTML = '<p>Failed to load streams. <button id="retryButton" class="btn btn-primary btn-sm">Retry</button></p>';
          liveAnimation.classList.add('d-none');
          errorContainer.className = 'alert alert-danger error-alert';
          errorContainer.innerHTML = `Failed to load streams: ${error.message}. Please check your connection or try again.`;
          const retryButton = document.getElementById('retryButton');
          if (retryButton) {
            retryButton.addEventListener('click', () => loadContent());
          }
        });
    }

    function initOffcanvas() {
      const offcanvasElement = document.getElementById('sidebarMenu');
      const toggler = document.getElementById('sidebarToggler');
      
      if (!offcanvasElement || !toggler) {
        console.error('Offcanvas or toggler not found');
        return;
      }

      console.log('Initializing offcanvas');
      if (typeof bootstrap === 'undefined') {
        console.warn('Bootstrap not loaded. Relying on data attributes.');
        return;
      }

      try {
        const offcanvas = new bootstrap.Offcanvas(offcanvasElement);
        offcanvasElement.addEventListener('hidden.bs.offcanvas', () => {
          console.log('Offcanvas closed');
        });

        const navLinks = offcanvasElement.querySelectorAll('.nav-link');
        navLinks.forEach(link => {
          link.addEventListener('click', (event) => {
            event.stopPropagation();
            const href = link.getAttribute('href');
            if (href) {
              console.log('Nav link clicked:', href);
              window.location.href = href;
            }
          });
        });

        const logoutButton = document.getElementById('logoutButton');
        if (logoutButton) {
          logoutButton.addEventListener('click', (event) => {
            event.stopPropagation();
            console.log('Logout button clicked');
            // Assume logout logic is in auth.js
          });
        }
      } catch (error) {
        console.error('Offcanvas initialization error:', error);
      }
    }

    function initCategoryDropdown() {
      const dropdownItems = document.querySelectorAll('.dropdown-item');
      const dropdownButton = document.getElementById('categoryDropdown');

      dropdownItems.forEach(item => {
        item.addEventListener('click', (event) => {
          event.preventDefault();
          const category = item.getAttribute('data-category');
          dropdownButton.textContent = category;
          const filteredStreams = category === 'All' 
            ? allStreams 
            : allStreams.filter(stream => stream.category === category);
          renderStreams(filteredStreams);
        });
      });
    }

    function initPage() {
      console.log('Initializing page at', new Date().toISOString());
      const errorContainer = document.getElementById('errorContainer');
      const livecards = document.getElementById('livecards');
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;

      // Initialize theme
      const currentTheme = localStorage.getItem('theme') || 'dark';
      htmlElement.setAttribute('data-bs-theme', currentTheme);
      if (themeToggle) {
        themeToggle.innerHTML = currentTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        themeToggle.addEventListener('click', () => {
          console.log('Theme toggle clicked');
          const newTheme = htmlElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
          htmlElement.setAttribute('data-bs-theme', newTheme);
          localStorage.setItem('theme', newTheme);
          themeToggle.innerHTML = newTheme === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
        });
      } else {
        console.error('Theme toggle element not found');
      }

      // Initialize offcanvas
      initOffcanvas();

      // Initialize category dropdown
      initCategoryDropdown();

      // Load content
      try {
        loadContent();
      } catch (error) {
        console.error('Load content error:', error, error.stack);
        livecards.innerHTML = '<p>Failed to load streams. <button id="retryButton" class="btn btn-primary btn-sm">Retry</button></p>';
        errorContainer.className = 'alert alert-danger error-alert';
        errorContainer.innerHTML = 'Failed to initialize streams: ' + error.message + '. Please try again.';
        const retryButton = document.getElementById('retryButton');
        if (retryButton) {
          retryButton.addEventListener('click', () => loadContent());
        }
      }

      // Auth status
      try {
        checkAuthStatus();
      } catch (error) {
        console.warn('Auth status check failed:', error);
      }

      console.log('Page initialized successfully');
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded at', new Date().toISOString());
      initPage();
    });
  </script>
