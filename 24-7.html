<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* 1. ARRANGEMENT LOGIC (3 Columns on Big Screens) */
    .event-grid, #livecards.event-grid {
      display: grid;
      gap: 20px;
      padding: 1rem 0;
      grid-template-columns: 1fr; /* Mobile */
    }

    @media (min-width: 768px) {
      .event-grid, #livecards.event-grid {
        grid-template-columns: repeat(2, 1fr); /* Tablet */
      }
    }

    @media (min-width: 1100px) {
      .event-grid, #livecards.event-grid {
        /* This forces exactly 3 columns like ppv.to */
        grid-template-columns: repeat(3, 1fr); 
      }
    }

    /* 2. RETAINED CARD DESIGN */
    .event-grid a { text-decoration: none; color: inherit; }
    
    .card {
      width: 100%;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #1a1d21;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s ease;
      position: relative;
      opacity: 0;
      transform: translateY(30px);
    }
    
    .card.visible { opacity: 1; transform: translateY(0); }
    .card:hover { transform: translateY(-5px); border-color: #ff4d4d; }

    /* The "LIVE" Badge */
    .live-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #dc3545;
      color: white;
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      z-index: 2;
    }

    .card-img-top {
      width: 100%;
      height: 240px; /* Keep your original card size proportions */
      object-fit: cover;
      display: block;
    }

    .card-body { padding: 1.25rem; }
    
    .card-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #3b82f6; /* Blue title from your screenshot */
      margin-bottom: 0.5rem;
    }

    .event-tag { font-size: 0.9rem; color: #888; }

    /* The "Watch" Button */
    .watch-button {
      float: right;
      background-color: #c53030;
      border: none;
      padding: 8px 20px;
      border-radius: 12px;
      color: white;
      font-size: 0.9rem;
    }

    .category-dropdown { display: flex; justify-content: center; margin: 1.5rem 0; }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content pt-5">
    <div class="container">
      <div class="category-dropdown">
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown">
            Select Category
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-category="All">All</a></li>
            <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
          </ul>
        </div>
      </div>

      <div id="live" class="mt-4">
        <h2>24/7 Streams <span id="liveAnimation" class="live-animation"></span></h2>
        <div id="livecards" class="event-grid">
          <p>Loading streams...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allStreams = [];

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      livecards.innerHTML = '';

      if (streams.length === 0) {
        livecards.innerHTML = '<p>No streams available.</p>';
        return;
      }

      streams.forEach(stream => {
        let poster = stream.poster || 'https://via.placeholder.com/400x240?text=FutbolX';
        // HTML Structure restored to match your screenshot exactly
        livecards.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}">
            <div class="card">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy">
              <div class="card-body">
                <h5 class="card-title">${stream.name}</h5>
                <div class="d-flex justify-content-between align-items-center">
                  <span class="event-tag">${stream.category}</span>
                  <button class="watch-button">Watch</button>
                </div>
              </div>
            </div>
          </a>`;
      });

      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    // Replace this with your actual API fetch call
    function loadContent() {
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            allStreams = [];
            Object.keys(data.streams).forEach(cat => {
              data.streams[cat].forEach(s => allStreams.push({...s, category: cat}));
            });
            renderStreams(allStreams);
          }
        }).catch(err => console.error(err));
    }

    document.addEventListener('DOMContentLoaded', loadContent);
  </script>
</body>
</html>
