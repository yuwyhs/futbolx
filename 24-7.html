<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    body { font-family: 'Kanit', sans-serif; transition: background-color 0.3s ease; }
    
    .card { 
      opacity: 0; 
      transform: translateY(30px); 
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(5px);
    }
    .card.visible { opacity: 1; transform: translateY(0); }
    
    .watch-button { animation: pulse 1s infinite; font-weight: 600; }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .live-dot {
      height: 12px; width: 12px; background-color: #ff4d4d;
      border-radius: 50%; display: inline-block; margin-left: 10px;
      box-shadow: 0 0 0 rgba(255, 77, 77, 0.7);
      animation: pulse-red 2s infinite; vertical-align: middle;
    }
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0.7); }
      70% { box-shadow: 0 0 0 12px rgba(255, 77, 77, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 77, 77, 0); }
    }

    .event-grid {
      display: grid;
      gap: 2rem;
      padding: 1.5rem;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    }

    .card {
      width: 100%; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); position: relative;
    }
    
    .card:hover { 
      transform: scale(1.03); 
      border-color: #ff4d4d; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.6), 0 0 15px rgba(255, 77, 77, 0.2);
    }
    
    .card-img-top { height: 200px; object-fit: cover; transition: transform 0.5s ease; }
    .card:hover .card-img-top { transform: scale(1.1); }
    
    .live-badge { 
      position: absolute; top: 12px; right: 12px; 
      background: #dc3545; color: white; padding: 3px 12px; 
      border-radius: 6px; font-size: 0.7rem; font-weight: 800; z-index: 5; 
    }
    
    .category-dropdown { margin: 2rem 0; }
  </style>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">Menu</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content pt-5">
    <div class="container">
      <div class="category-dropdown text-center">
        <div class="dropdown">
          <button class="btn btn-outline-primary dropdown-toggle px-4" type="button" id="categoryDropdown" data-bs-toggle="dropdown">
            Browse Categories
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-category="All">All Streams</a></li>
            <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
            <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
            <li><a class="dropdown-item" href="#" data-category="Kids">Kids</a></li>
            <li><a class="dropdown-item" href="#" data-category="Music">Music</a></li>
            <li><a class="dropdown-item" href="#" data-category="News">News</a></li>
            <li><a class="dropdown-item" href="#" data-category="Religion">Religion</a></li>
            <li><a class="dropdown-item" href="#" data-category="Anime">Anime</a></li>
            <li><a class="dropdown-item" href="#" data-category="Movies">Movies</a></li>
          </ul>
        </div>
      </div>

      <div id="live" class="mt-4">
        <h2 class="fw-bold mb-4">24/7 Global Streams <span class="live-dot"></span></h2>
        <div id="livecards" class="event-grid">
          <p class="text-muted">Loading streams...</p>
        </div>
      </div>

      <footer class="d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-4 border-top mt-5">
        <p class="mb-0 text-body-secondary">© FutbolX 2026</p>
        <ul class="nav">
          <li class="nav-item"><a href="/vip" class="nav-link px-2 text-primary fw-bold">Donate / VIP Access</a></li>
        </ul>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;

    function updateThemeIcon() {
      const isDark = htmlEl.getAttribute('data-bs-theme') === 'dark';
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    }
    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
      const newTheme = htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    });

    let allStreams = [];

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      livecards.innerHTML = '';
      if (streams.length === 0) {
        livecards.innerHTML = '<div class="col-12"><p class="text-center py-5">No streams found in this category.</p></div>';
        return;
      }
      streams.forEach(stream => {
        let poster = stream.poster || 'https://via.placeholder.com/350x200?text=FutbolX';
        livecards.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}" style="text-decoration:none">
            <div class="card h-100">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title text-truncate" style="color: #3b82f6;">${stream.name}</h5>
                <div class="mt-auto d-flex justify-content-between align-items-center">
                  <small class="text-muted">${stream.category}</small>
                  <button class="btn btn-danger btn-sm watch-button px-3">Watch</button>
                </div>
              </div>
            </div>
          </a>`;
      });
      
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    async function loadContent() {
      try {
        const response = await fetch('/api/stream-24-7');
        const data = await response.json();
        
        if (data && data.success && data.categories) {
          allStreams = [];
          
          // Map each category to a fetch request
          const fetchPromises = data.categories.map(cat => 
            fetch(cat.path)
              .then(res => res.json())
              .then(catData => {
                if (catData.streams) {
                  catData.streams.forEach(s => {
                    allStreams.push({ ...s, category: cat.name });
                  });
                }
              })
              .catch(err => console.error(`Error loading category ${cat.name}:`, err))
          );

          // Wait for all individual category files to load
          await Promise.all(fetchPromises);
          renderStreams(allStreams);
        }
      } catch (error) {
        console.error("Error loading index:", error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const category = item.getAttribute('data-category');
          document.getElementById('categoryDropdown').textContent = item.textContent;
          renderStreams(category === 'All' ? allStreams : allStreams.filter(s => s.category === category));
        });
      });
    });
  </script>
</body>
</html>
