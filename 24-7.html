  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>

  <script>
    window.plausible = window.plausible || function() { (window.plausible.q = window.plausible.q || []).push(arguments) };
    function clearError() {
      const errorContainer = document.getElementById('errorContainer');
      if (errorContainer && !errorContainer.classList.contains('d-none')) {
        errorContainer.classList.add('fade-out');
        setTimeout(() => {
          errorContainer.className = 'alert alert-danger error-alert mt-3 d-none';
          errorContainer.innerHTML = '';
        }, 500);
      }
    }
    function fetchWithRetry(url, maxRetries = 3, delay = 1000) {
      return new Promise((resolve, reject) => {
        let attempts = 0;
        function attempt() {
          attempts++;
          console.log(`Fetching ${url}, attempt ${attempts}`);
          fetch(url, { signal: AbortSignal.timeout(10000) })
            .then(res => {
              console.log(`Fetch status: ${res.status} ${res.statusText}`);
              if (!res.ok) {
                return res.text().then(text => {
                  throw new Error(`HTTP error ${res.status}: ${res.statusText} - ${text}`);
                });
              }
              return res.json();
            })
            .then(data => {
              clearError();
              resolve(data);
            })
            .catch(error => {
              console.error(`Fetch attempt ${attempts} failed:`, error);
              if (attempts < maxRetries) {
                setTimeout(() => attempt(), delay);
              } else {
                console.error('All fetch attempts failed:', error);
                reject(error);
              }
            });
        }
        attempt();
      });
    }
    function formatDateTime(dateTimeStr) {
      try {
        const date = new Date(dateTimeStr + '+03:00');
        if (isNaN(date.getTime())) {
          console.warn(`Invalid date string: ${dateTimeStr}`);
          return 'Invalid date';
        }
        return new Intl.DateTimeFormat('en-US', {
          month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
        }).format(date);
      } catch (e) {
        console.warn(`Error parsing date ${dateTimeStr}: ${e.message}`);
        return 'Invalid date';
      }
    }
    function initPage() {
      console.log('Initializing page at', new Date().toISOString());
      const eventsContainer = document.getElementById('eventsContainer');
      const errorContainer = document.getElementById('errorContainer');
      try {
        let api;
        if (typeof Api === 'undefined') {
          console.warn('Api class not defined. Using default API path.');
          api = { baseUrl: window.location.origin + '/api' };
        } else {
          api = new Api(`${window.location.origin}/api`);
        }
        const apiUrl = api.baseUrl.endsWith('/') ? `${api.baseUrl}stream-24-7` : `${api.baseUrl}/stream-24-7`;
        fetchWithRetry(apiUrl)
          .then(data => {
            console.log('24/7 Stream API Response:', data);
            if (!data || !data.success || !Array.isArray(data.streams)) {
              throw new Error('Invalid stream data');
            }
            const now = Math.floor(Date.now() / 1000);
            let allStreams = [];
            data.streams.forEach(category => {
              if (category.streams && Array.isArray(category.streams)) {
                allStreams.push(...category.streams);
              }
            });
            if (allStreams.length === 0) {
              throw new Error('No 24/7 streams found');
            }
            allStreams = allStreams.filter(event => {
              if (event.always_live === 1) return true;
              let startTime, endTime;
              try {
                startTime = new Date(event.starts_at + '+03:00').getTime() / 1000;
                endTime = event.ends_at ? new Date(event.ends_at + '+03:00').getTime() / 1000 : startTime + 3 * 3600;
                if (isNaN(startTime) || isNaN(endTime)) {
                  console.warn(`Invalid times for stream ${event.name}`);
                  return false;
                }
                return startTime <= now && now <= endTime;
              } catch (e) {
                console.warn(`Error parsing time for stream ${event.name}: ${e.message}`);
                return false;
              }
            });
            eventsContainer.innerHTML = allStreams.map(event => `
              <div class="event-card">
                <div class="card">
                  <img src="${event.poster || '/assets/img/placeholder.jpg'}" class="card-img-top event" alt="${event.name}">
                  <div class="card-body">
                    <h3 class="card-title non-clickable">${event.name}</h3>
                    <div class="card-text">
                      <span class="event-tag">${event.tag || 'No tag'}</span>
                      <div class="event-timer">
                        <span class="countdown">${event.always_live === 1 ? '24/7 Live' : formatDateTime(event.starts_at)}</span>
                        <a href="/live-24-7/${event.uri_name}" class="btn btn-danger btn-sm watch-button">Watch Now</a>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            `).join('');
            if (allStreams.length === 0) {
              errorContainer.className = 'alert alert-danger error-alert mt-3';
              errorContainer.innerText = 'No live 24/7 streams available at this time.';
            }
          })
          .catch(error => {
            console.error('API Fetch Error:', error);
            errorContainer.className = 'alert alert-danger error-alert mt-3';
            errorContainer.innerText = 'Failed to load 24/7 streams. Please try again.';
          });
        try {
          checkAuthStatus();
        } catch (error) {
          console.warn('Auth status check failed:', error);
        }
        console.log('Page initialized successfully');
      } catch (error) {
        console.error('Init page error:', error);
        errorContainer.className = 'alert alert-danger error-alert mt-3';
        errorContainer.innerText = 'An error occurred while initializing the page. Please try again.';
      }
    }
    document.addEventListener('DOMContentLoaded', () => {
      console.log('DOM loaded at', new Date().toISOString());
      initPage();
    });
  </script>
