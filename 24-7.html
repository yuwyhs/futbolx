<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    /* 1. LAYOUT ARRANGEMENT */
    .event-grid, #livecards.event-grid {
      display: grid;
      gap: 1.25rem;
      padding: 1rem 0;
      grid-template-columns: repeat(1, 1fr); /* Mobile: 1 column */
    }

    @media (min-width: 768px) {
      .event-grid, #livecards.event-grid {
        grid-template-columns: repeat(2, 1fr); /* Tablet: 2 columns */
      }
    }

    @media (min-width: 1024px) {
      .event-grid, #livecards.event-grid {
        grid-template-columns: repeat(3, 1fr); /* Desktop: 3 columns (As requested) */
      }
    }

    @media (min-width: 1600px) {
      .event-grid, #livecards.event-grid {
        grid-template-columns: repeat(4, 1fr); /* Ultra-wide: 4 columns */
      }
    }

    /* 2. CARD & IMAGE ARRANGEMENT */
    .event-grid a {
      text-decoration: none;
      color: inherit;
    }

    .card {
      width: 100%;
      margin: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #1a1d21;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.2s ease;
      opacity: 0; 
      transform: translateY(20px);
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Forced 16:9 Aspect Ratio like the screenshot */
    .card-img-top {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      height: auto;
      display: block;
    }

    .card-body {
      padding: 12px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .event-tag {
      font-size: 0.8rem;
      color: #8a8d91;
      text-transform: uppercase;
    }

    /* 3. UTILITIES */
    .category-dropdown { display: flex; justify-content: center; margin: 1rem 0; }
    .error-alert { max-width: 500px; margin: 20px auto; }
    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { to { opacity: 0; } }
  </style>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item">
            <button id="themeToggle" class="nav-link btn btn-link"><i class="fas fa-moon"></i></button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container pt-2">
      <div class="category-dropdown">
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown">
            Select Category
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-category="All">All</a></li>
            <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
            <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
          </ul>
        </div>
      </div>

      <div id="errorContainer" class="d-none error-alert"></div>
      
      <div id="live" class="mt-4">
        <h2>24/7 Streams <span id="liveAnimation" class="live-animation"></span></h2>
        <div id="livecards" class="event-grid">
          <p>Loading streams...</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    let allStreams = [];

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      livecards.innerHTML = '';

      if (streams.length === 0) {
        livecards.innerHTML = '<p>No streams available.</p>';
        return;
      }

      streams.forEach(stream => {
        let poster = stream.poster || 'https://via.placeholder.com/640x360?text=FutbolX';
        livecards.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}">
            <div class="card">
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy">
              <div class="card-body">
                <h5 class="card-title">${stream.name}</h5>
                <span class="event-tag">${stream.category}</span>
              </div>
            </div>
          </a>`;
      });

      // Simple intersection observer for card animation
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.05 });
      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    function loadContent() {
      // Mock API call based on your logic
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            allStreams = [];
            Object.keys(data.streams).forEach(cat => {
              data.streams[cat].forEach(s => allStreams.push({...s, category: cat}));
            });
            renderStreams(allStreams);
          }
        }).catch(err => console.error(err));
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadContent();
        // Dropdown filtering
        document.querySelectorAll('.dropdown-item').forEach(item => {
            item.addEventListener('click', (e) => {
                const cat = e.target.getAttribute('data-category');
                document.getElementById('categoryDropdown').textContent = cat;
                const filtered = cat === 'All' ? allStreams : allStreams.filter(s => s.category === cat);
                renderStreams(filtered);
            });
        });
    });
  </script>
</body>
</html>
