<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FutbolX - 24/7 Streams</title>
  <meta name="description" content="FutbolX - Watch 24/7 live sports streams including boxing, UFC, Basketball, Football, and more.">
  <meta name="keywords" content="futbolx, 24/7, live streams, boxing, ufc, basketball, football, stream, online, free">
  <link rel="preconnect" href="https://fonts.bunny.net" crossorigin="anonymous">
  <link href="https://fonts.bunny.net/css?family=kanit:100,200,300,400,500,600,700,800,900" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/main.css?v=26">
  <style>
    .error-alert { max-width: 500px; margin: 20px auto; }
    .card { 
      opacity: 0; 
      transform: translateY(50px); 
      transition: opacity 0.6s ease-out, transform 0.6s ease-out; 
    }
    .card.visible { opacity: 1; transform: translateY(0); }
    
    .watch-button { animation: pulse 1s infinite; }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* GRID FIX */
    .event-grid, #livecards.event-grid {
      display: grid;
      gap: 1.5rem;
      padding: 1rem;
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .event-grid, #livecards.event-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 1024px) {
      .event-grid, #livecards.event-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }

    .card {
      width: 100%;
      max-width: none;
      margin: 0 auto;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid transparent;
      position: relative;
    }
    .card:hover { transform: translateY(-8px); border-color: #ff4d4d; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
    .card-img-top { height: 220px; object-fit: cover; }

    /* UNIFIED LIVE BADGE STYLE */
    .live-badge {
      background-color: #dc3545;
      color: white;
      padding: 2px 10px;
      border-radius: 15px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      display: inline-block;
      vertical-align: middle;
    }

    /* Card-specific positioning */
    .card .live-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 5;
    }

    .category-dropdown { display: flex; justify-content: center; margin: 1rem 0; }
  </style>
  <script>
    (function() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-bs-theme', savedTheme);
    })();
  </script>
</head>
<body>
  <nav class="top-bar fixed-top">
    <div class="container-fluid">
      <button class="btn btn-dark" type="button" id="sidebarToggler" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu">
        <i class="fas fa-bars"></i>
      </button>
      <span class="futbolx-brand">FutbolX</span>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">
    <div class="offcanvas-header">
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <ul class="nav flex-column">
        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/request">Request</a></li>
        <li class="nav-item"><a class="nav-link" href="/vods">VODs</a></li>
        <li class="nav-item"><a class="nav-link" href="/24-7">24/7</a></li>
        <li class="nav-item"><a class="nav-link" href="https://discord.gg/CmRcPbBB2k">Discord</a></li>
        <li class="nav-item"><a class="nav-link" href="/vip">VIP</a></li>
        <li class="nav-item"><a class="nav-link" href="/auth/login" id="loginLink">Login</a></li>
        <li class="nav-item">
          <button id="themeToggle" class="nav-link btn btn-link">
            <i class="fas fa-moon"></i>
          </button>
        </li>
      </ul>
    </div>
  </div>

  <div class="container-fluid main-content">
    <div class="container pt-2">
      <div class="category-dropdown">
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="categoryDropdown" data-bs-toggle="dropdown">Select Category</button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#" data-category="All">All</a></li>
            <li><a class="dropdown-item" href="#" data-category="Sports">Sports</a></li>
            <li><a class="dropdown-item" href="#" data-category="Entertainment">Entertainment</a></li>
            <li><a class="dropdown-item" href="#" data-category="Kids">Kids</a></li>
            <li><a class="dropdown-item" href="#" data-category="Music">Music</a></li>
            <li><a class="dropdown-item" href="#" data-category="Movies VOD">Movies VOD</a></li>
            <li><a class="dropdown-item" href="#" data-category="News">News</a></li>
            <li><a class="dropdown-item" href="#" data-category="Religion">Religion</a></li>
            <li><a class="dropdown-item" href="#" data-category="Anime">Anime</a></li>
            <li><a class="dropdown-item" href="#" data-category="Movies Live">Movies Live</a></li>
          </ul>
        </div>
      </div>

      <div id="live" class="mt-4">
        <h2>24/7 Streams <span id="liveAnimation" class="live-badge ms-2">LIVE</span></h2>
        <div id="livecards" class="event-grid py-3">
          <p>Loading streams...</p>
        </div>
      </div>

      <footer class="container-fluid d-flex flex-column flex-lg-row justify-content-lg-between align-items-center py-2 border-top mt-5">
        <p class="mb-2 mb-lg-0 text-body-secondary">FutbolX 2026</p>
        <ul class="nav justify-content-center justify-content-lg-end mb-0">
          <li class="nav-item"><a href="/vip" class="nav-link px-2 text-body-secondary">Donate / VIP Access</a></li>
        </ul>
      </footer>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const themeToggle = document.getElementById('themeToggle');
    const htmlEl = document.documentElement;

    function updateThemeIcon() {
      const isDark = htmlEl.getAttribute('data-bs-theme') === 'dark';
      themeToggle.innerHTML = isDark ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    }
    updateThemeIcon();

    themeToggle.addEventListener('click', () => {
      const newTheme = htmlEl.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark';
      htmlEl.setAttribute('data-bs-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon();
    });

    let allStreams = [];

    function renderStreams(streams) {
      const livecards = document.getElementById('livecards');
      livecards.innerHTML = '';
      if (streams.length === 0) {
        livecards.innerHTML = '<p>No streams available for this category.</p>';
        return;
      }
      streams.forEach(stream => {
        let poster = stream.poster || 'https://via.placeholder.com/285x160?text=FutbolX';
        livecards.innerHTML += `
          <a href="/live-24-7/${stream.uri_name}" style="text-decoration:none">
            <div class="card">
              <span class="live-badge">LIVE</span>
              <img src="${poster}" class="card-img-top" alt="${stream.name}" loading="lazy">
              <div class="card-body">
                <h5 class="card-title" style="color: #3b82f6;">${stream.name}</h5>
                <p class="card-text">
                  <span class="event-tag" style="color: #888;">${stream.category}</span>
                  <span class="float-end">
                    <button class="btn btn-danger btn-sm watch-button">Watch</button>
                  </span>
                </p>
              </div>
            </div>
          </a>`;
      });
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => { if (entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } });
      }, { threshold: 0.1 });
      document.querySelectorAll('.card').forEach(card => observer.observe(card));
    }

    function loadContent() {
      fetch('/api/stream-24-7')
        .then(res => res.json())
        .then(data => {
          if (data && data.success) {
            allStreams = [];
            Object.keys(data.streams).forEach(cat => {
              data.streams[cat].forEach(s => allStreams.push({ ...s, category: cat }));
            });
            renderStreams(allStreams);
          }
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadContent();
      document.querySelectorAll('.dropdown-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.preventDefault();
          const category = item.getAttribute('data-category');
          document.getElementById('categoryDropdown').textContent = category;
          renderStreams(category === 'All' ? allStreams : allStreams.filter(s => s.category === category));
        });
      });
    });
  </script>
</body>
</html>
